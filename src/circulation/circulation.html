  {
    "imports": {

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    




    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 讲解文案（卡片 / 语音共用一份） --------- */
    // 优先用 info.say（写给"耳朵"的口语讲解），没有时用结构化字段拼一句
    function narrate(info) {
      if (!info) return '';
      if (info.say) return info.say;
      const parts = [info.name + '。'];
      if (info.type) parts.push(info.type + '。');
      if (info.stats && info.stats.length) {
        parts.push(info.stats.map((s) => s.label + '，' + s.value).join('。') + '。');
      }
      if (info.desc && info.desc.length) parts.push(info.desc.join('。'));
      return parts.join('').replace(/。{2,}/g, '。');
    }
    
    /* ---------------- 语音（神经语音包优先，浏览器语音兜底） ---------------- */
    /**
     * 两级语音方案：
     *   1) 预生成的神经语音包（edge-tts 晓晓 / 云希等）—— 音质接近真人，
     *      文件命名 v_<id>.mp3，放在 audioBase 目录下，离线可用、无密钥。
     *   2) 浏览器 speechSynthesis —— 语音包里没有这句时兜底，并做了音色排序
     *      （优先云端自然音 / 增强音色）与按句切分，比直接取第一个中文音色自然得多。
     *
     * 用法：const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
     *       voice.speak(S.narrate(data), data.voiceId);
     */
    function createVoice(opts) {
      opts = opts || {};
      const audioBase = opts.audioBase || null;   // 语音包目录，留空则纯浏览器语音
      const synth = window.speechSynthesis || null;
      let enabled = true;
      let zhVoice = null;
      let audioEl = null;
      let seq = 0;                                 // 打断计数：切天体时丢弃旧队列
      const missing = Object.create(null);         // 语音包里不存在的 id，只探测一次
    
      /* --- 音色挑选：给候选中文音色打分，取最自然的一个 --- */
      function score(v) {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        let s = 0;
        if (/xiaoxiao|xiaoyi|yunxi|yunjian|晓晓|云希|云扬/.test(name)) s += 60;
        if (/natural|neural|premium|enhanced|自然/.test(name)) s += 40;
        if (/google/.test(name)) s += 32;                 // Chrome 云端音，韵律较自然
        if (/ting-?ting|tingting|meijia|sinji|婷婷|美佳|善怡|美嘉/.test(name)) s += 24;
        if (/^zh[-_]?cn|cmn|^zh$/.test(lang)) s += 18;
        if (/^zh[-_]?(hk|tw)|yue/.test(lang)) s -= 14;    // 粤语 / 台湾腔，普通话场景降权
        if (v.localService) s += 6;                       // 本地音：断网也能用
        return s;
      }
      function pick() {
        if (!synth || !synth.getVoices) return;
        const all = synth.getVoices() || [];
        const zh = all.filter((v) => /^zh|cmn|yue/i.test(v.lang || ''));
        if (!zh.length) return;
        zhVoice = zh.slice().sort((a, b) => score(b) - score(a))[0] || null;
      }
      if (synth) {
        pick();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', pick);
      }
    
      /* --- 兜底：浏览器语音，按句切开逐句念，停顿更自然 --- */
      function chunk(text) {
        const parts = String(text).replace(/\s+/g, '').match(/[^。！？；!?]+[。！？；!?]?/g) || [];
        const out = [];
        let buf = '';
        parts.forEach((p) => {
          if (buf && (buf + p).length > 46) { out.push(buf); buf = p; }
          else buf += p;
        });
        if (buf) out.push(buf);
        return out.length ? out : [String(text)];
      }
      function speakTTS(text) {
        if (!synth || !text) return;
        const mySeq = ++seq;
        const chunks = chunk(text);
        let i = 0;
        const next = () => {
          if (!enabled || mySeq !== seq || i >= chunks.length) return;
          const u = new SpeechSynthesisUtterance(chunks[i++]);
          u.lang = 'zh-CN';
          u.rate = 0.98;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (!zhVoice) pick();
          if (zhVoice) u.voice = zhVoice;
          u.onend = () => setTimeout(next, 90);
          u.onerror = () => {};
          synth.speak(u);
        };
        // Chrome 在 cancel() 之后立刻 speak() 偶发静音，等一小会儿再开口
        setTimeout(next, 60);
      }
    
      /* --- 首选：播放语音包 --- */
      function playPack(id, text) {
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.preload = 'auto';
        }
        const el = audioEl;
        let done = false;
        const fallback = () => {
          if (done) return;
          done = true;
          missing[id] = true;
          speakTTS(text);
        };
        el.onerror = fallback;
        el.onplaying = () => { el.onerror = null; };
        el.src = audioBase + 'v_' + id + '.mp3';
        const p = el.play();
        if (p && p.catch) p.catch(fallback);
      }
    
      function speak(text, id) {
        if (!enabled || !text) return;
        if (id && audioBase && !missing[id]) {
          seq++;                      // 打断上一句（浏览器语音队列）
          if (synth) synth.cancel();
          playPack(id, text);
          return;
        }
        if (audioEl) audioEl.pause();
        if (synth) synth.cancel();
        speakTTS(text);
      }
      function stop() {
        seq++;
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        if (synth) synth.cancel();
      }
      function toggle() {
        enabled = !enabled;
        if (!enabled) stop();
        return enabled;
      }
      return { speak, stop, toggle, isEnabled: () => enabled, hasPack: !!audioBase };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      // 页面里已有 .sv-card 容器时直接复用，避免套娃出两层透明卡片
      const host = container && container.nodeType === 1 ? container : document.body;
      let el;
      if (host.classList && host.classList.contains('sv-card')) {
        el = host;
      } else {
        el = document.createElement('div');
        el.className = 'sv-card';
        host.appendChild(el);
      }
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span>' + s.label + '</span><b>' + s.value + '</b>';
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        el.classList.add('is-open');
      }
      function hide() { el.classList.remove('is-open'); }
      close.addEventListener('click', hide);
      return { element: el, show, hide };
    }
    
    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const hits = raycaster.intersectObjects(targets, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          const th = u * Math.PI * 2;
          const nx = Math.cos(th) * 3, ny = Math.sin(th) * 3;
          const n = fbm2(nx + 1.7, v * 5 - ny * 0.4, 5);
          const n2 = fbm2(nx * 2.3 + 9.1, v * 7 + 3.3, 4);
          let t = clamp(n * 0.7 + n2 * 0.3, 0, 1);
          const col = sampleBands(bands, t);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function sampleBands(bands, t) {
      const seg = 1 / (bands.length - 1);
      const idx = Math.min(Math.floor(t / seg), bands.length - 2);
      const local = (t - idx * seg) / seg;
      return bands[idx].clone().lerp(bands[idx + 1], local);
    }
    
    // 恐龙皮肤纹理（鳞片噪声 + 色斑 + 腹部渐变）
    function skinTexture(baseColor, spotColor, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const base = new THREE.Color(baseColor);
      const spot = new THREE.Color(spotColor);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          // 鳞片：高频网格噪声
          const scale = fbm2(u * 18, v * 18, 4);
          const scale2 = fbm2(u * 40 + 3, v * 40 + 7, 3);
          // 色斑：低频大块斑纹
          const spotN = fbm2(u * 6 + 11, v * 6 - 5, 4);
          let col = base.clone();
          col.lerp(spot, S.clamp((spotN - 0.42) * 3.0, 0, 1) * 0.5);
          // 鳞片刻痕（微亮/微暗）
          const sheen = (scale2 - 0.5) * 0.16 + (scale - 0.5) * 0.08;
          col.r = S.clamp(col.r + sheen, 0, 1);
          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    
    /* ---------------- 星空（分层 + 大小/亮度变化） --------- */
    function createStarfield(count, radius, color1, color2) {
      count = count || 1400;
      radius = radius || 240;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c1 = new THREE.Color(color1 || 0xffffff);
      const c2 = new THREE.Color(color2 || 0xaac4ff);
      for (let i = 0; i < count; i++) {
        const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1)
          .normalize().multiplyScalar(radius);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
        const c = c1.clone().lerp(c2, Math.random());
        const b = 0.4 + Math.random() * 0.6;
        col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.5, vertexColors: true, transparent: true, opacity: 0.85,
        sizeAttenuation: true, depthWrite: false,
      });
      return new THREE.Points(geo, mat);
    }
    
    /* ---------------- UI 助手 --------- */
    // 创建 3D 标签（需传入 CSS2DObject 构造器）并定位
    function makeLabel(CSS2DObject, text, position, className) {
      const div = document.createElement('div');
      div.className = className || 'sv-label';
      div.textContent = text;
      const obj = new CSS2DObject(div);
      if (position) obj.position.copy(position);
      return obj;
    }
    
    function toast(text, ms) {  let el = document.querySelector('.sv-toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'sv-toast';
        document.body.appendChild(el);
      }
      el.textContent = text;
      el.classList.add('is-open');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('is-open'), ms || 2200);
    }
    function bindVoiceButton(btn, voice) {
      if (!btn) return;
      const sync = () => btn.classList.toggle('is-off', !voice.isEnabled());
      sync();
      btn.addEventListener('click', () => { voice.toggle(); sync(); });
    }
    
    // 具名导出集合（供 init 返回全部 API）
    const exports = {
      init, hash3, valueNoise2, fbm2, clamp, lerp,
      createRenderer, createScene, createCamera, createControls,
      makeFly, createVoice, narrate, createCard, makePicker, makeLabel,
      glowTexture, planetTexture, skinTexture, createStarfield,
      toast, bindVoiceButton,
    };
    
    
    return exports;
    })();


    const S = SciVis.init(THREE, { OrbitControls, EffectComposer, RenderPass, UnrealBloomPass });

    /* ================= 科普数据 ================= */
    const INFO = {
      心脏: {
        color: 0xd23b46, type: '器官',
        stats: [['每分钟跳动','60~100 次'],['每日泵血','约 7000 升'],['大小','与拳头相当'],['位置','胸腔中部略偏左']],
        desc: ['像一个不知疲倦的强力泵', '把血液输送到全身每个角落'],
      },
      肺: {
        color: 0xffb3b8, type: '器官',
        stats: [['肺泡数量','约 3 亿个'],['表面积','约 70 ㎡'],['位置','胸腔左右各一']],
        desc: ['气体交换的场所', '血液在这里获得新鲜氧气'],
      },
      动脉: {
        color: 0xff5566, type: '血管',
        stats: [['管壁','厚而弹性强'],['血色','鲜红（含氧）'],['流速','最快']],
        desc: ['把含氧血从心脏送出去', '分布较深，靠近骨骼'],
      },
      静脉: {
        color: 0x3b82f6, type: '血管',
        stats: [['管壁','薄而有瓣膜'],['血色','暗红（缺氧）'],['流速','较慢']],
        desc: ['把血液送回心脏', '手臂上的"青筋"就是静脉'],
      },
      肺循环: {
        color: 0xa855f7, type: '循环',
        stats: [['路径','心脏 ↔ 肺'],['耗时','约 10 秒'],['功能','补充氧气']],
        desc: ['血液在心肺之间的小循环', '暗血变鲜血的魔法环节'],
      },
    };

    /* ================= 渲染基础 ================= */
    const scene = S.createScene(0x060a16, new THREE.Fog(0x060a16, 16, 36));
    const camera = S.createCamera(48, 0.1, 200);
    camera.position.set(0.6, 3.6, 8.5);

    const { renderer, composer, renderPass } = S.createRenderer({
      exposure: 1.15, bloomStrength: 0.9, bloomRadius: 0.6, bloomThreshold: 0.6,
    });
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const controls = S.createControls(camera, renderer.domElement, new THREE.Vector3(0, 3.3, 0));
    controls.minDistance = 2.5;
    controls.maxDistance = 20;
    renderPass.scene = scene;
    renderPass.camera = camera;

    // 灯光
    scene.add(new THREE.AmbientLight(0x556688, 0.9));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(4, 6, 5);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x7f9fff, 0.9);
    rimLight.position.set(-5, 3, -4);
    scene.add(rimLight);

    // 地面光晕（垫在脚下）
    const floorGlow = new THREE.Mesh(
      new THREE.CircleGeometry(4, 48),
      new THREE.MeshBasicMaterial({
        map: S.glowTexture('rgba(60,90,180,0.35)', 'rgba(40,60,120,0.12)'),
        transparent: true, depthWrite: false,
      })
    );
    floorGlow.rotation.x = -Math.PI / 2;
    floorGlow.position.y = -0.02;
    scene.add(floorGlow);

    /* ================= 器官材质 ================= */
    const heartMat = new THREE.MeshPhysicalMaterial({
      color: 0xd23b46, emissive: 0x5c1018, emissiveIntensity: 0.5,
      roughness: 0.35, clearcoat: 0.8, clearcoatRoughness: 0.25,
    });
    const lungMat = new THREE.MeshPhysicalMaterial({
      color: 0xffb3b8, transparent: true, opacity: 0.55,
      roughness: 0.5, emissive: 0x552028, emissiveIntensity: 0.25,
    });

    /* ================= 霓虹血管（流光 shader） ================= */
    const vesselShaders = [];
    function vesselMaterial(hex) {
      const color = new THREE.Color(hex);
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        uniforms: {
          uColor: { value: color },
          uTime: { value: 0 },
          uOpacity: { value: 0.75 },
        },
        vertexShader: `
          varying vec2 vUv;
          void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: `
          varying vec2 vUv;
          uniform vec3 uColor;
          uniform float uTime;
          uniform float uOpacity;
          void main(){
            // 沿管道方向流动的光脉冲
            float flow = fract(vUv.y * 3.0 - uTime * 0.35);
            float pulse = smoothstep(0.0, 0.25, flow) * smoothstep(0.75, 0.25, flow);
            vec3 col = uColor * (0.55 + pulse * 2.2);
            gl_FragColor = vec4(col, uOpacity * (0.35 + pulse * 0.65));
          }`,
      });
      vesselShaders.push(mat);
      return mat;
    }

    /* ================= 人体加载 + 骨骼定位 ================= */
    const clickable = [];
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/Michelle.glb';
    const TARGET_HEIGHT = 4.6;
    let heart = null, chestMid = 3.1, hx = 0.5;

    function makeLabel(text, color) {
      const div = document.createElement('div');
      div.className = 'sv-label';
      div.textContent = text;
      if (color) div.style.borderColor = 'rgba(' + color + ',0.6)';
      return new CSS2DObject(div);
    }
    function addLabel(text, color, position) {
      const obj = makeLabel(text, color);
      obj.position.copy(position);
      scene.add(obj);
      return obj;
    }

    function buildOrgans() {
      // 心脏
      heart = new THREE.Group();
      const m = 0.85;
      const heartBody = new THREE.Mesh(new THREE.SphereGeometry(0.3 * m, 32, 32), heartMat);
      heartBody.scale.set(1, 1.2, 0.85);
      const heartTip = new THREE.Mesh(new THREE.ConeGeometry(0.2 * m, 0.5 * m, 20), heartMat);
      heartTip.rotation.x = Math.PI / 2;
      heartTip.position.y = -0.62 * m;
      heart.add(heartBody, heartTip);
      const heartPos = new THREE.Vector3(-hx * 0.5, chestMid + 0.05, hx * 0.35);
      heart.position.copy(heartPos);
      heart.rotation.z = 0.25;
      heart.userData = INFO['心脏'];
      scene.add(heart);
      clickable.push(heart);
      addLabel('心脏', '255,85,102', heartPos.clone().add(new THREE.Vector3(0, 0.8, 0)));

      // 肺
      [-1, 1].forEach((side) => {
        const lung = new THREE.Mesh(new THREE.CapsuleGeometry(0.22 * m, 0.55 * m, 8, 20), lungMat);
        lung.scale.set(1, 1.1, 0.62);
        const p = new THREE.Vector3(side * hx * 0.7, chestMid - 0.05, hx * 0.2);
        lung.position.copy(p);
        lung.rotation.z = -side * 0.12;
        lung.userData = INFO['肺'];
        scene.add(lung);
        clickable.push(lung);
        addLabel('肺', '255,179,184', p.clone().add(new THREE.Vector3(side * 0.3, 0.55, 0)));
      });

      // 血管曲线（收在躯干内）
      const curves = {
        artery: makeCurve([
          heartPos.toArray(),
          [heartPos.x * 0.2, chestMid + 0.28, heartPos.z - 0.06],
          [-hx * 0.45, chestMid + 0.18, heartPos.z - 0.03],
          [-hx * 0.62, chestMid - 0.04, heartPos.z],
          [-hx * 0.55, chestMid - 0.2, heartPos.z],
          [-hx * 0.2, chestMid - 0.33, heartPos.z],
          [hx * 0.3, chestMid - 0.2, heartPos.z],
          [hx * 0.55, chestMid - 0.01, heartPos.z],
          [hx * 0.5, chestMid + 0.12, heartPos.z - 0.03],
          [heartPos.x * 0.4, chestMid + 0.08, heartPos.z],
        ]),
        vein: makeCurve([
          heartPos.toArray(),
          [-hx * 0.4, chestMid + 0.22, heartPos.z - 0.07],
          [-hx * 0.3, chestMid, heartPos.z - 0.08],
          [0, chestMid - 0.27, heartPos.z - 0.08],
          [hx * 0.35, chestMid - 0.06, heartPos.z - 0.08],
          [hx * 0.42, chestMid + 0.17, heartPos.z - 0.05],
          [heartPos.x * 0.4, chestMid + 0.1, heartPos.z],
        ]),
        pulmonary: makeCurve([
          heartPos.toArray(),
          [hx * 0.55, chestMid + 0.1, heartPos.z - 0.04],
          [hx * 0.72, chestMid, heartPos.z - 0.1],
          [-hx * 0.2, chestMid + 0.04, heartPos.z - 0.14],
          [-hx * 0.72, chestMid, heartPos.z - 0.1],
          [-hx * 0.55, chestMid + 0.1, heartPos.z - 0.04],
        ]),
      };

      const colors = { artery: 0xff5566, vein: 0x3b82f6, pulmonary: 0xa855f7 };
      const flowCurves = [];
      const labelOffsets = { artery: new THREE.Vector3(-0.9, 0.1, 0), vein: new THREE.Vector3(0.9, -0.25, 0), pulmonary: new THREE.Vector3(0.1, 0.55, 0) };
      Object.keys(curves).forEach((k) => {
        scene.add(new THREE.Mesh(
          new THREE.TubeGeometry(curves[k], 160, 0.04, 8, true),
          vesselMaterial(colors[k])
        ));
        const mid = curves[k].getPointAt(0.5);
        const labelName = { artery: '动脉', vein: '静脉', pulmonary: '肺循环' }[k];
        const rgb = new THREE.Color(colors[k]);
        const rgba = Math.round(rgb.r * 255) + ',' + Math.round(rgb.g * 255) + ',' + Math.round(rgb.b * 255);
        addLabel(labelName, rgba, mid.clone().add(labelOffsets[k]));
        flowCurves.push(curves[k]);
      });

      // 血液粒子（instanced + additive）
      buildParticles(flowCurves);
    }

    function makeCurve(pts) {
      return new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(...p)), true, 'catmullrom', 0.6);
    }

    /* ================= 血液粒子 ================= */
    const PARTICLE_COUNT = 240;
    let particleMesh = null;
    const particleData = [];

    function buildParticles(curves) {
      const geo = new THREE.SphereGeometry(0.045, 8, 8);
      const mat = new THREE.MeshBasicMaterial({
        color: 0xff8899, transparent: true, opacity: 0.9,
        blending: THREE.AdditiveBlending, depthWrite: false,
      });
      particleMesh = new THREE.InstancedMesh(geo, mat, PARTICLE_COUNT);
      particleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(particleMesh);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particleData.push({
          curve: curves[i % curves.length],
          t: Math.random(),
          speed: 0.12 + Math.random() * 0.12,
        });
      }
    }

    const dummy = new THREE.Object3D();
    function updateParticles(dt) {
      if (!particleMesh) return;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particleData[i];
        p.t = (p.t + dt * p.speed) % 1;
        p.curve.getPointAt(p.t, dummy.position);
        dummy.updateMatrix();
        particleMesh.setMatrixAt(i, dummy.matrix);
      }
      particleMesh.instanceMatrix.needsUpdate = true;
    }

    /* ================= 模型加载 ================= */
    const loader = new GLTFLoader();
    loader.load(MODEL_URL, (gltf) => {
      const body = gltf.scene;
      scene.add(body);

      // 蒙皮模型：骨骼世界坐标估算身体范围
      body.updateWorldMatrix(true, true);
      const box = new THREE.Box3();
      body.traverse((o) => { if (o.isBone) box.expandByPoint(o.getWorldPosition(new THREE.Vector3())); });
      if (box.isEmpty()) box.setFromObject(body);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const scale = TARGET_HEIGHT / size.y;
      const FOOT_ALLOWANCE = 0.09;
      body.scale.setScalar(scale);
      body.position.set(0, (size.y / 2 + FOOT_ALLOWANCE - center.y) * scale, 0);
      body.rotation.y = Math.PI;

      // 半透明 X 光质感
      bodyMats.length = 0;
      body.traverse((o) => {
        if (o.isMesh && o.material) {
          o.material.transparent = true;
          o.material.opacity = xray;
          o.material.depthWrite = false;
          bodyMats.push(o.material);
        }
      });

      body.userData = { name: '人体', type: '身体', color: 0x8899cc, info: null, desc: ['血液由心脏泵出，流遍全身', '送氧气营养，带走废物', '这就是血液循环'] };
      clickable.push(body);

      // 用骨骼定位胸腔
      let neckY = -1e9, hipsY = 1e9, shoulderX = 0;
      body.traverse((o) => {
        if (!o.isBone) return;
        const p = o.getWorldPosition(new THREE.Vector3());
        if (/neck/i.test(o.name)) neckY = Math.max(neckY, p.y);
        if (/hips?$/i.test(o.name)) hipsY = Math.min(hipsY, p.y);
        if (/shoulder/i.test(o.name)) shoulderX = Math.max(shoulderX, Math.abs(p.x));
      });
      if (neckY > -1e8 && hipsY < 1e8) {
        chestMid = (neckY + hipsY) / 2 - 0.15;
        hx = Math.max(shoulderX * 0.8, 0.35);
      } else {
        chestMid = TARGET_HEIGHT * 0.66;
        hx = 0.5;
      }

      buildOrgans();

      // 构图：镜头对准胸腔
      camera.position.set(0.6, chestMid + 0.35, 6.8);
      camera.lookAt(0, chestMid, 0);
      controls.target.set(0, chestMid, 0);

      document.getElementById('loader').classList.add('is-done');
    }, undefined, (err) => {
      console.error('模型加载失败', err);
      chestMid = 3.1; hx = 0.5;
      buildOrgans();
      camera.position.set(0.6, 3.4, 7);
      camera.lookAt(0, 3.1, 0);
      controls.target.set(0, 3.1, 0);
      document.getElementById('loader').classList.add('is-done');
    });

    /* ================= 交互 ================= */
    const voice = S.createVoice();
    S.bindVoiceButton(document.getElementById('voiceBtn'), voice);
    const card = S.createCard(document.getElementById('card') || document.body);
    const picker = S.makePicker(camera, renderer.domElement);
    const fly = S.makeFly(camera, controls);

    picker.onHover(clickable, (obj) => {
      renderer.domElement.style.cursor = obj ? 'pointer' : 'grab';
    });
    picker.onClick(clickable, (obj) => {
      if (!obj) return;
      const d = obj.userData;
      if (!d || !d.name) return;
      card.show(d);
      voice.speak(d.name + '。' + (d.stats || []).map((s) => s.label + s.value).join('，') + '。' + (d.desc || []).join('，'));
      const t = new THREE.Vector3();
      obj.getWorldPosition(t);
      const dist = d.name === '人体' ? 7 : 2.6;
      const dir = camera.position.clone().sub(t).normalize();
      fly.flyTo(t.clone().add(dir.multiplyScalar(dist)), t, 1.0);
    });

    /* ================= 控件 ================= */
    let isPlaying = true;
    const clock = new THREE.Clock();
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying ? '<span class="sv-btn__icon">⏸</span><span>暂停</span>' : '<span class="sv-btn__icon">▶</span><span>播放</span>';
      if (!isPlaying) clock.getDelta();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      fly.flyTo(new THREE.Vector3(0.6, chestMid + 0.35, 6.8), new THREE.Vector3(0, chestMid, 0), 1.2);
    });

    let xray = 0.3;
    const bodyMats = [];
    const xrayBtn = document.getElementById('xrayBtn');
    const xrayVal = document.getElementById('xrayVal');
    xrayBtn.addEventListener('click', () => {
      xray = xray >= 0.9 ? 0.1 : xray + 0.2;
      xrayVal.textContent = Math.round(xray * 100);
      bodyMats.forEach((m) => { m.opacity = xray; });
    });

    /* ================= 动画 ================= */
    function animate() {
      const dt = clock.getDelta();
      if (isPlaying) {
        // 心跳双节拍（lub-dub）
        const t = performance.now() / 1000;
        const beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 1.2)), 6) * 0.12
                   + Math.pow(Math.max(0, Math.sin((t - 0.22) * Math.PI * 1.2)), 6) * 0.07;
        if (heart) heart.scale.setScalar(1 + beat);
        // 血管流光
        vesselShaders.forEach((m) => { m.uniforms.uTime.value += dt; });
        // 粒子
        updateParticles(dt);
      }
      fly.update(dt);
      controls.update();
      labelRenderer.render(scene, camera);
      composer.render();
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
