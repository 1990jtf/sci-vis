  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        
    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 讲解文案（卡片 / 语音共用一份） --------- */
    // 优先用 info.say（写给"耳朵"的口语讲解），没有时用结构化字段拼一句
    function narrate(info) {
      if (!info) return '';
      if (info.say) return info.say;
      const parts = [info.name + '。'];
      if (info.type) parts.push(info.type + '。');
      if (info.stats && info.stats.length) {
        parts.push(info.stats.map((s) => s.label + '，' + s.value).join('。') + '。');
      }
      if (info.desc && info.desc.length) parts.push(info.desc.join('。'));
      return parts.join('').replace(/。{2,}/g, '。');
    }
    
    /* ---------------- 语音（神经语音包优先，浏览器语音兜底） ---------------- */
    /**
     * 两级语音方案：
     *   1) 预生成的神经语音包（edge-tts 晓晓 / 云希等）—— 音质接近真人，
     *      文件命名 v_<id>.mp3，放在 audioBase 目录下，离线可用、无密钥。
     *   2) 浏览器 speechSynthesis —— 语音包里没有这句时兜底，并做了音色排序
     *      （优先云端自然音 / 增强音色）与按句切分，比直接取第一个中文音色自然得多。
     *
     * 用法：const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
     *       voice.speak(S.narrate(data), data.voiceId);
     */
    function createVoice(opts) {
      opts = opts || {};
      const audioBase = opts.audioBase || null;   // 语音包目录，留空则纯浏览器语音
      const synth = window.speechSynthesis || null;
      let enabled = true;
      let zhVoice = null;
      let audioEl = null;
      let seq = 0;                                 // 打断计数：切天体时丢弃旧队列
      const missing = Object.create(null);         // 语音包里不存在的 id，只探测一次
    
      /* --- 音色挑选：给候选中文音色打分，取最自然的一个 --- */
      function score(v) {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        let s = 0;
        if (/xiaoxiao|xiaoyi|yunxi|yunjian|晓晓|云希|云扬/.test(name)) s += 60;
        if (/natural|neural|premium|enhanced|自然/.test(name)) s += 40;
        if (/google/.test(name)) s += 32;                 // Chrome 云端音，韵律较自然
        if (/ting-?ting|tingting|meijia|sinji|婷婷|美佳|善怡|美嘉/.test(name)) s += 24;
        if (/^zh[-_]?cn|cmn|^zh$/.test(lang)) s += 18;
        if (/^zh[-_]?(hk|tw)|yue/.test(lang)) s -= 14;    // 粤语 / 台湾腔，普通话场景降权
        if (v.localService) s += 6;                       // 本地音：断网也能用
        return s;
      }
      function pick() {
        if (!synth || !synth.getVoices) return;
        const all = synth.getVoices() || [];
        const zh = all.filter((v) => /^zh|cmn|yue/i.test(v.lang || ''));
        if (!zh.length) return;
        zhVoice = zh.slice().sort((a, b) => score(b) - score(a))[0] || null;
      }
      if (synth) {
        pick();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', pick);
      }
    
      /* --- 兜底：浏览器语音，按句切开逐句念，停顿更自然 --- */
      function chunk(text) {
        const parts = String(text).replace(/\s+/g, '').match(/[^。！？；!?]+[。！？；!?]?/g) || [];
        const out = [];
        let buf = '';
        parts.forEach((p) => {
          if (buf && (buf + p).length > 46) { out.push(buf); buf = p; }
          else buf += p;
        });
        if (buf) out.push(buf);
        return out.length ? out : [String(text)];
      }
      function speakTTS(text) {
        if (!synth || !text) return;
        const mySeq = ++seq;
        const chunks = chunk(text);
        let i = 0;
        const next = () => {
          if (!enabled || mySeq !== seq || i >= chunks.length) return;
          const u = new SpeechSynthesisUtterance(chunks[i++]);
          u.lang = 'zh-CN';
          u.rate = 0.98;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (!zhVoice) pick();
          if (zhVoice) u.voice = zhVoice;
          u.onend = () => setTimeout(next, 90);
          u.onerror = () => {};
          synth.speak(u);
        };
        // Chrome 在 cancel() 之后立刻 speak() 偶发静音，等一小会儿再开口
        setTimeout(next, 60);
      }
    
      /* --- 首选：播放语音包 --- */
      function playPack(id, text) {
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.preload = 'auto';
        }
        const el = audioEl;
        let done = false;
        const fallback = () => {
          if (done) return;
          done = true;
          missing[id] = true;
          speakTTS(text);
        };
        el.onerror = fallback;
        el.onplaying = () => { el.onerror = null; };
        el.src = audioBase + 'v_' + id + '.mp3';
        const p = el.play();
        if (p && p.catch) p.catch(fallback);
      }
    
      function speak(text, id) {
        if (!enabled || !text) return;
        if (id && audioBase && !missing[id]) {
          seq++;                      // 打断上一句（浏览器语音队列）
          if (synth) synth.cancel();
          playPack(id, text);
          return;
        }
        if (audioEl) audioEl.pause();
        if (synth) synth.cancel();
        speakTTS(text);
      }
      function stop() {
        seq++;
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        if (synth) synth.cancel();
      }
      function toggle() {
        enabled = !enabled;
        if (!enabled) stop();
        return enabled;
      }
      return { speak, stop, toggle, isEnabled: () => enabled, hasPack: !!audioBase };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      // 页面里已有 .sv-card 容器时直接复用，避免套娃出两层透明卡片
      const host = container && container.nodeType === 1 ? container : document.body;
      let el;
      if (host.classList && host.classList.contains('sv-card')) {
        el = host;
      } else {
        el = document.createElement('div');
        el.className = 'sv-card';
        host.appendChild(el);
      }
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            // 兼容两种写法：[label, value] 数组 或 { label, value } 对象
            const label = Array.isArray(s) ? s[0] : s.label;
            const value = Array.isArray(s) ? s[1] : s.value;
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span></span><b></b>';
            row.querySelector('span').textContent = label == null ? '' : label;
            row.querySelector('b').textContent = value == null ? '' : value;
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        if (data.facts && data.facts.length) {
          data.facts.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__fact';
            row.innerHTML = '<i>\uD83D\uDCA1</i><span></span>';
            row.querySelector('span').textContent = line;
            body.appendChild(row);
          });
        }
        el.classList.add('is-open');
      }
      function hide() { el.classList.remove('is-open'); }
      close.addEventListener('click', hide);
      return { element: el, show, hide };
    }
    
    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      // targets 可以是数组，也可以是返回数组的函数（换场景后数组会被整体替换）
      const resolve = (targets) => (typeof targets === 'function' ? targets() : targets) || [];
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const list = resolve(targets);
        const hits = raycaster.intersectObjects(list, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          const th = u * Math.PI * 2;
          const nx = Math.cos(th) * 3, ny = Math.sin(th) * 3;
          const n = fbm2(nx + 1.7, v * 5 - ny * 0.4, 5);
          const n2 = fbm2(nx * 2.3 + 9.1, v * 7 + 3.3, 4);
          let t = clamp(n * 0.7 + n2 * 0.3, 0, 1);
          const col = sampleBands(bands, t);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function sampleBands(bands, t) {
      const seg = 1 / (bands.length - 1);
      const idx = Math.min(Math.floor(t / seg), bands.length - 2);
      const local = (t - idx * seg) / seg;
      return bands[idx].clone().lerp(bands[idx + 1], local);
    }
    
    // 恐龙皮肤纹理（鳞片噪声 + 色斑 + 腹部渐变）
    function skinTexture(baseColor, spotColor, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const base = new THREE.Color(baseColor);
      const spot = new THREE.Color(spotColor);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          // 鳞片：高频网格噪声
          const scale = fbm2(u * 18, v * 18, 4);
          const scale2 = fbm2(u * 40 + 3, v * 40 + 7, 3);
          // 色斑：低频大块斑纹
          const spotN = fbm2(u * 6 + 11, v * 6 - 5, 4);
          let col = base.clone();
          col.lerp(spot, S.clamp((spotN - 0.42) * 3.0, 0, 1) * 0.5);
          // 鳞片刻痕（微亮/微暗）
          const sheen = (scale2 - 0.5) * 0.16 + (scale - 0.5) * 0.08;
          col.r = S.clamp(col.r + sheen, 0, 1);
          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    
    /* ---------------- 星空（分层 + 大小/亮度变化） --------- */
    function createStarfield(count, radius, color1, color2) {
      count = count || 1400;
      radius = radius || 240;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c1 = new THREE.Color(color1 || 0xffffff);
      const c2 = new THREE.Color(color2 || 0xaac4ff);
      for (let i = 0; i < count; i++) {
        const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1)
          .normalize().multiplyScalar(radius);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
        const c = c1.clone().lerp(c2, Math.random());
        const b = 0.4 + Math.random() * 0.6;
        col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.5, vertexColors: true, transparent: true, opacity: 0.85,
        sizeAttenuation: true, depthWrite: false,
      });
      return new THREE.Points(geo, mat);
    }

    // 创建 3D 标签（需传入 CSS2DObject 构造器）并定位
    function makeLabel(CSS2DObject, text, position, className) {
      const div = document.createElement('div');
      div.className = className || 'sv-label';
      div.textContent = text;
      const obj = new CSS2DObject(div);
      if (position) obj.position.copy(position);
      return obj;
    }
    
    function toast(text, ms) {  let el = document.querySelector('.sv-toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'sv-toast';
        document.body.appendChild(el);
      }
      el.textContent = text;
      el.classList.add('is-open');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('is-open'), ms || 2200);
    }
    function bindVoiceButton(btn, voice) {
      if (!btn) return;
      const sync = () => btn.classList.toggle('is-off', !voice.isEnabled());
      sync();
      btn.addEventListener('click', () => { voice.toggle(); sync(); });
    }

    const exports = {
      init, hash3, valueNoise2, fbm2, clamp, lerp,
      createRenderer, createScene, createCamera, createControls,
      makeFly, createVoice, narrate, createCard, makePicker, makeLabel,
      glowTexture, planetTexture, skinTexture, createStarfield,
      toast, bindVoiceButton,
    };

    /* ==================================================================

    function organMat(hex, opt) {
      opt = opt || {};
      return new THREE.MeshPhysicalMaterial({
        color: hex,
        roughness: opt.rough != null ? opt.rough : 0.44,
        metalness: 0.02,

    // 不规则椭球：给器官一点“肉感”，避免完美球体
    function blob(rx, ry, rz, opt) {
      opt = opt || {};
      const g = new THREE.SphereGeometry(1, opt.seg || 24, opt.seg2 || 16);
      const pos = g.attributes.position;
      const noise = opt.noise != null ? opt.noise : 0.05;
      const seed = opt.seed || 0;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const k = 1 + (S.fbm2(v.x * 2.7 + seed, v.y * 2.7 + v.z * 1.6 + seed, 3) - 0.5) * 2 * noise;
        pos.setXYZ(i, v.x * rx * k, v.y * ry * k, v.z * rz * k);
      }
      g.computeVertexNormals();
      return g;
    }

    function mesh(geo, mat, x, y, z) {

      return m;

    // 半径渐变的管道：胃、肠、胰这些“一头粗一头细”的器官用它
    function taperedTube(points, r0, r1, tubularSeg, radialSeg, mat) {
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
      const geo = new THREE.TubeGeometry(curve, tubularSeg || 96, 1, radialSeg || 8, false);
      const pos = geo.attributes.position;
      const perRing = (radialSeg || 8) + 1;
      const c = new THREE.Vector3();
      const v = new THREE.Vector3();
      for (let i = 0; i <= (tubularSeg || 96); i++) {
        const t = i / (tubularSeg || 96);
        curve.getPointAt(t, c);
        const r = r0 + (r1 - r0) * t;
        for (let j = 0; j < perRing; j++) {
          const idx = i * perRing + j;
          v.fromBufferAttribute(pos, idx);
          const dx = v.x - c.x, dy = v.y - c.y, dz = v.z - c.z;
          const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
          const k = r / len;
          pos.setXYZ(idx, c.x + dx * k, c.y + dy * k, c.z + dz * k);
        }
      }
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, mat);
      m.userData.curve = curve;
      return m;
    }

    function tube(points, radius, mat, closed) {
      const curve = new THREE.CatmullRomCurve3(points, !!closed, 'catmullrom', 0.5);
      const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 96, radius, 8, !!closed), mat);
      m.userData.curve = curve;
      return m;
    }

    const P = (x, y, z) => new THREE.Vector3(x, y, z);

    /* ==================================================================
       参数化建模：扫掠 + 分层放样
       器官不再是“糖豆球”，而是按解剖轮廓逐段定义出来的
       ================================================================== */
    const lerp = (a, b, t) => a + (b - a) * t;
    const smooth = (t) => t * t * (3 - 2 * t);

    // 广义圆柱：沿曲线扫掠，半径可逐点变化、可压扁成椭圆、端头可收圆
    // 胃、肠、输尿管、血管都靠它
    function sweep(pts, radFn, opt) {
      opt = opt || {};
      const tub = opt.tubular || 120;
      const rad = opt.radial || 14;
      const curve = new THREE.CatmullRomCurve3(pts, !!opt.closed, 'catmullrom', opt.tension != null ? opt.tension : 0.5);
      const frames = curve.computeFrenetFrames(tub, !!opt.closed);
      const flat = opt.flat != null ? opt.flat : 1;
      const rs = opt.roundStart != null ? opt.roundStart : 0.05;
      const re = opt.roundEnd != null ? opt.roundEnd : 0.05;
      const pos = [], uv = [], idx = [];
      const c = new THREE.Vector3();
      for (let i = 0; i <= tub; i++) {
        const t = i / tub;
        curve.getPointAt(t, c);
        const N = frames.normals[i], B = frames.binormals[i];
        let r = typeof radFn === 'function' ? radFn(t) : radFn;
        let ra, rb;
        if (typeof r === 'number') { ra = r; rb = r * flat; } else { ra = r.a != null ? r.a : r.r; rb = r.b != null ? r.b : ra * flat; }
        let cap = 1;
        if (rs > 0 && t < rs) cap = Math.sqrt(Math.max(0, 1 - Math.pow(1 - t / rs, 2)));
        if (re > 0 && t > 1 - re) cap = Math.min(cap, Math.sqrt(Math.max(0, 1 - Math.pow((1 - t) / re, 2))));
        cap = Math.max(cap, 0.05);
        for (let j = 0; j <= rad; j++) {
          const a = (j / rad) * Math.PI * 2;
          const ca = Math.cos(a) * ra * cap, sa = Math.sin(a) * rb * cap;
          pos.push(
            c.x + N.x * ca + B.x * sa,
            c.y + N.y * ca + B.y * sa,
            c.z + N.z * ca + B.z * sa
          );
          uv.push(t, j / rad);
        }
      }
      for (let i = 0; i < tub; i++) {
        for (let j = 0; j < rad; j++) {
          const a = i * (rad + 1) + j, b = a + 1, d = a + rad + 1, e = d + 1;
          idx.push(a, d, b, b, d, e);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, opt.mat || organMat(0xffffff));
      m.userData.curve = curve;
      return m;
    }

    // 分层放样：给出一串水平截面（高度 / 左右半径 / 前后半径 / 偏移），
    // 肝、肺、肾、脾、膀胱这类实体器官靠它出轮廓
    function loftRings(rows, opt) {
      opt = opt || {};
      const rad = opt.radial || 24;
      const pos = [], uv = [], idx = [];
      rows.forEach((r, ri) => {
        const rzF = r.rzF != null ? r.rzF : (r.rz != null ? r.rz : r.rx);
        const rzB = r.rzB != null ? r.rzB : (r.rz != null ? r.rz : r.rx);
        for (let j = 0; j <= rad; j++) {
          const a = (j / rad) * Math.PI * 2;
          const ca = Math.cos(a), sa = Math.sin(a);
          const rz = sa >= 0 ? rzF : rzB;
          pos.push((r.dx || 0) + ca * r.rx, r.y, (r.dz || 0) + sa * rz);
          uv.push(j / rad, ri / Math.max(1, rows.length - 1));
        }
      });
      for (let i = 0; i < rows.length - 1; i++) {
        for (let j = 0; j < rad; j++) {
          const a = i * (rad + 1) + j, b = a + 1, d = a + rad + 1, e = d + 1;
          idx.push(a, b, d, b, e, d);
        }
      }
      // 上下封口：否则会露出器官内部，看起来像个破碗
      if (opt.cap !== false) {
        [0, rows.length - 1].forEach((ri) => {
          const base = pos.length / 3;
          const r0 = rows[ri];
          pos.push(r0.dx || 0, r0.y, r0.dz || 0);
          uv.push(0.5, ri === 0 ? 0 : 1);
          const off = ri * (rad + 1);
          for (let j = 0; j < rad; j++) {
            if (ri === 0) idx.push(base, off + j + 1, off + j);
            else idx.push(base, off + j, off + j + 1);
          }
        });
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      return new THREE.Mesh(geo, opt.mat || organMat(0xffffff));
    }

    /* ---- 心脏：心室主体放样 + 右心室鼓包 + 双心房 + 冠状沟 + 大血管根 ---- */
    function buildHeart() {
      const g = new THREE.Group();
      const myo = organMat(0xbe2e3d, { emissive: 0.2, rough: 0.36 });
      const myoDeep = organMat(0x91202e, { emissive: 0.13, rough: 0.46 });

      // 心室：心底宽、向左下收成心尖
      g.add(loftRings([
        { y: CM * 3.0, rx: CM * 1.5, rz: CM * 1.5 },
        { y: CM * 2.4, rx: CM * 3.0, rz: CM * 2.9 },
        { y: CM * 1.0, rx: CM * 4.0, rz: CM * 3.6 },
        { y: -CM * 1.2, rx: CM * 4.2, rz: CM * 3.8 },
        { y: -CM * 3.4, rx: CM * 3.5, rz: CM * 3.1, dx: -CM * 0.3 },
        { y: -CM * 5.2, rx: CM * 2.3, rz: CM * 2.1, dx: -CM * 0.6 },
        { y: -CM * 6.5, rx: CM * 1.1, rz: CM * 1.1, dx: -CM * 0.9 },
        { y: -CM * 7.2, rx: CM * 0.3, rz: CM * 0.32, dx: -CM * 1.2 },
      ], { radial: 30, mat: myo }));

      // 右心室：贴在前方，比左心室更鼓
      g.add(mesh(blob(CM * 2.2, CM * 3.0, CM * 1.8, { seed: 2.6, noise: 0.06 }), myoDeep, CM * 1.9, -CM * 0.6, CM * 1.6));
      // 左、右心房
      g.add(mesh(blob(CM * 1.6, CM * 1.3, CM * 1.5, { seed: 3.4, noise: 0.05 }), atriaMat, -CM * 1.8, CM * 3.1, -CM * 0.4));
      g.add(mesh(blob(CM * 1.7, CM * 1.4, CM * 1.6, { seed: 4.1, noise: 0.05 }), atriaMat, CM * 1.9, CM * 3.0, CM * 0.3));

      // 冠状沟：心房与心室之间一圈浅沟，心脏不再是一颗“红球”
      const sulPts = [];
      for (let i = 0; i <= 56; i++) {
        const a = (i / 56) * Math.PI * 2;
        sulPts.push(P(CM * 3.9 * Math.cos(a), CM * 2.1, CM * 3.5 * Math.sin(a)));
      }
      g.add(sweep(sulPts, CM * 0.3, {
        closed: true, tubular: 84, radial: 8, roundStart: 0, roundEnd: 0,
        mat: organMat(0x67121d, { emissive: 0.02, rough: 0.74 }),
      }));

      // 冠状动脉：沿心室表面下行
      const cor = organMat(0xe8626f, { emissive: 0.34, rough: 0.5 });
      g.add(sweep([
        P(CM * 0.2, CM * 2.2, CM * 3.5), P(-CM * 1.6, CM * 0.6, CM * 3.4),
        P(-CM * 2.4, -CM * 2.0, CM * 2.8), P(-CM * 2.2, -CM * 4.4, CM * 1.7),
      ], CM * 0.26, { tubular: 60, radial: 8, mat: cor, roundStart: 0, roundEnd: 0.02 }));
      g.add(sweep([
        P(CM * 2.6, CM * 1.8, CM * 2.7), P(CM * 3.4, -CM * 0.8, CM * 2.4),
        P(CM * 2.9, -CM * 3.0, CM * 1.8),
      ], CM * 0.22, { tubular: 50, radial: 8, mat: cor, roundStart: 0, roundEnd: 0.02 }));

      // 升主动脉 / 肺动脉干根部（向上接主血管网）
      g.add(sweep([
        P(CM * 0.1, CM * 2.4, -CM * 0.5), P(CM * 0.2, CM * 4.4, -CM * 0.9),
      ], CM * 0.8, { tubular: 24, radial: 14, mat: organMat(0xd83c4c, { emissive: 0.3 }), roundStart: 0, roundEnd: 0 }));
      g.add(sweep([
        P(CM * 1.9, CM * 2.2, CM * 0.7), P(CM * 2.4, CM * 3.8, CM * 0.1), P(CM * 1.6, CM * 5.0, -CM * 0.6),
      ], CM * 0.72, { tubular: 30, radial: 14, mat: organMat(0x8b5bd6, { emissive: 0.28 }), roundStart: 0, roundEnd: 0 }));

      g.rotation.z = 0.16;
      return g;
    }

    /* ---- 肺：上下肺叶 + 斜裂 + 气管支气管树 ---- */
    function buildLungs() {
      const g = new THREE.Group();
      const lobe = organMat(0xe08f9d, { opacity: 0.62, depthWrite: false, emissive: 0.16, rough: 0.52 });
      const airway = organMat(0xd6bebc, { emissive: 0.08, rough: 0.62 });

      [-1, 1].forEach((s) => {
        const side = new THREE.Group();
        // 一整片肺：上下叶之间的“叶裂”用一圈轻微内凹表达，避免两片拼接出现接缝
        side.add(loftRings([
          { y: CM * 11.2, rx: CM * 0.5, rz: CM * 0.7 },
          { y: CM * 10.2, rx: CM * 1.9, rz: CM * 2.4 },
          { y: CM * 8.4, rx: CM * 3.2, rz: CM * 4.0 },
          { y: CM * 5.6, rx: CM * 4.2, rz: CM * 5.2 },
          { y: CM * 2.6, rx: CM * 4.8, rz: CM * 5.8 },
          { y: CM * 0.6, rx: CM * 5.0, rz: CM * 6.0, rzB: CM * 5.4 },
          { y: 0, rx: CM * 4.72, rz: CM * 5.68, rzB: CM * 5.1 },
          { y: -CM * 1.4, rx: CM * 5.3, rz: CM * 6.3, rzB: CM * 5.9 },
          { y: -CM * 4.0, rx: CM * 5.4, rz: CM * 6.4, rzB: CM * 6.0 },
          { y: -CM * 7.4, rx: CM * 4.6, rz: CM * 5.4, rzB: CM * 5.0 },
          { y: -CM * 9.6, rx: CM * 2.8, rz: CM * 3.4, rzB: CM * 3.2 },
          { y: -CM * 10.8, rx: CM * 0.5, rz: CM * 0.7 },
        ], { radial: 30, mat: lobe }));
        side.position.set(s * CM * 7.4, 0, 0);
        side.scale.x = s;
        g.add(side);
      });

      // 气管
      g.add(sweep([
        P(0, CM * 14.0, CM * 0.6), P(0, CM * 10.4, CM * 0.4), P(0, CM * 6.2, CM * 0.2),
      ], CM * 0.7, { tubular: 30, radial: 14, mat: airway, roundStart: 0, roundEnd: 0 }));

      // 主支气管 + 次级支气管（分叉越多越像肺）
      [-1, 1].forEach((s) => {
        g.add(sweep([
          P(0, CM * 6.2, CM * 0.2), P(s * CM * 2.2, CM * 5.0, 0),
          P(s * CM * 4.2, CM * 3.6, 0), P(s * CM * 5.6, CM * 2.6, CM * 0.2),
        ], (t) => CM * (0.48 - 0.2 * t), { tubular: 40, radial: 10, mat: airway, roundStart: 0, roundEnd: 0.03 }));
        g.add(sweep([
          P(s * CM * 4.2, CM * 3.6, 0), P(s * CM * 5.0, CM * 1.2, CM * 0.4), P(s * CM * 5.2, -CM * 1.0, CM * 0.2),
        ], (t) => CM * (0.28 - 0.16 * t), { tubular: 30, radial: 8, mat: airway, roundStart: 0, roundEnd: 0.03 }));
        g.add(sweep([
          P(s * CM * 4.2, CM * 3.6, 0), P(s * CM * 4.4, CM * 5.8, CM * 0.4), P(s * CM * 4.0, CM * 7.6, CM * 0.2),
        ], (t) => CM * (0.26 - 0.15 * t), { tubular: 30, radial: 8, mat: airway, roundStart: 0, roundEnd: 0.03 }));
        g.add(sweep([
          P(s * CM * 5.0, CM * 1.2, CM * 0.4), P(s * CM * 4.6, -CM * 2.6, CM * 0.6), P(s * CM * 3.8, -CM * 5.4, CM * 0.4),
        ], (t) => CM * (0.2 - 0.12 * t), { tubular: 30, radial: 8, mat: airway, roundStart: 0, roundEnd: 0.03 }));
      });
      return g;
    }

    /* ---- 大脑：脑回褶皱 + 纵裂 + 颞叶 / 小脑 / 脑干 ---- */
    function buildBrain() {
      const g = new THREE.Group();
      const m = organMat(0xc79aa4, { emissive: 0.07, rough: 0.62 });
      const deep = organMat(0x9b707a, { emissive: 0.03, rough: 0.72 });

      const geo = new THREE.SphereGeometry(1, 54, 36);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        // 两组正弦叠出脑回的起伏
        const g1 = Math.sin(v.x * 10.5 + v.z * 3.4) * Math.sin(v.y * 8.6 - v.z * 2.2);
        const g2 = Math.sin(v.y * 16.0 + v.x * 5.4) * 0.45;
        const k = 1 + g1 * 0.05 + g2 * 0.018;
        // 纵裂：中线处往里收
        const pinch = 1 - 0.34 * Math.exp(-Math.pow(v.x / 0.2, 2));
        pos.setXYZ(
          i,
          v.x * CM * 6.4 * k * pinch,
          v.y * CM * 5.2 * k,
          v.z * CM * 7.0 * k
        );
      }
      geo.computeVertexNormals();
      g.add(new THREE.Mesh(geo, m));

      // 颞叶
      [-1, 1].forEach((s) => {
        g.add(mesh(blob(CM * 2.2, CM * 1.7, CM * 2.4, { noise: 0.08, seed: 20 + s }), m, s * CM * 3.4, -CM * 2.4, CM * 1.4));
      });
      // 小脑
      g.add(mesh(blob(CM * 3.4, CM * 2.0, CM * 2.5, { noise: 0.09, seed: 11 }), deep, 0, -CM * 3.6, -CM * 4.4));
      // 脑干
      const stem = new THREE.Mesh(new THREE.CapsuleGeometry(CM * 1.3, CM * 3.6, 8, 14), deep);
      stem.position.set(0, -CM * 4.8, -CM * 2.4);
      stem.rotation.x = 0.24;
      g.add(stem);
      return g;
    }

    /* ---- 肝：右叶主体 + 左叶薄舌 + 肝门 + 胆囊 ---- */
    function buildLiver() {
      const g = new THREE.Group();
      const m = organMat(0x8c392f, { emissive: 0.1, rough: 0.52 });
      const mDark = organMat(0x6c2923, { emissive: 0.05, rough: 0.62 });

      // 右叶：膈面隆起、下面凹
      g.add(loftRings([
        { y: CM * 4.6, rx: CM * 3.4, rz: CM * 3.0, dx: -CM * 4.0, rzF: CM * 4.0 },
        { y: CM * 3.4, rx: CM * 5.6, rz: CM * 4.4, dx: -CM * 4.2, rzF: CM * 5.4 },
        { y: CM * 1.6, rx: CM * 7.2, rz: CM * 5.0, dx: -CM * 4.4, rzF: CM * 5.9 },
        { y: -CM * 0.4, rx: CM * 7.6, rz: CM * 4.8, dx: -CM * 4.4, rzF: CM * 5.6 },
        { y: -CM * 2.4, rx: CM * 6.2, rz: CM * 3.8, dx: -CM * 4.0, rzF: CM * 4.4 },
        { y: -CM * 4.0, rx: CM * 3.6, rz: CM * 2.4, dx: -CM * 3.4, rzF: CM * 2.8 },
        { y: -CM * 4.8, rx: CM * 1.2, rz: CM * 1.0, dx: -CM * 3.0 },
      ], { radial: 30, mat: m }));

      // 左叶：薄舌状，跨过中线
      g.add(loftRings([
        { y: CM * 2.6, rx: CM * 1.8, rz: CM * 1.4, dx: CM * 5.4 },
        { y: CM * 1.6, rx: CM * 3.4, rz: CM * 2.4, dx: CM * 5.8 },
        { y: CM * 0.2, rx: CM * 4.2, rz: CM * 2.8, dx: CM * 5.6 },
        { y: -CM * 1.4, rx: CM * 3.4, rz: CM * 2.2, dx: CM * 5.2 },
        { y: -CM * 2.6, rx: CM * 1.4, rz: CM * 1.0, dx: CM * 4.8 },
      ], { radial: 26, mat: m }));

      // 肝门
      g.add(mesh(blob(CM * 1.6, CM * 1.2, CM * 1.4, { noise: 0.03, seed: 15 }), mDark, -CM * 2.4, -CM * 3.4, CM * 2.2));
      // 胆囊
      g.add(mesh(blob(CM * 1.3, CM * 2.2, CM * 1.3, { noise: 0.04, seed: 16 }), organMat(0x5d8c42, { emissive: 0.1, rough: 0.42 }), -CM * 6.2, -CM * 3.8, CM * 2.0));
      return g;
    }

    /* ---- 胃：贲门 → 胃底 → 胃体 → 幽门，加食管与十二指肠 ---- */
    function buildStomach() {
      const g = new THREE.Group();
      const m = organMat(0xd0876e, { emissive: 0.1, rough: 0.5 });
      const cardia = P(CM * 0.6, CM * 7.4, -CM * 0.8);
      const path = [
        cardia,
        P(CM * 2.6, CM * 9.4, -CM * 0.2),   // 胃底穹顶（高于贲门）
        P(CM * 5.2, CM * 7.6, CM * 0.5),
        P(CM * 6.2, CM * 3.6, CM * 0.9),
        P(CM * 5.8, -CM * 0.4, CM * 0.8),
        P(CM * 3.8, -CM * 3.4, CM * 0.4),
        P(CM * 1.6, -CM * 4.8, 0),
        P(-CM * 0.4, -CM * 4.4, -CM * 0.2),
      ];
      // 贲门细 → 胃底鼓 → 胃体宽 → 幽门细
      const rFn = (t) => {
        if (t < 0.24) return CM * lerp(0.9, 3.1, smooth(t / 0.24));
        if (t < 0.7) return CM * lerp(3.1, 3.2, smooth((t - 0.24) / 0.46));
        return CM * lerp(3.2, 0.85, smooth((t - 0.7) / 0.3));
      };
      g.add(sweep(path, rFn, { tubular: 90, radial: 22, flat: 0.82, mat: m, roundStart: 0.02, roundEnd: 0.03 }));

      // 食管
      g.add(sweep([
        P(CM * 0.2, CM * 16.0, -CM * 1.2), P(CM * 0.4, CM * 11.6, -CM * 1.0), cardia,
      ], CM * 0.55, { tubular: 36, radial: 12, mat: m, roundStart: 0, roundEnd: 0 }));

      // 幽门 → 十二指肠（C 形，绕向患者右侧）
      g.add(sweep([
        P(-CM * 0.4, -CM * 4.4, -CM * 0.2), P(-CM * 2.4, -CM * 4.0, CM * 0.4),
        P(-CM * 3.6, -CM * 1.0, CM * 0.8), P(-CM * 3.0, CM * 2.4, CM * 1.0),
        P(-CM * 1.0, CM * 3.4, CM * 1.0),
      ], CM * 0.82, { tubular: 60, radial: 12, mat: organMat(0xc98a72, { emissive: 0.1, rough: 0.48 }), roundStart: 0, roundEnd: 0.02 }));
      return g;
    }

    /* ---- 小肠：蛇形盘曲的空肠 / 回肠袢 ---- */
    function buildSmallIntestine() {
      const g = new THREE.Group();
      const m = organMat(0xe0916b, { emissive: 0.12, rough: 0.48 });

      const pts = [];
      // 纵向悬挂的肠袢：一列列从上往下垂，末端半圆翻回上一列
      const COLS = 6;
      const topY = CM * 4.4;
      const botY = -CM * 5.4;
      const colW = CM * 2.22;
      const x0 = -CM * 5.55;
      const R = colW / 2;
      for (let k = 0; k < COLS; k++) {
        const cx = x0 + k * colW;
        const down = k % 2 === 0;
        const z = CM * (1.4 + (k % 3) * 0.5);
        const n = 7;
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          const y = down ? lerp(topY, botY, t) : lerp(botY, topY, t);
          pts.push(P(
            cx + Math.sin(t * Math.PI * 1.5 + k * 1.1) * CM * 0.5,
            y,
            z + Math.sin(t * Math.PI) * CM * 0.9
          ));
        }
        // 翻到下一列：向下走的在这一列底部绕半圆，向上走的在顶部绕
        if (k < COLS - 1) {
          if (down) {
            for (let i = 1; i <= 5; i++) {
              const th = Math.PI + (i / 6) * Math.PI;
              pts.push(P((cx + R) + R * Math.cos(th), botY + R * Math.sin(th) * 0.82, z + CM * 0.4));
            }
          } else {
            for (let i = 1; i <= 5; i++) {
              const th = Math.PI - (i / 6) * Math.PI;
              pts.push(P((cx + R) + R * Math.cos(th), topY + R * Math.sin(th) * 0.82, z + CM * 0.4));
            }
          }
        }
      }
      // 回肠末端：向下接盲肠
      pts.push(P(-CM * 5.4, botY - CM * 0.4, CM * 1.8));
      pts.push(P(-CM * 6.2, botY - CM * 2.0, CM * 1.5));
      // 环状襞：半径轻微起伏
      g.add(sweep(pts, (t) => CM * (1.18 + 0.05 * Math.sin(t * 60)), {
        tubular: 340, radial: 12, flat: 0.94, mat: m, roundStart: 0.006, roundEnd: 0.02, tension: 0.4,
      }));
      return g;
    }

    /* ---- 大肠：盲肠 → 升 → 横 → 降 → 乙状 → 直肠，加阑尾 ---- */
    function buildLargeIntestine() {
      const g = new THREE.Group();
      const m = organMat(0xa8874a, { emissive: 0.11, rough: 0.52 });

      // 患者右侧在 -x
      const path = [
        P(-CM * 6.6, -CM * 7.0, CM * 1.4),   // 盲肠
        P(-CM * 7.2, -CM * 3.0, CM * 1.0),
        P(-CM * 7.4, CM * 2.0, CM * 0.6),
        P(-CM * 6.8, CM * 4.6, CM * 0.4),    // 肝曲
        P(-CM * 4.0, CM * 5.4, CM * 0.6),
        P(CM * 1.0, CM * 5.2, CM * 0.8),
        P(CM * 5.6, CM * 5.6, CM * 0.6),     // 脾曲
        P(CM * 7.4, CM * 3.0, CM * 0.4),
        P(CM * 7.6, -CM * 2.0, CM * 0.6),
        P(CM * 6.9, -CM * 5.6, CM * 1.0),
        P(CM * 4.4, -CM * 8.0, CM * 1.6),    // 乙状结肠
        P(CM * 1.4, -CM * 9.4, CM * 1.6),
        P(0, -CM * 11.0, CM * 1.2),          // 直肠
        P(0, -CM * 12.4, CM * 0.8),
      ];
      // 结肠袋：半径周期性起伏
      g.add(sweep(path, (t) => CM * (1.9 + 0.11 * Math.sin(t * 46)), {
        tubular: 260, radial: 14, flat: 0.86, mat: m, roundStart: 0.01, roundEnd: 0.02, tension: 0.4,
      }));

      // 阑尾：盲肠末端垂下
      g.add(sweep([
        P(-CM * 6.4, -CM * 7.2, CM * 1.4),
        P(-CM * 6.0, -CM * 9.4, CM * 1.8),
        P(-CM * 5.4, -CM * 10.6, CM * 1.5),
      ], CM * 0.4, { tubular: 40, radial: 10, mat: m, roundStart: 0.02, roundEnd: 0.05 }));
      return g;
    }

    /* ---- 肾（豆形，左低右高）+ 输尿管 ---- */
    function buildKidneys() {
      const g = new THREE.Group();
      const m = organMat(0x88544b, { emissive: 0.12, rough: 0.5 });
      const hilumMat = organMat(0x5d3933, { emissive: 0.04, rough: 0.66 });

      [-1, 1].forEach((s, i) => {
        const k = new THREE.Group();

          { y: CM * 5.0, rx: CM * 1.3, rz: CM * 1.5, dx: CM * 0.4 },
          { y: CM * 3.8, rx: CM * 2.3, rz: CM * 2.1, dx: CM * 0.8 },

        // 肾门凹陷朝内侧

        k.position.set(s * CM * 4.6, 0, 0);
        k.scale.x = s;
        g.add(k);

        g.add(sweep([
          P(s * CM * 4.0, -CM * 1.0, CM * 0.4), P(s * CM * 3.4, -CM * 8.0, CM * 0.8),
          P(s * CM * 2.6, -CM * 17.0, CM * 1.0), P(s * CM * 1.2, -CM * 24.0, CM * 1.2),
          P(s * CM * 0.6, -CM * 28.0, CM * 1.0),
        ], CM * 0.42, { tubular: 60, radial: 8, mat: ureter, roundStart: 0.02, roundEnd: 0.04 }));
      });
      return g;
    }

    function buildSpleen() {

    /* ---- 膀胱：囊状 + 尖顶 ---- */
    function buildBladder() {
      const g = new THREE.Group();
      g.add(loftRings([
        { y: CM * 3.0, rx: CM * 0.9, rz: CM * 0.9 },
        { y: CM * 2.2, rx: CM * 2.0, rz: CM * 2.0 },
        { y: CM * 0.8, rx: CM * 2.6, rz: CM * 2.5 },
        { y: -CM * 1.0, rx: CM * 2.4, rz: CM * 2.3 },
        { y: -CM * 2.4, rx: CM * 1.4, rz: CM * 1.3 },
        { y: -CM * 3.2, rx: CM * 0.5, rz: CM * 0.5 },
      ], { radial: 24, mat: organMat(0xc8b463, { emissive: 0.07, opacity: 0.95, rough: 0.44 }) }));
      return g;
    }

    /* ==================================================================
       器官注册
       ================================================================== */
    const organObjects = {};
    const pickTargets = [];
    const labelObjs = [];

    function addLabel(text, hex, pos, key, minor) {
      const wrap = document.createElement('div');
      wrap.className = 'cx-label-wrap';
      const div = document.createElement('div');
      div.className = 'sv-label' + (minor ? ' is-minor' : '');
      const c = new THREE.Color(hex);
      div.style.borderColor = 'rgba(' + Math.round(c.r * 255) + ',' + Math.round(c.g * 255) + ',' + Math.round(c.b * 255) + ',0.6)';
      div.textContent = text;
      if (key) {
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          focusOrgan(key);
        });
      } else {
        div.style.pointerEvents = 'none';
        div.style.cursor = 'default';
      }
      wrap.appendChild(div);
      const obj = new CSS2DObject(wrap);
      obj.position.copy(pos);
      obj.userData = { minor: !!minor, key: key, inner: div };
      scene.add(obj);
      labelObjs.push(obj);
      return obj;
    }

    function addOrgan(key, group, pos, labelOffset, minor) {
      const def = ORGANS[key];
      // 器官按解剖尺寸建模（单位 CM），这里只做极轻微放大以便远景辨认
      const scale = 1.05;
      group.position.copy(pos);
      group.scale.setScalar(scale);
      group.userData = { ...def, kind: 'organ', key: key, baseScale: scale };
      group.traverse((o) => {
        if (o.isMesh) {
          o.userData.key = key;
          if (o.material) {
            o.material.userData.baseOpacity = o.material.opacity;
            o.material.userData.baseEmissive = o.material.emissiveIntensity;
          }
        }
      });

      // 发光描边：器官互相叠在一起时，靠一圈亮边保持边界清晰
      const outlineMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(def.color).offsetHSL(0, 0.05, 0.16),
        side: THREE.BackSide,
        transparent: true,
        opacity: 0.09,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const shells = [];
      group.traverse((o) => { if (o.isMesh) shells.push(o); });
      shells.forEach((o) => {
        const ol = new THREE.Mesh(o.geometry, outlineMat);
        ol.scale.setScalar(1.055);
        ol.userData.isOutline = true;
        o.add(ol);
      });
      group.userData.outlineMat = outlineMat;

      scene.add(group);
      organObjects[key] = group;
      pickTargets.push(group);
      if (def.label !== false) {
        const off = labelOffset || new THREE.Vector3(0, CM * 8, 0);
        addLabel(def.name, def.color, pos.clone().add(off), key, minor);
      }
      return group;
    }

    function buildAll() {
      const chestY = L.chestY;
      const hipY = L.hipY;

      addOrgan('heart', buildHeart(), new THREE.Vector3(-CM * 0.8, chestY - CM * 0.6, CM * 0.6), new THREE.Vector3(CM * 11, CM * 9.5, 0));
      addOrgan('lungs', buildLungs(), new THREE.Vector3(0, chestY + CM * 1.6, -CM * 2.0), new THREE.Vector3(-CM * 17, CM * 11, 0));
      addOrgan('brain', buildBrain(), new THREE.Vector3(0, L.headY + CM * 7.0, CM * 0.4), new THREE.Vector3(CM * 11, CM * 5.4, 0));
      addOrgan('liver', buildLiver(), new THREE.Vector3(0, chestY - CM * 14.2, CM * 0.8), new THREE.Vector3(-CM * 15, CM * 2.4, 0));
      addOrgan('stomach', buildStomach(), new THREE.Vector3(0, chestY - CM * 11.4, -CM * 0.6), new THREE.Vector3(CM * 13, -CM * 1.6, 0));
      addOrgan('spleen', buildSpleen(), new THREE.Vector3(CM * 7.8, chestY - CM * 11.0, -CM * 1.2), new THREE.Vector3(CM * 6, CM * 4.2, 0), true);

    /* ==================================================================
       血管网络（按骨骼地标走向）
       ================================================================== */
    const vesselObjs = [];
    const vesselGroup = new THREE.Group();
    scene.add(vesselGroup);

    function vesselMaterial(hex) {
      const color = new THREE.Color(hex);
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        uniforms: {
          uColor: { value: color },
          uTime: { value: Math.random() * 10 },
          uOpacity: { value: 0.4 },
        },
        vertexShader: `
          varying vec2 vUv;
          void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: `
          varying vec2 vUv;
          uniform vec3 uColor;
          uniform float uTime;
          uniform float uOpacity;
          void main(){
            // 沿管长推进的柔和脉冲（uv.x 是沿管方向）
            float flow = fract(vUv.x * 1.5 - uTime * 0.3);
            float band = smoothstep(0.0, 0.55, flow) * smoothstep(1.0, 0.6, flow);
            vec3 col = uColor * (0.82 + band * 0.62);
            gl_FragColor = vec4(col, uOpacity * (0.55 + band * 0.45));
          }`,
      });
      return mat;
    }

    function offset(p, up, side) {
      return p.clone().add(new THREE.Vector3(side || 0, up || 0, 0));
    }

    function buildVessels() {

      // 肝动脉、肾动脉、肠系膜动脉

        pts: [
          P(0, chestY - CM * 8.6, -CM * 2.6),

          r: CM * 0.475, noLabel: true,

      // —— 体循环 · 静脉 ——

      add('venaCava', 'systemic', {

          P(CM * 1.4, L.headY - CM * 2.0, -CM * 0.4),

        ],

      [1, -1].forEach((s) => {
        add('venaCava', 'systemic', {
          r: CM * 0.574, noLabel: true,
          pts: [
            P(s * 0.545, chestY - CM * 32, CM * 0.3),
            P(s * 0.525, chestY - CM * 20, CM * 0.3),
            P(s * 0.5, chestY - CM * 6, CM * 0.2),
            P(s * 0.44, chestY + CM * 6, CM * 0.2),

      [1, -1].forEach((s) => {

      // —— 肺循环：右心室 → 肺动脉干 → 心底分叉 → 左右肺门 → 肺静脉 → 左心房 ——
      const bif = P(CM * 1.2, chestY + CM * 2.6, CM * 1.8);
      add('pulmArtery', 'pulmonary', {

        pts: [

      add('pulmArtery', 'pulmonary', {

      });
      add('pulmArtery', 'pulmonary', {
        r: CM * 0.9, noLabel: true,

      });
      add('pulmVein', 'pulmonary', {

      // —— 生成管网 ——
      defs.forEach((d) => {
        const def = VESSELS[d.key];
        const mat = vesselMaterial(def.color);
        const geo = new THREE.TubeGeometry(
          new THREE.CatmullRomCurve3(d.opt.pts, false, 'catmullrom', 0.4),
          64, d.opt.r, 7, false
        );
        const m = new THREE.Mesh(geo, mat);
        m.userData = { ...def, kind: 'vessel' };
        vesselGroup.add(m);

        vesselObjs.push({
          mesh: m, mat, def,
          group: d.opt.group || def.group,

    }

    /* ==================================================================
       血液粒子
       ================================================================== */
    const PCOUNT_RESERVE = 900;
    let particleMesh = null;
    const particleStates = [];

    function buildParticles() {
      let total = 0;
      const planned = [];
      vesselObjs.forEach((v, vi) => {
        const len = v.mesh.geometry.parameters.path.getLength();
        const n = Math.max(5, Math.min(34, Math.round(len * 26)));
        planned.push(n);
        total += n;
      });
      const count = Math.min(total, PCOUNT_RESERVE);

      const geo = new THREE.SphereGeometry(CM * 0.3, 6, 6);
      const mat = new THREE.MeshBasicMaterial({
        transparent: true, opacity: 0.72,
        blending: THREE.AdditiveBlending, depthWrite: false,
      });
      particleMesh = new THREE.InstancedMesh(geo, mat, count);
      particleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(particleMesh);

      const col = new THREE.Color();
      let idx = 0;
      vesselObjs.forEach((v, vi) => {
        const n = planned[vi];
        // 动脉偏亮、静脉偏冷，肺循环偏紫
        const base = new THREE.Color(v.def.color);
        for (let k = 0; k < n && idx < count; k++, idx++) {
          particleStates.push({
            vi: vi,
            t: k / n,
            speed: (v.group === 'pulmonary' ? 0.1 : 0.085) + Math.random() * 0.05,
          });
          col.copy(base).offsetHSL(0, 0, (Math.random() - 0.5) * 0.12);
          particleMesh.setColorAt(idx, col);
        }
      });
      particleMesh.count = idx;
      if (particleMesh.instanceColor) particleMesh.instanceColor.needsUpdate = true;
    }

    const dummy = new THREE.Object3D();
    function updateParticles(dt) {
      if (!particleMesh) return;
      for (let i = 0; i < particleStates.length; i++) {
        const s = particleStates[i];
        const v = vesselObjs[s.vi];
        s.t += dt * s.speed;
        if (s.t >= 1) s.t -= 1;
        const arr = v.samples;
        const n = arr.length - 1;
        const f = s.t * n;
        const i0 = Math.floor(f);
        const i1 = i0 >= n ? 0 : i0 + 1;
        dummy.position.lerpVectors(arr[i0], arr[i1], f - i0);
        const k = v.active ? 1 : 0;
        dummy.scale.setScalar(k);
        dummy.updateMatrix();
        particleMesh.setMatrixAt(i, dummy.matrix);
      }
      particleMesh.instanceMatrix.needsUpdate = true;
    }

    /* ==================================================================
       人体轮廓（程序化，玻璃质感；不再依赖外部 GLB）
       ================================================================== */
    const bodyMats = [];
    let xray = 0.32;

    function bodyMaterial() {
      const m = new THREE.MeshPhysicalMaterial({
        color: 0x9cc4f5,
        transparent: true,
        opacity: 0.1 + xray * 0.62,
        roughness: 0.26,
        metalness: 0.0,
        clearcoat: 0.8,
        clearcoatRoughness: 0.2,
        emissive: 0x2257a8,
        emissiveIntensity: 0.9,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      bodyMats.push(m);
      return m;
    }

    function applyXray() {
      bodyMats.forEach((m) => { m.opacity = 0.1 + xray * 0.62; });
      if (xrayVal) xrayVal.textContent = Math.round(xray * 100);
    }

    function buildBody() {
      const g = new THREE.Group();
      const mat = bodyMaterial();

      // 头 + 颈
      g.add(mesh(blob(0.185, 0.26, 0.215, { noise: 0.015, seg: 26, seg2: 18, seed: 2 }), mat, 0, L.headY + 0.09, 0));
      g.add(mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.22, 16), mat, 0, L.neckY - 0.04, 0));
      // 胸 / 腰 / 髋
      g.add(mesh(blob(0.345, 0.4, 0.225, { noise: 0.015, seg: 26, seg2: 18, seed: 4 }), mat, 0, L.chestY + 0.12, 0));
      g.add(mesh(blob(0.265, 0.26, 0.19, { noise: 0.015, seg: 24, seg2: 16, seed: 6 }), mat, 0, L.chestY - 0.34, 0));
      g.add(mesh(blob(0.285, 0.2, 0.2, { noise: 0.015, seg: 24, seg2: 16, seed: 8 }), mat, 0, L.hipY - 0.02, 0));
      // 肩
      [-1, 1].forEach((s) => {
        g.add(mesh(new THREE.SphereGeometry(0.092, 16, 12), mat, s * 0.42, L.chestY + 0.3, 0));
      });
      // 手臂：上臂 / 前臂 / 手（自然下垂）
      [-1, 1].forEach((s) => {
        const up = new THREE.Mesh(new THREE.CapsuleGeometry(0.064, 0.5, 5, 12), mat);
        up.position.set(s * 0.515, L.chestY + 0.03, 0);
        up.rotation.z = s * 0.08;
        g.add(up);
        const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.052, 0.46, 5, 12), mat);
        fore.position.set(s * 0.55, L.chestY - 0.63, 0);
        fore.rotation.z = s * 0.04;
        g.add(fore);
        g.add(mesh(blob(0.05, 0.085, 0.032, { noise: 0.02, seg: 12, seg2: 8 }), mat, s * 0.55, L.chestY - 0.98, 0));
      });
      // 腿：大腿 / 小腿 / 足
      [-1, 1].forEach((s) => {
        const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.118, 0.7, 5, 12), mat);
        thigh.position.set(s * 0.175, L.hipY - 0.48, 0);
        g.add(thigh);
        const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.64, 5, 12), mat);
        shin.position.set(s * 0.165, L.hipY - 1.24, 0);
        g.add(shin);
        const foot = mesh(new THREE.CapsuleGeometry(0.06, 0.14, 4, 10), mat, s * 0.16, 0.08, 0.05);
        foot.rotation.x = Math.PI / 2;
        g.add(foot);
      });

      // 轮廓光：远景下也能看清人体边界，内脏不会“飘”在黑底上
      const rimMat = new THREE.MeshBasicMaterial({
        color: 0x6aa8ff, side: THREE.BackSide, transparent: true,
        opacity: 0.12, depthWrite: false, blending: THREE.AdditiveBlending,
      });
      const shells = [];
      g.traverse((o) => { if (o.isMesh) shells.push(o); });
      shells.forEach((o) => {
        const ol = new THREE.Mesh(o.geometry, rimMat);
        ol.scale.setScalar(1.028);
        o.add(ol);
      });

      scene.add(g);
      return g;
    }

    function finishLoad() {
      buildAll();
      buildIndex();
      applyCycle('all');
      setView('torso');
      document.getElementById('loader').classList.add('is-done');
    }

    S.bindVoiceButton(document.getElementById('voiceBtn'), voice);
    const card = S.createCard(document.getElementById('card') || document.body);
    const picker = S.makePicker(camera, renderer.domElement);
    const fly = S.makeFly(camera, controls);
    const clock = new THREE.Clock();

    function dimOthers(activeKey) {
      Object.keys(organObjects).forEach((k) => {
        const on = !activeKey || k === activeKey;
        const g = organObjects[k];
        g.traverse((o) => {
          if (!o.isMesh || !o.material || o.userData.isOutline) return;
          const base = o.material.userData.baseOpacity != null ? o.material.userData.baseOpacity : 1;
          o.material.opacity = on ? base : base * 0.22;
          o.material.emissiveIntensity = on ? o.material.userData.baseEmissive : 0.02;
        });
        const om = g.userData.outlineMat;
        if (om) om.opacity = on ? 0.09 : 0.02;
      });
    }

    function focusOrgan(key) {
      const obj = organObjects[key];
      const def = ORGANS[key];
      if (!obj || !def) return;

      const b = new THREE.Box3().setFromObject(obj);
      const c = b.getCenter(new THREE.Vector3());
      const size = b.getSize(new THREE.Vector3()).length();
      const dist = Math.max(size * 1.9, 1.1);
      const dir = camera.position.clone().sub(c).normalize();
      if (dir.lengthSq() < 0.01) dir.set(0.2, 0.15, 1);
      fly.flyTo(c.clone().add(dir.multiplyScalar(dist)), c, 1.05);

      card.show(def);
      voice.speak(S.narrate(def), def.id);
      dimOthers(key);
      markIndex(key);
    }

    function focusBody() {
      setView('full');
      card.show(CYCLES.all);
      voice.speak(S.narrate(CYCLES.all), CYCLES.all.id);
      dimOthers(null);
      markIndex(null);
    }

    picker.onHover(() => pickTargets, (obj) => {
      renderer.domElement.style.cursor = obj ? 'pointer' : 'grab';
    });

    picker.onClick(() => pickTargets, (obj) => {
      if (!obj) return;
      let o = obj;
      while (o && !(o.userData && (o.userData.kind === 'organ' || o.userData.kind === 'vessel'))) o = o.parent;
      if (!o) return;
      const d = o.userData;
      if (d.kind === 'organ' && d.key) {
        focusOrgan(d.key);
      } else if (d.kind === 'vessel') {
        const item = vesselObjs.find((v) => v.mesh === o || v.mesh === obj);
        card.show(d);
        voice.speak(S.narrate(d), d.id);
        if (item) {
          const p = item.mesh.geometry.parameters.path.getPointAt(0.5);
          const dir = camera.position.clone().sub(p).normalize();
          fly.flyTo(p.clone().add(dir.multiplyScalar(2.4)), p, 1.0);
        }
        dimOthers(null);
        markIndex(null);
      }
    });

    /* ---- 器官索引 ---- */
    const organList = document.getElementById('organList');
    const indexButtons = {};

    function buildIndex() {
      const order = ['heart', 'lungs', 'brain', 'liver', 'stomach', 'smallIntestine', 'largeIntestine', 'kidney', 'spleen', 'pancreas', 'bladder'];
      order.forEach((key) => {
        const def = ORGANS[key];
        if (!def) return;
        const el = document.createElement('div');
        el.className = 'cx-item';
        el.dataset.key = key;
        const dot = document.createElement('span');
        dot.className = 'cx-item__dot';
        dot.style.background = '#' + def.color.toString(16).padStart(6, '0');
        const name = document.createElement('span');
        name.textContent = def.name;
        el.appendChild(dot);
        el.appendChild(name);
        el.addEventListener('click', () => focusOrgan(key));
        el.addEventListener('mouseenter', () => {
          const g = organObjects[key];
          if (!g) return;
          g.traverse((o) => {
            if (o.isMesh && o.material && o.material.userData.baseEmissive != null) {
              o.material.emissiveIntensity = o.material.userData.baseEmissive + 0.35;
            }
          });
        });
        el.addEventListener('mouseleave', () => {
          const g = organObjects[key];
          if (!g) return;
          g.traverse((o) => {
            if (o.isMesh && o.material && o.material.userData.baseEmissive != null) {
              o.material.emissiveIntensity = o.material.userData.baseEmissive;
            }
          });
        });
        organList.appendChild(el);
        indexButtons[key] = el;
      });
    }

    function markIndex(key) {
      Object.keys(indexButtons).forEach((k) => indexButtons[k].classList.toggle('is-on', k === key));
    }

    /* ---- 循环分层 ---- */
    let cycleMode = 'all';
    function applyCycle(mode) {
      cycleMode = mode;
      vesselObjs.forEach((v) => {
        const on = mode === 'all' || v.group === mode;
        v.active = on;
        v.mat.uniforms.uOpacity.value = on ? (mode === 'all' ? 0.46 : 0.64) : 0.035;
      });
      document.querySelectorAll('#cycleSeg button').forEach((b) => {
        b.classList.toggle('is-on', b.dataset.cycle === mode);
      });
      if (mode === 'systemic' || mode === 'pulmonary') {
        const c = CYCLES[mode];
        card.show(c);
        voice.speak(S.narrate(c), c.id);
        dimOthers(null);
        markIndex(null);
      }
      // 看肺循环时把肺变成“玻璃肺”，肺内的血管才透得出来
      const lungs = organObjects.lungs;
      if (lungs) {
        lungs.traverse((o) => {
          if (!o.isMesh || o.userData.isOutline || !o.material || o.material.userData.baseOpacity == null) return;
          const base = o.material.userData.baseOpacity;
          o.material.opacity = mode === 'pulmonary' ? Math.min(base, 0.24) : base;
        });
      }
    }

    document.getElementById('cycleSeg').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const mode = btn.dataset.cycle;
      applyCycle(mode);
      if (mode === 'all') {
        focusBody();
        applyCycle('all');
      } else if (mode === 'pulmonary') {
        setView('chest');
      } else {
        setView('full');
      }
    });

    /* ---- 视角 ---- */
    const views = {
      full: () => ({ pos: P(0.25, H * 0.5, 6.9), target: P(0, H * 0.5, 0) }),
      torso: () => ({ pos: P(0.22, L.chestY - CM * 8, CM * 144), target: P(0, L.chestY - CM * 8, 0) }),
      chest: () => ({ pos: P(CM * 12, L.chestY + CM * 2, CM * 82), target: P(0, L.chestY - CM * 1, 0) }),
      belly: () => ({ pos: P(CM * 10, L.chestY - CM * 22, CM * 84), target: P(0, L.chestY - CM * 24, 0) }),
      head: () => ({ pos: P(CM * 8, L.headY + CM * 1, CM * 46), target: P(0, L.headY, 0) }),
    };

    function setView(name) {
      const v = (views[name] || views.full)();
      fly.flyTo(v.pos, v.target, 1.2);
      document.querySelectorAll('#viewSeg button').forEach((b) => {
        b.classList.toggle('is-on', b.dataset.view === name);
      });
    }

    document.getElementById('viewSeg').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) setView(btn.dataset.view);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      focusBody();
      document.querySelectorAll('#viewSeg button').forEach((b) => b.classList.remove('is-on'));
    });

    /* ---- 播放 / 透视 ---- */
    let isPlaying = true;
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying
        ? '<span class="sv-btn__icon">⏸</span><span>暂停</span>'
        : '<span class="sv-btn__icon">▶</span><span>播放</span>';
      if (!isPlaying) clock.getDelta();
    });

    const xrayBtn = document.getElementById('xrayBtn');
    const xrayVal = document.getElementById('xrayVal');
    xrayBtn.addEventListener('click', () => {
      xray = xray >= 0.6 ? 0.08 : xray + 0.13;
      applyXray();
    });

    /* ==================================================================
       动画
       ================================================================== */
    const heartGroup = () => organObjects.heart;
    const labelProbe = new THREE.Vector3();
    const labelV = new THREE.Vector3();
    let labelTick = 0;
    let heartBeat = 0;

    // 器官挨得近时标签会叠在一起，这里做一次简单的屏幕空间避让
    function layoutLabels() {
      if ((labelTick++ % 2) !== 0) return;
      const items = [];
      labelObjs.forEach((o) => {
        const el = o.userData.inner;
        if (!el || o.element.style.opacity === '0') return;
        o.getWorldPosition(labelV);
        labelV.project(camera);
        if (labelV.z > 1) return;
        const x = (labelV.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-labelV.y * 0.5 + 0.5) * window.innerHeight;
        const w = el.offsetWidth || 48;
        const h = el.offsetHeight || 18;
        items.push({ el, sx: x - w / 2, sy: y - h / 2, w, h });
      });
      items.sort((a, b) => a.sy - b.sy);
      const placed = [];
      items.forEach((it) => {
        let shift = 0;
        for (let k = 0; k < 8; k++) {
          const box = { x1: it.sx, y1: it.sy + shift, x2: it.sx + it.w, y2: it.sy + it.h + shift };
          const hit = placed.some((p) => !(box.x2 < p.x1 || box.x1 > p.x2 || box.y2 < p.y1 || box.y1 > p.y2));
          if (!hit) { placed.push(box); break; }
          shift += it.h + 2;
        }
        it.el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
      });
    }

    function animate() {
      const dt = clock.getDelta();
      if (isPlaying) {
        const t = performance.now() / 1000;
        // lub-dub 双节拍
        const beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 1.15)), 6) * 0.11
          + Math.pow(Math.max(0, Math.sin((t - 0.24) * Math.PI * 1.15)), 6) * 0.06;
        const hg = heartGroup();
        if (hg) {
          heartBeat += (beat - heartBeat) * 0.35;
          hg.scale.setScalar(hg.userData.baseScale * (1 + heartBeat));
        }
        const lg = organObjects.lungs;
        if (lg) {
          const br = Math.sin(t * 1.5);
          const bs = lg.userData.baseScale;
          lg.scale.set(bs * (1 + br * 0.012), bs * (1 + br * 0.02), bs * (1 + br * 0.012));
        }
        vesselObjs.forEach((v) => { v.mat.uniforms.uTime.value += dt; });
        updateParticles(dt);
      }
      fly.update(dt);
      controls.update();

      // 次要标签（脾、胰、膀胱）在远景时收起，避免堆叠
      labelObjs.forEach((o) => {
        if (!o.userData.minor) return;
        o.getWorldPosition(labelProbe);
        o.element.style.opacity = camera.position.distanceTo(labelProbe) > 6.5 ? '0' : '';
      });

      layoutLabels();
      labelRenderer.render(scene, camera);
      composer.render();
      requestAnimationFrame(animate);
    }
    buildBody();
    finishLoad();
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
