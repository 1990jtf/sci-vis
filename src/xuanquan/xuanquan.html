  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    
    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 讲解文案（卡片 / 语音共用一份） --------- */
    // 优先用 info.say（写给"耳朵"的口语讲解），没有时用结构化字段拼一句
    function narrate(info) {
      if (!info) return '';
      if (info.say) return info.say;
      const parts = [info.name + '。'];
      if (info.type) parts.push(info.type + '。');
      if (info.stats && info.stats.length) {
        parts.push(info.stats.map((s) => s.label + '，' + s.value).join('。') + '。');
      }
      if (info.desc && info.desc.length) parts.push(info.desc.join('。'));
      return parts.join('').replace(/。{2,}/g, '。');
    }
    
    /* ---------------- 语音（神经语音包优先，浏览器语音兜底） ---------------- */
    /**
     * 两级语音方案：
     *   1) 预生成的神经语音包（edge-tts 晓晓 / 云希等）—— 音质接近真人，
     *      文件命名 v_<id>.mp3，放在 audioBase 目录下，离线可用、无密钥。
     *   2) 浏览器 speechSynthesis —— 语音包里没有这句时兜底，并做了音色排序
     *      （优先云端自然音 / 增强音色）与按句切分，比直接取第一个中文音色自然得多。
     *
     * 用法：const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
     *       voice.speak(S.narrate(data), data.voiceId);
     */
    function createVoice(opts) {
      opts = opts || {};
      const audioBase = opts.audioBase || null;   // 语音包目录，留空则纯浏览器语音
      const synth = window.speechSynthesis || null;
      let enabled = true;
      let zhVoice = null;
      let audioEl = null;
      let seq = 0;                                 // 打断计数：切天体时丢弃旧队列
      const missing = Object.create(null);         // 语音包里不存在的 id，只探测一次
    
      /* --- 音色挑选：给候选中文音色打分，取最自然的一个 --- */
      function score(v) {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        let s = 0;
        if (/xiaoxiao|xiaoyi|yunxi|yunjian|晓晓|云希|云扬/.test(name)) s += 60;
        if (/natural|neural|premium|enhanced|自然/.test(name)) s += 40;
        if (/google/.test(name)) s += 32;                 // Chrome 云端音，韵律较自然
        if (/ting-?ting|tingting|meijia|sinji|婷婷|美佳|善怡|美嘉/.test(name)) s += 24;
        if (/^zh[-_]?cn|cmn|^zh$/.test(lang)) s += 18;
        if (/^zh[-_]?(hk|tw)|yue/.test(lang)) s -= 14;    // 粤语 / 台湾腔，普通话场景降权
        if (v.localService) s += 6;                       // 本地音：断网也能用
        return s;
      }
      function pick() {
        if (!synth || !synth.getVoices) return;
        const all = synth.getVoices() || [];
        const zh = all.filter((v) => /^zh|cmn|yue/i.test(v.lang || ''));
        if (!zh.length) return;
        zhVoice = zh.slice().sort((a, b) => score(b) - score(a))[0] || null;
      }
      if (synth) {
        pick();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', pick);
      }
    
      /* --- 兜底：浏览器语音，按句切开逐句念，停顿更自然 --- */
      function chunk(text) {
        const parts = String(text).replace(/\s+/g, '').match(/[^。！？；!?]+[。！？；!?]?/g) || [];
        const out = [];
        let buf = '';
        parts.forEach((p) => {
          if (buf && (buf + p).length > 46) { out.push(buf); buf = p; }
          else buf += p;
        });
        if (buf) out.push(buf);
        return out.length ? out : [String(text)];
      }
      function speakTTS(text) {
        if (!synth || !text) return;
        const mySeq = ++seq;
        const chunks = chunk(text);
        let i = 0;
        const next = () => {
          if (!enabled || mySeq !== seq || i >= chunks.length) return;
          const u = new SpeechSynthesisUtterance(chunks[i++]);
          u.lang = 'zh-CN';
          u.rate = 0.98;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (!zhVoice) pick();
          if (zhVoice) u.voice = zhVoice;
          u.onend = () => setTimeout(next, 90);
          u.onerror = () => {};
          synth.speak(u);
        };
        // Chrome 在 cancel() 之后立刻 speak() 偶发静音，等一小会儿再开口
        setTimeout(next, 60);
      }
    
      /* --- 首选：播放语音包 --- */
      function playPack(id, text) {
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.preload = 'auto';
        }
        const el = audioEl;
        let done = false;
        const fallback = () => {
          if (done) return;
          done = true;
          missing[id] = true;
          speakTTS(text);
        };
        el.onerror = fallback;
        el.onplaying = () => { el.onerror = null; };
        el.src = audioBase + 'v_' + id + '.mp3';
        const p = el.play();
        if (p && p.catch) p.catch(fallback);
      }
    
      function speak(text, id) {
        if (!enabled || !text) return;
        if (id && audioBase && !missing[id]) {
          seq++;                      // 打断上一句（浏览器语音队列）
          if (synth) synth.cancel();
          playPack(id, text);
          return;
        }
        if (audioEl) audioEl.pause();
        if (synth) synth.cancel();
        speakTTS(text);
      }
      function stop() {
        seq++;
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        if (synth) synth.cancel();
      }
      function toggle() {
        enabled = !enabled;
        if (!enabled) stop();
        return enabled;
      }
      return { speak, stop, toggle, isEnabled: () => enabled, hasPack: !!audioBase };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      // 页面里已有 .sv-card 容器时直接复用，避免套娃出两层透明卡片
      const host = container && container.nodeType === 1 ? container : document.body;
      let el;
      if (host.classList && host.classList.contains('sv-card')) {
        el = host;
      } else {
        el = document.createElement('div');
        el.className = 'sv-card';
        host.appendChild(el);
      }
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            // 兼容两种写法：[label, value] 数组 或 { label, value } 对象
            const label = Array.isArray(s) ? s[0] : s.label;
            const value = Array.isArray(s) ? s[1] : s.value;
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span></span><b></b>';
            row.querySelector('span').textContent = label == null ? '' : label;
            row.querySelector('b').textContent = value == null ? '' : value;
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        if (data.facts && data.facts.length) {
          data.facts.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__fact';
            row.innerHTML = '<i>\uD83D\uDCA1</i><span></span>';
            row.querySelector('span').textContent = line;
            body.appendChild(row);
          });
        }
        el.classList.add('is-open');
      }
      function hide() { el.classList.remove('is-open'); }
      close.addEventListener('click', hide);
      return { element: el, show, hide };
    }
    
    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      // targets 可以是数组，也可以是返回数组的函数（换场景后数组会被整体替换）
      const resolve = (targets) => (typeof targets === 'function' ? targets() : targets) || [];
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const list = resolve(targets);
        const hits = raycaster.intersectObjects(list, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {

      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);

    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          const th = u * Math.PI * 2;
          const nx = Math.cos(th) * 3, ny = Math.sin(th) * 3;
          const n = fbm2(nx + 1.7, v * 5 - ny * 0.4, 5);
          const n2 = fbm2(nx * 2.3 + 9.1, v * 7 + 3.3, 4);
          let t = clamp(n * 0.7 + n2 * 0.3, 0, 1);
          const col = sampleBands(bands, t);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;

    function sampleBands(bands, t) {
      const seg = 1 / (bands.length - 1);
      const idx = Math.min(Math.floor(t / seg), bands.length - 2);
      const local = (t - idx * seg) / seg;
      return bands[idx].clone().lerp(bands[idx + 1], local);
    }
    
    // 恐龙皮肤纹理（鳞片噪声 + 色斑 + 腹部渐变）
    function skinTexture(baseColor, spotColor, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const base = new THREE.Color(baseColor);
      const spot = new THREE.Color(spotColor);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          // 鳞片：高频网格噪声
          const scale = fbm2(u * 18, v * 18, 4);
          const scale2 = fbm2(u * 40 + 3, v * 40 + 7, 3);

          const spotN = fbm2(u * 6 + 11, v * 6 - 5, 4);

          col.lerp(spot, S.clamp((spotN - 0.42) * 3.0, 0, 1) * 0.5);

          const sheen = (scale2 - 0.5) * 0.16 + (scale - 0.5) * 0.08;
          col.r = S.clamp(col.r + sheen, 0, 1);
          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;

          .normalize().multiplyScalar(radius);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;

    /* ==================================================================
       材质：夯土、土坯、木构、草顶

    function std(color, opt) {
      opt = opt || {};
      return new THREE.MeshStandardMaterial({
        color,
        roughness: opt.rough != null ? opt.rough : 0.95,
        metalness: opt.metal != null ? opt.metal : 0.0,
        flatShading: !!opt.flat,
        side: opt.side || THREE.FrontSide,
        transparent: !!opt.transparent,
        opacity: opt.opacity != null ? opt.opacity : 1,
        emissive: opt.emissive != null ? opt.emissive : 0x000000,
        emissiveIntensity: opt.emissiveIntensity != null ? opt.emissiveIntensity : 0,
      });

    // 夯土：横向夯层 + 竖向模板缝
    function rammedTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#c19a6b';
      ctx.fillRect(0, 0, 512, 512);
      // 夯层
      let y = 0;
      while (y < 512) {
        const h = 10 + Math.random() * 12;
        const g = 165 + Math.random() * 30;
        ctx.fillStyle = 'rgb(' + Math.round(g + 20) + ',' + Math.round(g - 4) + ',' + Math.round(g - 52) + ')';
        ctx.fillRect(0, y, 512, h - 1);
        ctx.fillStyle = 'rgba(90,66,40,0.22)';
        ctx.fillRect(0, y + h - 1, 512, 1.6);
        y += h;
      }
      // 竖向模板缝
      for (let x = 0; x < 512; x += 64) {
        ctx.fillStyle = 'rgba(88,64,38,0.13)';
        ctx.fillRect(x + Math.random() * 8, 0, 2.2, 512);
      }
      // 颗粒
      for (let i = 0; i < 2600; i++) {
        const px = Math.random() * 512, py = Math.random() * 512;
        ctx.fillStyle = 'rgba(' + (Math.random() > 0.5 ? '120,92,58' : '220,196,158') + ',' + (0.06 + Math.random() * 0.16) + ')';
        ctx.fillRect(px, py, 2 + Math.random() * 3, 2 + Math.random() * 2);
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(3, 2);
      t.anisotropy = 4;
      return t;
    }

    // 土坯墙：小砖块
    function adobeTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#cfb188';
      ctx.fillRect(0, 0, 512, 512);
      const bw = 64, bh = 30;
      for (let row = 0; row < 512 / bh + 1; row++) {
        const off = (row % 2) * (bw / 2);
        for (let col = -1; col < 512 / bw + 1; col++) {
          const x = col * bw + off, y = row * bh;
          const g = 190 + Math.random() * 26;
          ctx.fillStyle = 'rgb(' + Math.round(g) + ',' + Math.round(g - 26) + ',' + Math.round(g - 68) + ')';
          ctx.fillRect(x + 1.6, y + 1.6, bw - 3.2, bh - 3.2);
        }
      }
      for (let i = 0; i < 1600; i++) {
        ctx.fillStyle = 'rgba(120,94,62,' + Math.random() * 0.1 + ')';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(2.4, 2.4);
      t.anisotropy = 4;
      return t;
    }

    // 砾石戈壁
    function gravelTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#b7a184';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 5200; i++) {
        const x = Math.random() * 512, y = Math.random() * 512;
        const r = 1 + Math.random() * 3.2;
        const g = 130 + Math.random() * 80;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * (0.6 + Math.random() * 0.6), Math.random() * 3.14, 0, 6.283);
        ctx.fillStyle = 'rgb(' + Math.round(g) + ',' + Math.round(g - 12) + ',' + Math.round(g - 34) + ')';
        ctx.fill();
      }
      // 风蚀的浅色斑
      for (let i = 0; i < 60; i++) {
        const x = Math.random() * 512, y = Math.random() * 512, r = 20 + Math.random() * 70;
        const grd = ctx.createRadialGradient(x, y, 0, x, y, r);
        grd.addColorStop(0, 'rgba(214,196,164,0.22)');
        grd.addColorStop(1, 'rgba(214,196,164,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(1, 1);
      t.anisotropy = 8;
      return t;
    }

    const rammedTex = rammedTexture();

    /* ==================================================================
       基础工具

    function box(w, h, d, mat, x, y, z, ry) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      if (x != null) m.position.set(x, y, z);

    function cyl(rt, rb, h, seg, mat, x, y, z) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);

    // 变半径管：动物的脖子、尾巴
    function taperTube(points, r0, r1, tubular, radial, mat) {
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
      const geo = new THREE.TubeGeometry(curve, tubular, 1, radial, false);
      const pos = geo.attributes.position;
      const perRing = radial + 1;
      const c = new THREE.Vector3();
      const v = new THREE.Vector3();
      for (let i = 0; i <= tubular; i++) {
        const t = i / tubular;
        curve.getPointAt(t, c);
        const r = r0 + (r1 - r0) * t;
        for (let j = 0; j < perRing; j++) {
          const idx = i * perRing + j;
          v.fromBufferAttribute(pos, idx);
          const dx = v.x - c.x, dy = v.y - c.y, dz = v.z - c.z;
          const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
          const k = r / len;
          pos.setXYZ(idx, c.x + dx * k, c.y + dy * k, c.z + dz * k);
        }
      }
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, mat);
      m.castShadow = true;
      return m;
    }

    // 不规则砾石 / 土块
    function lumpGeo(rx, ry, rz, opt) {
      opt = opt || {};
      const g = new THREE.SphereGeometry(1, opt.seg || 10, opt.seg2 || 8);
      const pos = g.attributes.position;
      const v = new THREE.Vector3();
      const seed = opt.seed || 0;
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const n = S.fbm2(v.x * 2.6 + seed, v.y * 2.6 + v.z * 1.8 + seed, 3);
        const k = 1 + (n - 0.5) * (opt.noise != null ? opt.noise : 0.36);
        pos.setXYZ(i, v.x * rx * k, v.y * ry * k, v.z * rz * k);
      }
      g.computeVertexNormals();
      return g;
    }

    const compoundGroup = (function compound() {
      const g = new THREE.Group();
      const H = YARD.h, T = YARD.t;
      // 北墙、南墙
      g.add(wallRun(YARD.half * 2 + T, H, T, 0, H / 2, -YARD.half, 0));
      g.add(wallRun(YARD.half * 2 + T, H, T, 0, H / 2, YARD.half, 0));

      const doorW = 4.0;

      g.add(wallRun(segLen, H, T, YARD.half, H / 2, (doorW / 2 + segLen / 2 - T * 0.25), Math.PI / 2));

      // 门框木构

      // —— 门扇：两扇木门，左扇关着、右扇向内半开 ——
      (function doorLeaves() {
        const DH = 3.06, DW = 1.96, DT = 0.13;

        const bronze = std(0x9a8650, { metal: 0.65, rough: 0.38 });
        const PIVOT_X = YARD.half + 0.28;

        function leaf(pivotZ, dir, angle) {
          const lg = new THREE.Group();
          lg.position.set(PIVOT_X, 0, pivotZ);
          lg.rotation.y = angle;

          // 门板
          lg.add(box(DT, DH, DW, leafMat, 0, DH / 2 + 0.18, dir * DW / 2));
          // 横向穿带（木板拼缝）
          for (let i = 0; i < 4; i++) {

          for (let r = 0; r < 3; r++) {

              nail.rotation.z = Math.PI / 2;

          plate.rotation.z = Math.PI / 2;

          ring.position.set(DT / 2 + 0.08, 1.52, dir * (DW * 0.8));

        g.add(box(0.36, 0.2, doorW + 0.34, leafDark, PIVOT_X, 0.11, 0));

    /* ==================================================================

    function house(x, z, w, d, opt) {

      const g = new THREE.Group();
      g.position.set(x, 0.06, z);

      const ry = opt.ry || 0;

          slab.rotation.x = -s * Math.atan2(rise, d / 2 + 0.5);

        [[0, d / 2 + 0.3], [0, -d / 2 - 0.3]].forEach(([dx, dz]) => {

        g.add(box(w + 0.5, 0.3, 0.16, MAT.mud, 0, h + 0.4, -d / 2 - 0.22));

      const door = box(1.15, 1.95, 0.14, std(0x34261a, { rough: 0.95 }), 0, 0.98, d / 2 + 0.02);
      g.add(door);

      g.add(box(0.14, 2.1, 0.1, MAT.woodLight, 0.66, 1.05, d / 2 + 0.06));

          g.add(box(0.95, 0.1, 0.14, MAT.woodLight, wx, 2.34, d / 2 + 0.05));
        });
      }

      g.userData = { kind: 'spot', key: 'fangwu' };
      scene.add(g);
      return g;
    }

    const houses = [];
    // 北排：三间，中间的做主屋
    houses.push(house(-14.5, -20.5, 9.5, 6.5, { h: 3.6, thatch: false }));

    /* ==================================================================
       院内附属：水井、粮仓、拴马桩、草垛
       ================================================================== */
    (function yardProps() {
      const g = new THREE.Group();

      // 水井：石砌井口 + 木架 + 辘轳
      const wellX = 9.5, wellZ = 3.0;
      const ring = cyl(1.25, 1.35, 0.75, 16, MAT.stone, wellX, 0.38, wellZ);
      g.add(ring);
      const hole = cyl(0.92, 0.92, 0.8, 16, std(0x241c14, { rough: 1 }), wellX, 0.4, wellZ);

      [-1, 1].forEach((s) => {

      });
      g.add(box(2.5, 0.16, 0.16, MAT.wood, wellX, 2.4, wellZ));
      g.add(cyl(0.16, 0.16, 1.9, 8, MAT.woodLight, wellX, 2.0, wellZ).rotateZ(Math.PI / 2));
      g.add(cyl(0.03, 0.03, 1.4, 6, std(0x6b5a42, { rough: 1 }), wellX, 1.4, wellZ));

      // 粮仓：两座圆囷
      [[-16.5, 6.5, 2.1], [-16.5, 12.0, 1.85]].forEach(([qx, qz, r], i) => {
        const body = cyl(r, r * 1.04, 3.0, 14, MAT.mud, qx, 1.5, qz);
        g.add(body);
        // 草顶
        const roof = cyl(0.16, r + 0.5, 1.25, 14, MAT.thatch, qx, 3.25, qz);
        g.add(roof);
        // 箍
        for (let k = 0; k < 3; k++) {
          g.add(cyl(r + 0.02, r + 0.02, 0.07, 14, MAT.wood, qx, 0.5 + k * 0.9, qz));
        }
      });

      // 拴马桩
      for (let i = 0; i < 6; i++) {
        g.add(cyl(0.11, 0.13, 1.35, 8, MAT.wood, 16.5, 0.68, -2 + i * 2.6));
      }

      // 草垛
      [[-13.0, 14.0, 1.5], [-10.2, 15.2, 1.2]].forEach(([hx, hz, r], i) => {
        const m = new THREE.Mesh(lumpGeo(r, r * 0.8, r, { seed: 50 + i, noise: 0.28, seg: 10, seg2: 8 }), MAT.thatch);
        m.position.set(hx, r * 0.7, hz);
        m.castShadow = true;
        g.add(m);
      });

      // 陶罐若干（收在东南角，别挡住遛马道）
      for (let i = 0; i < 5; i++) {
        const jx = 6 + Math.random() * 4, jz = 8 + Math.random() * 5;
        const r = 0.24 + Math.random() * 0.12;
        const jar = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), std(0x8a6444, { rough: 0.9 }));
        jar.scale.y = 1.25;
        jar.position.set(jx, r * 1.15, jz);
        jar.castShadow = true;
        g.add(jar);
      }

      scene.add(g);
    })();

    /* ==================================================================
       角色动画系统：让骆驼、马、人真的走起来
       ------------------------------------------------------------------
       约定：模型局部 +z 为前进方向，脚底落在 y = 0。
       每个角色登记一份“骨架”（髋枢轴 / 膝枢轴 / 头颈枢轴 / 尾根枢轴），
       再用三种行为驱动：
         idle  站在原地 —— 低头吃草、甩尾、重心左右倒换
         path  沿闭合折线巡逻 —— 到拐角自动转向
         steer 追随目标 —— 驼队用“头驼领航 + 后续跟随”，转弯自然成弧
       ================================================================== */
    const ACTORS = [];
    const TAU = Math.PI * 2;

    function addActor(obj, opt) {
      const parts = (obj.userData && obj.userData.parts) || {};
      const a = Object.assign({
        obj,
        legs: parts.legs || [],
        arms: parts.arms || [],
        neck: parts.neck || null,
        tail: parts.tail || null,
        gait: 'walk',        // walk 马的对角步 / pace 骆驼的侧对步 / step 人
        amp: 0.32,           // 髋关节摆幅
        knee: 0.9,           // 屈膝幅度
        cyc: Math.random(),  // 步态相位
        stride: 1.7,         // 一个步态周期走多远
        bobY: 0.022,         // 身体起伏
        roll: 0,             // 左右摇晃（骆驼侧对步明显）
        graze: 0.6,          // 站立时低头进食的幅度
        mode: 'idle',
        speed: 0, path: null, seg: 0, u: 0,
        turn: 2.0, waitT: 0, way: null, wi: 0, gap: 0, follow: null,
        look: 6, trail: null, slot: 0, after: null,
        seed: Math.random() * TAU,
        moving: false,
      }, opt);
      a.baseY = obj.position.y;
      ACTORS.push(a);
      return a;
    }

    // 各条腿在步态周期里的相位
    function legPhase(L, gait) {
      if (gait === 'pace') return L.side < 0 ? 0 : 0.5;              // 同侧两腿并进
      if (gait === 'walk') return (L.front ? 0 : 0.5) + (L.side < 0 ? 0 : 0.5); // 对角交替
      return L.side < 0 ? 0 : 0.5;
    }
    function wrapAngle(v) { v = (v + Math.PI) % TAU; if (v < 0) v += TAU; return v - Math.PI; }
    function turnTo(cur, want, dt, rate) { return cur + wrapAngle(want - cur) * Math.min(1, dt * rate); }

    // 一条腿：摆髋 + 抬腿时屈膝
    function swingLeg(L, cyc, a) {
      const s = Math.sin((cyc + legPhase(L, a.gait)) * TAU);
      L.pivot.rotation.x = s * a.amp;
      if (L.knee) L.knee.rotation.x = Math.max(0, -s) * a.knee * (L.front ? 0.9 : -0.9);
    }

    // 走路：沿路径推进
    function walkPath(a, dt) {
      let d = a.speed * dt;
      let guard = 0;
      while (d > 0 && guard++ < 8) {
        const p0 = a.path[a.seg];
        const p1 = a.path[(a.seg + 1) % a.path.length];
        const rest = p1.distanceTo(p0) - a.u;
        if (d < rest) { a.u += d; d = 0; }
        else { d -= rest; a.seg = (a.seg + 1) % a.path.length; a.u = 0; }
      }
      const p0 = a.path[a.seg], p1 = a.path[(a.seg + 1) % a.path.length];
      const len = p1.distanceTo(p0) || 1;
      const k = a.u / len;
      a.obj.position.x = p0.x + (p1.x - p0.x) * k;
      a.obj.position.z = p0.z + (p1.z - p0.z) * k;
      a.obj.rotation.y = turnTo(a.obj.rotation.y, Math.atan2(p1.x - p0.x, p1.z - p0.z), dt, 4.5);
      a.cyc += (a.speed * dt) / a.stride;
      a.moving = a.speed > 0.05;
    }

    // 头驼：沿航点往返。转向速率被“最小转弯半径”限幅——
    // 调头时减速走出约 2.5 米半径的大弧线，不会原地打转
    function walkSteer(a, dt) {
      const w = a.way[a.wi];
      const dx = w.x - a.obj.position.x, dz = w.z - a.obj.position.z;
      const dist = Math.hypot(dx, dz);
      const fwd = dx * Math.sin(a.obj.rotation.y) + dz * Math.cos(a.obj.rotation.y);
      if (dist < 4 || (fwd < 0 && dist < 10)) a.wi = (a.wi + 1) % a.way.length;   // 到头，调头
      const err = wrapAngle(Math.atan2(dx, dz) - a.obj.rotation.y);
      const vf = a.speed * Math.max(0.4, Math.cos(err));
      const wMax = vf / 1.8;                       // 弯再急也不能小于 1.8 米半径
      a.obj.rotation.y = wrapAngle(a.obj.rotation.y + Math.max(-wMax, Math.min(wMax, err * 2.2)) * dt);
      a.obj.position.x += Math.sin(a.obj.rotation.y) * vf * dt;
      a.obj.position.z += Math.cos(a.obj.rotation.y) * vf * dt;
      a.cyc += (vf * dt) / a.stride;
      a.moving = vf > 0.05;
    }

    // 队列：后面的骆驼踩着头驼的脚印走，间距沿路径丈量——
    // 调头时各自沿着同一条弧线排成单列，永远不会互相穿插
    function trailPoint(trail, back) {
      let d = 0;
      for (let i = trail.length - 1; i > 0; i--) {
        const p = trail[i], q = trail[i - 1];
        const seg = Math.hypot(p.x - q.x, p.z - q.z);
        if (seg > 0 && d + seg >= back) {
          const t = (back - d) / seg;
          return { x: p.x + (q.x - p.x) * t, z: p.z + (q.z - p.z) * t, yaw: Math.atan2(p.x - q.x, p.z - q.z) };
        }
        d += seg;
      }
      const p = trail[trail.length - 1], q = trail[0];
      return { x: q.x, z: q.z, yaw: trail.length > 1 ? Math.atan2(p.x - q.x, p.z - q.z) : 0 };
    }
    function walkTrail(a, dt) {
      const tp = trailPoint(a.trail, a.slot);
      const ox = a.obj.position.x, oz = a.obj.position.z;
      a.obj.position.x = tp.x;
      a.obj.position.z = tp.z;
      a.obj.rotation.y = tp.yaw;
      const moved = Math.hypot(tp.x - ox, tp.z - oz);
      a.cyc += moved / a.stride;
      a.moving = moved > dt * 0.05;
    }

    function updateActor(a, dt, T) {
      if (a.mode === 'path') walkPath(a, dt);
      else if (a.mode === 'steer') walkSteer(a, dt);
      else if (a.mode === 'follow') walkTrail(a, dt);
      else a.moving = false;

      const cyc = a.cyc;
      if (a.moving) {
        a.legs.forEach((L) => swingLeg(L, cyc, a));
        a.arms.forEach((L) => {                       // 人：手臂与同侧腿反相
          const s = Math.sin((cyc + (L.side < 0 ? 0.5 : 0)) * TAU);
          L.pivot.rotation.x = s * 0.34;
        });
        const beats = a.gait === 'pace' ? 2 : (a.gait === 'walk' ? 4 : 2);
        a.obj.position.y = a.baseY + Math.abs(Math.sin(cyc * Math.PI * beats)) * a.bobY;
        a.obj.rotation.z = a.roll ? Math.sin(cyc * TAU) * a.roll : 0;
        if (a.neck) a.neck.rotation.x = Math.sin(cyc * TAU * 1.0 + a.seed) * 0.07;
      } else {
        // 站着的时候也别像标本：重心左右倒换 + 偶尔挪半步
        const w = Math.sin(T * 0.55 + a.seed);
        a.legs.forEach((L, i) => {
          L.pivot.rotation.x = w * 0.05 * (L.side < 0 ? 1 : -1);
          if (L.knee) L.knee.rotation.x = Math.max(0, w) * 0.12 * (i % 2 ? 1 : -1);
        });
        a.arms.forEach((L) => { L.pivot.rotation.x = Math.sin(T * 0.7 + a.seed + L.side) * 0.05; });
        a.obj.rotation.z = 0;
        // 低头吃草 / 饮水：几秒一个来回
        if (a.neck) {
          const g = (Math.sin(T * 0.42 + a.seed) - 0.55) * 1.9;
          a.neck.rotation.x = Math.max(0, g) * a.graze;
        }
        a.obj.position.y = a.baseY + Math.sin(T * 0.9 + a.seed) * 0.006;
      }
      // 尾巴：慢慢甩 + 偶尔抽一下
      if (a.tail) {
        a.tail.rotation.z = Math.sin(T * 0.9 + a.seed) * 0.22
          + Math.sin(T * 3.1 + a.seed * 2) * 0.05;
      }
      if (a.after) a.after(a, dt);      // 头驼每帧留下脚印，给后面排队用
    }

    /* ==================================================================
       院内生活痕迹：汉车、货堆、戍卒、马匹
       ================================================================== */
    function makeCart(x, z, rot) {
      const g = new THREE.Group();
      g.position.set(x, 0.06, z);
      g.rotation.y = rot || 0;
      const wood = MAT.wood;
      // 车厢
      g.add(box(1.55, 0.5, 2.5, MAT.woodLight, 0, 0.95, 0));
      g.add(box(1.7, 0.12, 2.7, wood, 0, 1.24, 0));
      // 车辕
      [-0.42, 0.42].forEach((sx) => {
        g.add(box(0.1, 0.1, 2.5, wood, sx, 0.86, 2.2));
      });
      g.add(box(1.0, 0.1, 0.12, wood, 0, 0.9, 3.45));
      // 两个轮子（用细圆柱竖起来）
      [-0.92, 0.92].forEach((sx) => {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.1, 18), wood);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(sx, 0.68, -0.1);
        wheel.castShadow = true;
        g.add(wheel);
        // 辐条
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          g.add(box(0.04, 1.14, 0.04, MAT.woodDark, sx, 0.68 + Math.cos(a) * 0, -0.1));
        }
      });
      // 车上的货
      const load = new THREE.Mesh(lumpGeo(0.7, 0.4, 1.0, { seed: Math.random() * 20, noise: 0.2, seg: 8, seg2: 6 }), MAT.thatch);
      load.position.set(0, 1.5, 0);
      g.add(load);
      g.userData = { kind: 'spot', key: 'yidao' };
      scene.add(g);
      return g;
    }

    // 人：头可转、双臂双腿都有枢轴，袍子下摆提高露出腿脚
    function makePerson(x, z, rot, tone) {
      const g = new THREE.Group();
      g.position.set(x, 0.06, z);
      g.rotation.y = rot || 0;
      const cloth = std(tone || 0x5a4630, { rough: 0.95 });
      const dark = std(0x2f2620, { rough: 0.95 });
      // 长袍
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.26, 1.0, 7), cloth);
      body.position.y = 0.84;
      body.castShadow = true;
      g.add(body);
      g.add(box(0.42, 0.07, 0.36, std(0x3d3226, { rough: 1 }), 0, 0.97, 0));
      // 肩
      g.add(box(0.46, 0.1, 0.2, cloth, 0, 1.28, 0));

      // 头（挂在颈枢轴上）
      const headPivot = new THREE.Group();
      headPivot.position.set(0, 1.30, 0);
      g.add(headPivot);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 9, 7), std(0xb08d68, { rough: 0.9 }));
      head.position.y = 0.18;
      head.castShadow = true;
      headPivot.add(head);
      // 幞头 / 发髻
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), dark);
      cap.scale.set(1, 0.7, 1);
      cap.position.y = 0.28;
      headPivot.add(cap);

      // 双臂
      const arms = [];
      [-1, 1].forEach((s) => {
        const sh = new THREE.Group();
        sh.position.set(s * 0.22, 1.24, 0);
        g.add(sh);
        sh.add(box(0.09, 0.58, 0.11, cloth, 0, -0.29, 0));
        arms.push({ pivot: sh, side: s });
      });
      // 双腿
      const legs = [];
      [-1, 1].forEach((s) => {
        const hip = new THREE.Group();
        hip.position.set(s * 0.09, 0.40, 0);
        g.add(hip);
        hip.add(box(0.11, 0.4, 0.12, std(0x4a3f30, { rough: 1 }), 0, -0.2, 0));
        hip.add(box(0.12, 0.07, 0.19, dark, 0, -0.39, 0.03));
        legs.push({ pivot: hip, knee: null, front: false, side: s });
      });

      g.userData = { parts: { legs, arms, head: headPivot } };
      scene.add(g);
      return g;
    }

    // 马：肩部头颈枢轴 + 尾根枢轴 + 四腿髋/膝双枢轴
    function makeHorse(x, z, rot, tone) {
      const g = new THREE.Group();
      g.position.set(x, 0.06, z);
      g.rotation.y = rot || 0;
      const fur = std(tone || 0x8a5f3c, { rough: 0.95 });
      const dark = std(0x4a3324, { rough: 0.95 });
      // 身体
      const body = new THREE.Mesh(lumpGeo(0.48, 0.52, 1.05, { seed: Math.random() * 9, noise: 0.1, seg: 10, seg2: 8 }), fur);
      body.position.y = 1.18;
      body.castShadow = true;
      g.add(body);

      // 头颈：挂在肩部，能低头吃槽里的草料
      const headPivot = new THREE.Group();
      headPivot.position.set(0, 1.40, 0.72);
      g.add(headPivot);
      const neck = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
        P(0, 0.02, 0.08), P(0, 0.32, 0.43), P(0, 0.42, 0.68),
      ]), 8, 0.22, 6, false), fur);
      neck.castShadow = true;
      headPivot.add(neck);
      headPivot.add(box(0.22, 0.24, 0.52, fur, 0, 0.43, 0.90));
      headPivot.add(box(0.06, 0.16, 0.06, dark, -0.08, 0.58, 0.70));
      headPivot.add(box(0.06, 0.16, 0.06, dark, 0.08, 0.58, 0.70));
      headPivot.add(box(0.1, 0.3, 0.7, dark, 0, 0.28, 0.33));

      // 尾：挂在尾根
      const tailPivot = new THREE.Group();
      tailPivot.position.set(0, 1.50, -1.0);
      g.add(tailPivot);
      tailPivot.add(box(0.1, 0.6, 0.1, dark, 0, -0.28, -0.05));

      // 四腿：髋枢轴 + 膝关节
      const legs = [];
      [[-0.3, 0.62, true], [0.3, 0.62, true], [-0.3, -0.62, false], [0.3, -0.62, false]].forEach(([lx, lz, front]) => {
        const hip = new THREE.Group();
        hip.position.set(lx, 0.98, lz);
        g.add(hip);
        hip.add(box(0.13, 0.5, 0.14, fur, 0, -0.25, 0));
        const kn = new THREE.Mesh(new THREE.SphereGeometry(0.075, 7, 5), fur);
        kn.position.y = -0.5;
        hip.add(kn);
        const knee = new THREE.Group();
        knee.position.y = -0.5;
        hip.add(knee);
        knee.add(box(0.11, 0.45, 0.12, fur, 0, -0.225, 0));
        knee.add(box(0.13, 0.09, 0.17, dark, 0, -0.45, 0.01));   // 蹄
        legs.push({ pivot: hip, knee, front, side: lx < 0 ? -1 : 1 });
      });

      g.userData = { kind: 'spot', key: 'majiu' };
      g.userData.parts = { legs, neck: headPivot, tail: tailPivot };
      scene.add(g);
      return g;
    }

    // 行走路线：闭合折线，角色沿它自动转向；两点即“来回走”
    const PATH = {
      yardWest: [P(-13, 0.06, -12), P(-13, 0.06, 10.5)],                                // 院内西侧走廊
      yardMid: [P(1, 0.06, -12), P(1, 0.06, 12)],                                       // 院内中央过道
      yardSouth: [P(-8, 0.06, 15), P(8, 0.06, 15)],                                     // 南排房前的空地
      yardLoop: [P(4, 0.06, -11), P(12, 0.06, -11), P(12, 0.06, 14), P(4, 0.06, 14)],   // 东侧遛马道
      gateLoop: [P(29.5, 0.06, 5), P(33, 0.06, 5), P(33, 0.06, 12), P(29.5, 0.06, 12)], // 门外空地
      aisle: [P(-11, 0.06, 34.5), P(-2.5, 0.06, 34.5)],                                 // 马厩内的走道
      spur: [P(26.5, 0.06, 0.8), P(34.0, 0.06, 0.8)],                                   // 门前支路
      road: [P(35.2, 0.06, -22), P(35.2, 0.06, 46)],                                    // 驿道（靠西侧行走，避开驼队）
    };

    (function yardLife() {
      // 两辆汉车停在院里
      makeCart(-2.5, 3.5, 0.15);
      makeCart(11.0, -14.0, -1.35);
      // 货堆
      [[-8.0, 6.0], [-6.4, 7.4], [6.0, 11.0], [15.5, 8.0]].forEach(([px, pz], i) => {
        const stack = new THREE.Mesh(lumpGeo(1.0, 0.55, 0.9, { seed: 300 + i, noise: 0.22, seg: 9, seg2: 7 }), i % 2 ? MAT.thatch : MAT.woodLight);
        stack.position.set(px, 0.5, pz);
        stack.castShadow = true;
        scene.add(stack);
      });

      /* —— 人：各有各的路线 —— */
      [
        { p: 'yardWest', tone: 0x6b4a30, speed: 1.05, seg: 0, u: 6 },
        { p: 'yardMid', tone: 0x4a4a52, speed: 1.2, seg: 1, u: 4 },
        { p: 'yardSouth', tone: 0x7a5a3e, speed: 1.0, seg: 0, u: 3 },
        { p: 'aisle', tone: 0x5a4630, speed: 0.95, seg: 1, u: 2 },
        { p: 'spur', tone: 0x6b4a30, speed: 1.15, seg: 0, u: 1 },
        { p: 'road', tone: 0x4a4a52, speed: 1.3, seg: 1, u: 10 },
      ].forEach((f) => {
        const man = makePerson(PATH[f.p][0].x, PATH[f.p][0].z, 0, f.tone);
        addActor(man, {
          mode: 'path', path: PATH[f.p], seg: f.seg, u: f.u,
          speed: f.speed, stride: 1.3, gait: 'step', amp: 0.46, bobY: 0.02,
        });
      });

      /* —— 马 —— */
      // 院里三匹，沿东侧遛马道慢慢走，彼此错开
      [[0, 0, 0x8a5f3c], [1, 12, 0x6b4a30], [3, 8, 0xa07a52]].forEach(([seg, u, tone]) => {
        const h = makeHorse(PATH.yardLoop[0].x, PATH.yardLoop[0].z, 0, tone);
        addActor(h, {
          mode: 'path', path: PATH.yardLoop, seg, u,
          speed: 1.15, stride: 1.75, gait: 'walk', amp: 0.3, knee: 0.85, bobY: 0.022, graze: 0.5,
        });
      });
      // 门外两匹（迎接来客），在门前空地走动
      [[0, 0, 0x8a5f3c], [2, 0, 0x7a5238]].forEach(([seg, u, tone]) => {
        const h = makeHorse(PATH.gateLoop[0].x, PATH.gateLoop[0].z, 0, tone);

      head.position.set(0, 0.06, 1.44);

      const muzzle = new THREE.Mesh(lumpGeo(0.15, 0.15, 0.24, { seed: 3.3, noise: 0.06, seg: 10, seg2: 8 }), furLight);
      muzzle.position.set(0, -0.04, 1.70);

        g.add(box(0.4, 0.035, 0.86, std(0x5a4632, { rough: 1 }), sx * 0.6, 1.92, -0.12));
        g.add(box(0.38, 0.035, 0.05, std(0x5a4632, { rough: 1 }), sx * 0.6, 1.76, 0.28));

      g.add(box(0.02, 0.02, 0.75, std(0x6b5232, { rough: 1 }), 0, 1.86, 2.0));

      g.userData = { kind: 'spot', key: 'yidao' };

    }

    // 驼队西行：头驼领航（纯追踪转向），后三只踩着脚印排成单列
    const camels = [];
    (function caravan() {

        gait: 'pace', stride: 2.0, amp: 0.34, knee: 0.95, bobY: 0.035, roll: 0.035, graze: 0.16,
        after: (a) => {
          const p = a.obj.position, last = trail[trail.length - 1];
          if (Math.hypot(p.x - last.x, p.z - last.z) > 0.12) trail.push(P(p.x, 0, p.z));
          if (trail.length > 600) trail.splice(0, trail.length - 600);

        const c = makeCamel(RX0, 18 + slot, Math.PI, s, tone);
        camels.push(c);
        addActor(c, {
          mode: 'follow', trail, slot,
          gait: 'pace', stride: 2.0, amp: 0.34, knee: 0.95, bobY: 0.035, roll: 0.035, graze: 0.16,
        });
      });
      window.__actors = ACTORS;

       ================================================================== */
    (function banner() {
      const pole = cyl(0.1, 0.12, 7.2, 8, MAT.wood, 31.6, 3.6, 0);
      scene.add(pole);
      // 旗面：顶点带波浪
      const geo = new THREE.PlaneGeometry(1.9, 3.4, 12, 10);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i);
        pos.setZ(i, Math.sin((x + 0.95) * 2.4) * 0.16 * ((x + 0.95) / 1.9));
      }
      geo.computeVertexNormals();
      const flag = new THREE.Mesh(geo, MAT.cloth);
      window.__flag = flag;
      flag.position.set(32.6, 5.3, 0);
      flag.rotation.y = -Math.PI / 2;
      flag.castShadow = true;
      scene.add(flag);
      // 旗杆顶饰
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), std(0xb08c46, { metal: 0.5, rough: 0.4 }));
      tip.position.set(31.6, 7.3, 0);
      scene.add(tip);
    })();

    /* ==================================================================
       戈壁植被：骆驼刺、红柳、枯胡杨
       ================================================================== */
    function makeTamarix(x, z, s) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.scale.setScalar(s || 1);
      for (let i = 0; i < 7; i++) {
        const a = Math.random() * 6.283;
        const h = 0.9 + Math.random() * 1.3;
        const twig = cyl(0.02, 0.05, h, 5, std(0x7d6a4a, { rough: 1 }), Math.cos(a) * 0.25, h / 2, Math.sin(a) * 0.25);
        twig.rotation.z = (Math.random() - 0.5) * 0.5;
        g.add(twig);
        // 红柳花穗
        const col = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.5, 5), std(0xa2657a, { rough: 0.9, flat: true }));
        col.position.set(Math.cos(a) * 0.32, h + 0.12, Math.sin(a) * 0.32);
        g.add(col);
      }
      scene.add(g);
      return g;
    }
    function makeCamelThorn(x, z, s) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.scale.setScalar(s || 1);
      const mat = std(0x6f7448, { rough: 1, flat: true });
      for (let i = 0; i < 9; i++) {
        const a = Math.random() * 6.283;
        const r = Math.random() * 0.55;
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.35 + Math.random() * 0.3, 4), mat);
        spike.position.set(Math.cos(a) * r, 0.2 + Math.random() * 0.2, Math.sin(a) * r);
        spike.rotation.z = (Math.random() - 0.5) * 0.8;
        spike.rotation.x = (Math.random() - 0.5) * 0.8;
        g.add(spike);
      }
      scene.add(g);
      return g;
    }
    function makeDeadPoplar(x, z, s) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.scale.setScalar(s || 1);
      const bark = std(0x8a7a60, { rough: 1 });
      const trunk = cyl(0.16, 0.34, 4.2, 7, bark, 0, 2.1, 0);
      g.add(trunk);
      for (let i = 0; i < 5; i++) {
        const a = Math.random() * 6.283;
        const h = 1.4 + Math.random() * 1.6;
        const br = cyl(0.05, 0.11, h, 5, bark, Math.cos(a) * 0.5, 3.6 + Math.random() * 0.6, Math.sin(a) * 0.5);
        br.rotation.z = Math.cos(a) * 0.7;
        br.rotation.x = Math.sin(a) * 0.7;
        g.add(br);
      }
      scene.add(g);
      return g;
    }

    // 沿驿道与坞院四周点缀
    makeTamarix(46, -18, 1.1);
    makeTamarix(44, 46, 0.9);
    makeTamarix(-32, 34, 1.0);
    makeCamelThorn(10, 52, 1.2);
    makeCamelThorn(-8, 54, 1.0);
    makeCamelThorn(-34, -10, 1.3);
    makeCamelThorn(52, -30, 1.1);
    makeCamelThorn(30, 62, 1.0);
    makeDeadPoplar(-46, 18, 1.05);
    makeDeadPoplar(56, 30, 0.9);
    makeDeadPoplar(-40, -30, 0.85);

    /* ==================================================================
       祁连山：南侧连绵雪峰
       ================================================================== */
    (function qilian() {
      // 一排低多边形雪峰：密排、错落、相互叠压，只让顶部积雪
      const rock = std(0x9aa7b4, { rough: 1, flat: true });
      const rockFar = std(0xaebbc7, { rough: 1, flat: true });
      const snow = std(0xf1f6fb, { rough: 0.92, flat: true });

      function peak(x, z, w, h, far) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.ConeGeometry(w * 0.5, h, 6), far ? rockFar : rock);
        body.position.y = h * 0.5 - 6;
        body.rotation.y = Math.random() * 1.2;
        g.add(body);
        // 雪顶（顶部 34%）
        const capH = h * 0.36;
        const capW = w * 0.5 * 0.36;
        const cap = new THREE.Mesh(new THREE.ConeGeometry(capW, capH, 6), snow);
        cap.position.y = h - capH * 0.5 - 6 + 0.4;
        cap.rotation.y = body.rotation.y;
        g.add(cap);
        g.position.set(x, 0, z);
        scene.add(g);
        return g;
      }

      // 远层：偏蓝、更淡
      const farZ = 1350;
      for (let i = 0; i < 18; i++) {
        const x = -900 + i * 104 + (Math.random() - 0.5) * 40;
        const h = 175 + S.fbm2(i * 0.7, 2.3, 3) * 130;
        const w = 210 + Math.random() * 110;
        peak(x, farZ + Math.random() * 160, w, h, true);
      }
      // 近层：偏灰、更低，压在山脚
      const nearZ = 980;
      for (let i = 0; i < 16; i++) {
        const x = -840 + i * 112 + (Math.random() - 0.5) * 46;
        const h = 104 + S.fbm2(i * 1.1, 5.1, 3) * 76;
        const w = 190 + Math.random() * 100;
        peak(x, nearZ + Math.random() * 130, w, h, false);
      }

    })();

    /* ==================================================================
       3D 标签
       ================================================================== */
    const labelObjs = [];
    let labelTick = 0;
    const labelV = new THREE.Vector3();

    function addLabel(text, pos, opt) {
      opt = opt || {};
      const obj = S.makeLabel(CSS2DObject, text, pos, 'sv-label' + (opt.minor ? ' is-minor' : ''));
      obj.userData.inner = obj.element;
      obj.userData.key = opt.key || null;
      scene.add(obj);
      labelObjs.push(obj);
      return obj;
    }

    addLabel('坞院', P(-12, 5.6, -16), { key: 'wuyuan' });
    addLabel('院门（东开）', P(30.5, 4.8, 0), { key: 'zhi' });
    addLabel('房屋 27 间', P(-3, 5.0, -20.5), { key: 'fangwu' });
    addLabel('马厩（南墙外）', P(6, 4.8, 41), { key: 'majiu' });
    addLabel('水井', P(9.5, 4.4, 3.0), { key: 'fangwu', minor: true });
    addLabel('粮仓', P(-16.5, 5.0, 9.0), { key: 'fangwu', minor: true });
    addLabel('烽墩', P(-21.5, 13.6, 21.5), { key: 'fengdun' });
    addLabel('驿道', P(38, 2.4, 46), { key: 'yidao' });
    addLabel('悬泉', P(14, 5.6, 96), { key: 'xuanquan' });
    addLabel('驼队', P(38, 3.6, 22), { key: 'yidao', minor: true });
    addLabel('祁连山', P(-20, 62, 500), { key: 'qilian', minor: true });

    /* ==================================================================
       交互
       ================================================================== */
    const voice = S.createVoice({ audioBase: '../audio/xuanquan/' });
    S.bindVoiceButton(document.getElementById('voiceBtn'), voice);
    const card = S.createCard(document.getElementById('card'));
    const picker = S.makePicker(camera, renderer.domElement);
    const fly = S.makeFly(camera, controls);

    function defByKey(key) {
      return SPOTS.find((s) => s.id === key) || FIGURES.find((f) => f.id === key) || null;
    }

    function showInfo(def) {
      if (!def) return;
      card.show(def);
      voice.speak(S.narrate(def), def.id);
    }

    function markSpot(key) {
      document.querySelectorAll('.xq-item').forEach((b) => {
        b.classList.toggle('is-on', b.dataset.key === key);
      });
    }

    const FOCUS = {
      wuyuan: { pos: P(46, 30, -58), target: P(0, 5, 2) },
      zhi: { pos: P(41, 2.6, 2), target: P(25.2, 1.7, 0) },
      jiandu: { pos: P(28, 13, -40), target: P(0, 1.5, 0) },
      fangwu: { pos: P(22, 14, -52), target: P(-4, 3, -14) },
      majiu: { pos: P(10, 13, 70), target: P(0, 3, 37) },
      fengdun: { pos: P(8, 19, 56), target: P(-20, 8, 22) },
      yidao: { pos: P(46, 3.4, 17), target: P(38, 1.6, 9) },
      xuanquan: { pos: P(34, 13, 120), target: P(14, 3, 96) },
      changhui: { pos: P(44, 15, -30), target: P(24, 3, 0) },
      qilian: { pos: P(40, 60, 40), target: P(0, 62, 520) },
    };

    function focusKey(key) {
      const def = defByKey(key);
      if (!def) return;
      showInfo(def);
      markSpot(key);
      const f = FOCUS[key];
      if (f) fly.flyTo(f.pos, f.target, 1.2);
    }

    /* ---- 拾取 ---- */
    function pickTargets() {
      return scene.children.filter((o) => o.userData && o.userData.kind);
    }
    function resolveOwner(obj) {
      let o = obj;
      while (o && !(o.userData && o.userData.kind)) o = o.parent;
      return o ? o.userData : null;
    }
    picker.onHover(() => scene.children, (obj) => {
      renderer.domElement.style.cursor = resolveOwner(obj) ? 'pointer' : 'grab';
    });
    picker.onClick(() => scene.children, (obj) => {
      const owner = resolveOwner(obj);
      if (!owner) return;
      if (owner.key) focusKey(owner.key);
    });

    /* ---- 索引 ---- */
    const spotList = document.getElementById('spotList');
    ['wuyuan', 'zhi', 'jiandu', 'fangwu', 'majiu', 'fengdun', 'yidao', 'xuanquan'].forEach((key) => {
      const def = defByKey(key);
      if (!def) return;
      const b = document.createElement('button');
      b.className = 'xq-item';
      b.dataset.key = key;
      b.innerHTML = '<span class="xq-item__dot" style="background:' + def.color + ';color:' + def.color + '"></span>' + def.name;
      b.addEventListener('click', () => focusKey(key));
      spotList.appendChild(b);
    });

    /* ==================================================================
       视角
       ================================================================== */
    const VIEWS = {
      overview: { pos: P(30, 26, -80), target: P(0, 6, 6) },
      yard: { pos: P(10, 20, -62), target: P(0, 3, 4) },
      stable: { pos: P(9, 6.5, 54), target: P(0, 2.2, 33) },
      tower: { pos: P(12, 20, 62), target: P(-20, 8, 22) },
      road: { pos: P(46, 3.4, 17), target: P(38, 1.6, 9) },
    };

    function setView(name) {
      const v = VIEWS[name] || VIEWS.overview;
      fly.flyTo(v.pos, v.target, 1.3);
      document.querySelectorAll('[data-view]').forEach((b) => {
        b.classList.toggle('is-on', b.dataset.view === name);
      });
      card.hide();
      markSpot(null);
    }

    document.querySelectorAll('[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    document.getElementById('resetBtn').addEventListener('click', () => setView('overview'));

    let isPlaying = true;
    const clock = new THREE.Clock();
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying
        ? '<span class="sv-btn__icon">⏸</span><span>暂停</span>'
        : '<span class="sv-btn__icon">▶</span><span>播放</span>';
      if (!isPlaying) clock.getDelta();
    });

    /* ==================================================================
       标签避让
       ================================================================== */
    function layoutLabels() {
      if ((labelTick++ % 2) !== 0) return;
      const items = [];
      labelObjs.forEach((o) => {
        const el = o.userData.inner;
        if (!el || parseFloat(el.style.opacity || '1') < 0.3) return;
        o.getWorldPosition(labelV);
        labelV.project(camera);
        if (labelV.z > 1) return;
        const x = (labelV.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-labelV.y * 0.5 + 0.5) * window.innerHeight;
        const w = el.offsetWidth || 56;
        const h = el.offsetHeight || 18;
        items.push({ el, sx: x - w / 2, sy: y - h / 2, w, h });
      });
      items.sort((a, b) => a.sy - b.sy);
      const placed = [];
      items.forEach((it) => {
        let shift = 0;
        for (let k = 0; k < 8; k++) {
          const box2 = { x1: it.sx, y1: it.sy + shift, x2: it.sx + it.w, y2: it.sy + it.h + shift };
          const hit = placed.some((p) => !(box2.x2 < p.x1 || box2.x1 > p.x2 || box2.y2 < p.y1 || box2.y1 > p.y2));
          if (!hit) { placed.push(box2); break; }
          shift += it.h + 3;
        }
        it.el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
      });
    }

    /* ==================================================================
       动画：旗面飘动 + 骆驼/马/人行走
       ================================================================== */
    let elapsed = 0;

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (isPlaying) {
        elapsed += dt;
        // 旗面波动
        if (window.__flag) {
          const pos = window.__flag.geometry.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), y = pos.getY(i);
            const k = (x + 0.95) / 1.9;
            pos.setZ(i, Math.sin((x + 0.95) * 2.2 + elapsed * 2.4 + y * 0.4) * 0.2 * k);
          }
          pos.needsUpdate = true;
          window.__flag.geometry.computeVertexNormals();
        }
        // 角色：骆驼成队走驿道，马遛圈、在厩里吃料，人各走各的路
        for (let i = 0; i < ACTORS.length; i++) updateActor(ACTORS[i], dt, elapsed);
      }
      fly.update(dt);
      controls.update();
      layoutLabels();
      labelRenderer.render(scene, camera);
      if (composer) composer.render();
      else renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    /* ==================================================================
       启动
       ================================================================== */
    setView('overview');
    document.getElementById('loader').classList.add('is-done');
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
