  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    


    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 讲解文案（卡片 / 语音共用一份） --------- */
    // 优先用 info.say（写给"耳朵"的口语讲解），没有时用结构化字段拼一句
    function narrate(info) {
      if (!info) return '';
      if (info.say) return info.say;
      const parts = [info.name + '。'];
      if (info.type) parts.push(info.type + '。');
      if (info.stats && info.stats.length) {
        parts.push(info.stats.map((s) => s.label + '，' + s.value).join('。') + '。');
      }
      if (info.desc && info.desc.length) parts.push(info.desc.join('。'));
      return parts.join('').replace(/。{2,}/g, '。');
    }
    
    /* ---------------- 语音（神经语音包优先，浏览器语音兜底） ---------------- */
    /**
     * 两级语音方案：
     *   1) 预生成的神经语音包（edge-tts 晓晓 / 云希等）—— 音质接近真人，
     *      文件命名 v_<id>.mp3，放在 audioBase 目录下，离线可用、无密钥。
     *   2) 浏览器 speechSynthesis —— 语音包里没有这句时兜底，并做了音色排序
     *      （优先云端自然音 / 增强音色）与按句切分，比直接取第一个中文音色自然得多。
     *
     * 用法：const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
     *       voice.speak(S.narrate(data), data.voiceId);
     */
    function createVoice(opts) {
      opts = opts || {};
      const audioBase = opts.audioBase || null;   // 语音包目录，留空则纯浏览器语音
      const synth = window.speechSynthesis || null;
      let enabled = true;
      let zhVoice = null;
      let audioEl = null;
      let seq = 0;                                 // 打断计数：切天体时丢弃旧队列
      const missing = Object.create(null);         // 语音包里不存在的 id，只探测一次
    
      /* --- 音色挑选：给候选中文音色打分，取最自然的一个 --- */
      function score(v) {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        let s = 0;
        if (/xiaoxiao|xiaoyi|yunxi|yunjian|晓晓|云希|云扬/.test(name)) s += 60;
        if (/natural|neural|premium|enhanced|自然/.test(name)) s += 40;
        if (/google/.test(name)) s += 32;                 // Chrome 云端音，韵律较自然
        if (/ting-?ting|tingting|meijia|sinji|婷婷|美佳|善怡|美嘉/.test(name)) s += 24;
        if (/^zh[-_]?cn|cmn|^zh$/.test(lang)) s += 18;
        if (/^zh[-_]?(hk|tw)|yue/.test(lang)) s -= 14;    // 粤语 / 台湾腔，普通话场景降权
        if (v.localService) s += 6;                       // 本地音：断网也能用
        return s;
      }
      function pick() {
        if (!synth || !synth.getVoices) return;
        const all = synth.getVoices() || [];
        const zh = all.filter((v) => /^zh|cmn|yue/i.test(v.lang || ''));
        if (!zh.length) return;
        zhVoice = zh.slice().sort((a, b) => score(b) - score(a))[0] || null;
      }
      if (synth) {
        pick();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', pick);
      }
    
      /* --- 兜底：浏览器语音，按句切开逐句念，停顿更自然 --- */
      function chunk(text) {
        const parts = String(text).replace(/\s+/g, '').match(/[^。！？；!?]+[。！？；!?]?/g) || [];
        const out = [];
        let buf = '';
        parts.forEach((p) => {
          if (buf && (buf + p).length > 46) { out.push(buf); buf = p; }
          else buf += p;
        });
        if (buf) out.push(buf);
        return out.length ? out : [String(text)];
      }
      function speakTTS(text) {
        if (!synth || !text) return;
        const mySeq = ++seq;
        const chunks = chunk(text);
        let i = 0;
        const next = () => {
          if (!enabled || mySeq !== seq || i >= chunks.length) return;
          const u = new SpeechSynthesisUtterance(chunks[i++]);
          u.lang = 'zh-CN';
          u.rate = 0.98;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (!zhVoice) pick();
          if (zhVoice) u.voice = zhVoice;
          u.onend = () => setTimeout(next, 90);
          u.onerror = () => {};
          synth.speak(u);
        };
        // Chrome 在 cancel() 之后立刻 speak() 偶发静音，等一小会儿再开口
        setTimeout(next, 60);
      }
    
      /* --- 首选：播放语音包 --- */
      function playPack(id, text) {
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.preload = 'auto';
        }
        const el = audioEl;
        let done = false;
        const fallback = () => {
          if (done) return;
          done = true;
          missing[id] = true;
          speakTTS(text);
        };
        el.onerror = fallback;
        el.onplaying = () => { el.onerror = null; };
        el.src = audioBase + 'v_' + id + '.mp3';
        const p = el.play();
        if (p && p.catch) p.catch(fallback);
      }
    
      function speak(text, id) {
        if (!enabled || !text) return;
        if (id && audioBase && !missing[id]) {
          seq++;                      // 打断上一句（浏览器语音队列）
          if (synth) synth.cancel();
          playPack(id, text);
          return;
        }
        if (audioEl) audioEl.pause();
        if (synth) synth.cancel();
        speakTTS(text);
      }
      function stop() {
        seq++;
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        if (synth) synth.cancel();
      }
      function toggle() {
        enabled = !enabled;
        if (!enabled) stop();
        return enabled;
      }
      return { speak, stop, toggle, isEnabled: () => enabled, hasPack: !!audioBase };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      // 页面里已有 .sv-card 容器时直接复用，避免套娃出两层透明卡片
      const host = container && container.nodeType === 1 ? container : document.body;
      let el;
      if (host.classList && host.classList.contains('sv-card')) {
        el = host;
      } else {
        el = document.createElement('div');
        el.className = 'sv-card';
        host.appendChild(el);
      }
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span>' + s.label + '</span><b>' + s.value + '</b>';
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        el.classList.add('is-open');
      }
      function hide() { el.classList.remove('is-open'); }
      close.addEventListener('click', hide);
      return { element: el, show, hide };
    }
    
    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const hits = raycaster.intersectObjects(targets, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          const th = u * Math.PI * 2;
          const nx = Math.cos(th) * 3, ny = Math.sin(th) * 3;
          const n = fbm2(nx + 1.7, v * 5 - ny * 0.4, 5);
          const n2 = fbm2(nx * 2.3 + 9.1, v * 7 + 3.3, 4);
          let t = clamp(n * 0.7 + n2 * 0.3, 0, 1);
          const col = sampleBands(bands, t);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function sampleBands(bands, t) {
      const seg = 1 / (bands.length - 1);
      const idx = Math.min(Math.floor(t / seg), bands.length - 2);
      const local = (t - idx * seg) / seg;
      return bands[idx].clone().lerp(bands[idx + 1], local);
    }
    
    // 恐龙皮肤纹理（鳞片噪声 + 色斑 + 腹部渐变）
    function skinTexture(baseColor, spotColor, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const base = new THREE.Color(baseColor);
      const spot = new THREE.Color(spotColor);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          // 鳞片：高频网格噪声
          const scale = fbm2(u * 18, v * 18, 4);
          const scale2 = fbm2(u * 40 + 3, v * 40 + 7, 3);
          // 色斑：低频大块斑纹
          const spotN = fbm2(u * 6 + 11, v * 6 - 5, 4);
          let col = base.clone();
          col.lerp(spot, S.clamp((spotN - 0.42) * 3.0, 0, 1) * 0.5);
          // 鳞片刻痕（微亮/微暗）
          const sheen = (scale2 - 0.5) * 0.16 + (scale - 0.5) * 0.08;
          col.r = S.clamp(col.r + sheen, 0, 1);
          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createStarfield(count, radius, color1, color2) {
      count = count || 1400;
      radius = radius || 240;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c1 = new THREE.Color(color1 || 0xffffff);
      const c2 = new THREE.Color(color2 || 0xaac4ff);
      for (let i = 0; i < count; i++) {
        const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1)
          .normalize().multiplyScalar(radius);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
        const c = c1.clone().lerp(c2, Math.random());
        const b = 0.4 + Math.random() * 0.6;
        col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.5, vertexColors: true, transparent: true, opacity: 0.85,
        sizeAttenuation: true, depthWrite: false,
      });
      return new THREE.Points(geo, mat);

    // 换算常数：1 光年 = 9.4607 万亿 km，光速 299792.458 km/s
    const LY_KM = 9.4607e12;
    const C_KMS = 299792.458;
    const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';

    // 距离 → 光年（科学计数法，太阳系里的数值都极小）
    function fmtLy(km) {
      const v = km / LY_KM;
      const exp = Math.floor(Math.log10(v));
      const mant = v / Math.pow(10, exp);
      const e = String(exp).replace('-', '⁻').replace(/[0-9]/g, (d) => SUP[+d]);
      return mant.toFixed(2) + '×10' + e + ' 光年';
    }
    // 距离 → 光行时（光跑这段路要多久）
    function fmtLightTime(km) {
      const s = km / C_KMS;
      if (s < 60) return s.toFixed(1) + ' 秒';
      if (s < 3600) return Math.floor(s / 60) + ' 分 ' + Math.round(s % 60) + ' 秒';
      return Math.floor(s / 3600) + ' 小时 ' + Math.round((s % 3600) / 60) + ' 分';
    }

    /* @voice-data-end */

    /* ================= 由数据生成卡片 / 语音信息 ================= */
    function statsOf(b) {
      const rows = [];
      if (b.distKm) {
        rows.push({ label: b.distLabel || '距太阳', value: b.distText });
        rows.push({ label: '折合光年', value: fmtLy(b.distKm) });
        rows.push({ label: '光行时', value: fmtLightTime(b.distKm) });
      }
      if (b.rotation) rows.push({ label: '自转周期', value: b.rotation });
      if (b.revolution) rows.push({ label: '公转周期', value: b.revolution });
      if (b.diameter) rows.push({ label: '直径', value: b.diameter });
      if (b.moons) rows.push({ label: '卫星', value: b.moons });
      (b.extra || []).forEach(([label, value]) => rows.push({ label, value }));
      return rows;
    }
    function infoOf(b) {
      return {
        name: b.name,
        type: b.type,
        color: parseInt(b.color.slice(1), 16),
        stats: statsOf(b),
        desc: b.desc || [],
        say: b.say || '',
        voiceId: b.id,
      };
    }
    const BY_ID = {};
    BODIES.forEach((b) => { BY_ID[b.id] = b; });

    /* ================= 渲染 ================= */
    const scene = S.createScene(0x02040a);
    const camera = S.createCamera(52, 0.1, 2000);
    // 相机距离需大于最外圈轨道（海王星 26.8），否则外行星转到近侧时
    // 会贴到镜头前被放大成"前景道具"、盖住底部控制坞
    camera.position.set(0, 24, 46);

    const { renderer, composer, renderPass } = S.createRenderer({ exposure: 1.15, bloomStrength: 0.75, bloomThreshold: 0.8 });
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const controls = S.createControls(camera, renderer.domElement, new THREE.Vector3(0, 0, 0));
    controls.minDistance = 1.2;
    controls.maxDistance = 130;
    controls.maxPolarAngle = Math.PI;

    // 环境光（程序化 IBL，让 PBR 材质有真实反射）
    renderPass.scene = scene;
    renderPass.camera = camera;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = envTex;
    scene.add(new THREE.AmbientLight(0x334455, 0.35));

    // 主光源（模拟太阳）
    const sunLight = new THREE.PointLight(0xfff2d0, 3.0, 0, 0.5);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    // 星空
    scene.add(S.createStarfield(1600, 500, 0xffffff, 0x9fb8ff));

    /* ================= 太阳 ================= */
    const sunDef = BY_ID.sun;
    const SUN_R = 2.4;
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(SUN_R, 64, 64),
      new THREE.MeshBasicMaterial({ color: 0xffb347 })
    );
    sun.userData = infoOf(sunDef);
    scene.add(sun);

    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: S.glowTexture('rgba(255,220,140,1)', 'rgba(255,150,50,0.4)'),
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    sunGlow.scale.set(16, 16, 1);
    scene.add(sunGlow);

    /* ================= 行星 ================= */
    const clickable = [sun];
    const labelByBody = new Map();
    const orbitGroup = new THREE.Group();
    scene.add(orbitGroup);

    function makeLabel(text, cls) {
      const div = document.createElement('div');
      div.className = cls || 'sv-label';
      div.textContent = text;
      return new CSS2DObject(div);
    }

    const SPIN_GAIN = 1.5;      // 自转的视觉增益（比例与真实一致，只是整体加快）
    const ORBIT_GAIN = 0.15;    // 公转的视觉增益

    const planetNodes = [];     // { def, body, spinGroup, pivot }
    const nodeById = {};

    BODIES.filter((b) => b.kind === 'planet').forEach((p) => {
      // 轨道环
      const orbit = new THREE.Mesh(
        new THREE.RingGeometry(p.orbit - 0.03, p.orbit + 0.03, 256),
        new THREE.MeshBasicMaterial({ color: 0x33507a, side: THREE.DoubleSide, transparent: true, opacity: 0.4 })
      );
      orbit.rotation.x = -Math.PI / 2;
      orbitGroup.add(orbit);

      // 自转轴组（带倾角）
      const spinGroup = new THREE.Group();
      spinGroup.rotation.z = THREE.MathUtils.degToRad(p.tilt);

      // 行星表面（程序化贴图）
      const planetTex = S.planetTexture(p.palette, 256);
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(p.size, 48, 48),
        new THREE.MeshStandardMaterial({ map: planetTex, roughness: 0.7, metalness: 0.05 })
      );
      body.userData = infoOf(p);
      spinGroup.add(body);

      // 大气层（背光菲涅尔发光）
      const atmo = new THREE.Mesh(
        new THREE.SphereGeometry(p.size * 1.03, 48, 48),
        new THREE.MeshBasicMaterial({
          color: new THREE.Color(p.palette[2]), transparent: true, opacity: 0.22,
          blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false,
        })
      );
      spinGroup.add(atmo);

      // 土星环
      if (p.id === 'saturn') {
        const ringTex = S.planetTexture(['#8a7448', '#cbb887', '#e8dcc0', '#c9b078', '#9a8458'], 256);
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(p.size * 1.35, p.size * 2.3, 128),
          new THREE.MeshBasicMaterial({ map: ringTex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.rotation.z = 0.2;
        spinGroup.add(ring);
      }

      // 标签
      const label = makeLabel(p.name);
      label.position.set(0, p.size + 0.7, 0);
      spinGroup.add(label);
      labelByBody.set(body, label);

      // 公转枢轴
      const pivot = new THREE.Group();
      pivot.add(spinGroup);
      orbitGroup.add(pivot);

      const node = { def: p, body, spinGroup, pivot, angle: Math.random() * Math.PI * 2 };
      planetNodes.push(node);
      nodeById[p.id] = node;
      clickable.push(body);
    });

    /* ================= 卫星（月球等） ================= */
    const moonNodes = [];
    BODIES.filter((b) => b.kind === 'moon').forEach((m) => {
      const host = nodeById[m.parent];
      if (!host) return;

      // 卫星公转轨道环（挂在母行星的自转轴组下，跟着一起倾斜）
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(m.orbitR - 0.006, m.orbitR + 0.006, 128),
        new THREE.MeshBasicMaterial({ color: 0x5080b8, side: THREE.DoubleSide, transparent: true, opacity: 0.22 })
      );
      ring.rotation.x = -Math.PI / 2;
      host.spinGroup.add(ring);

      const tex = S.planetTexture(m.palette, 128);
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(m.size, 32, 32),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.02 })
      );
      body.userData = infoOf(m);

      const pivot = new THREE.Group();
      pivot.add(body);
      host.spinGroup.add(pivot);

      // 月球带小号常驻标签，其他小卫星不显示（否则木星的标签会糊成一团）
      let label = null;
      if (m.label) {
        label = makeLabel(m.name, 'sv-label sv-label--sm');
        label.position.set(0, m.size + 0.34, 0);
        body.add(label);
        labelByBody.set(body, label);
      }

      moonNodes.push({ def: m, body, pivot, label, angle: Math.random() * Math.PI * 2 });
      clickable.push(body);
    });

    const sunLabel = makeLabel('太阳');
    sunLabel.position.set(0, SUN_R + 1.2, 0);
    scene.add(sunLabel);
    labelByBody.set(sun, sunLabel);

    /* ================= 交互 ================= */
    const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
    S.bindVoiceButton(document.getElementById('voiceBtn'), voice);

    const card = S.createCard(document.getElementById('card') || document.body);
    const picker = S.makePicker(camera, renderer.domElement);
    const fly = S.makeFly(camera, controls);

    // 悬停高亮
    let hoveredBody = null;
    function setHover(body) {
      if (hoveredBody === body) return;
      if (hoveredBody) {
        const old = labelByBody.get(hoveredBody);
        if (old) old.element.classList.remove('is-active');
      }
      hoveredBody = body;
      if (body) {
        const cur = labelByBody.get(body);
        if (cur) cur.element.classList.add('is-active');
      }
      renderer.domElement.style.cursor = body ? 'pointer' : 'grab';
    }

    picker.onHover(clickable, (obj) => {
      setHover(obj && obj.userData && obj.userData.name ? obj : null);
    });

    // 跟随选中的天体（月球、行星都在动，镜头跟着走才不会跑出画面）
    let follow = null;
    let selected = null;
    const followPos = new THREE.Vector3();

    function focusBody(obj) {
      if (!obj || !obj.userData || !obj.userData.name) return;
      const data = obj.userData;
      selected = obj;
      follow = null;
      card.show(data);
      voice.speak(S.narrate(data), data.voiceId);

      // 平滑拉近
      const target = new THREE.Vector3();
      obj.getWorldPosition(target);
      const r = (obj.geometry && obj.geometry.parameters && obj.geometry.parameters.radius) || 0.5;
      const dist = Math.max(r * 5.5 + 1.6, 2.2);
      const dir = camera.position.clone().sub(target).normalize();
      fly.flyTo(target.clone().add(dir.multiplyScalar(dist)), target, 1.0, () => {
        if (selected === obj) {
          follow = { obj, last: new THREE.Vector3() };
          obj.getWorldPosition(follow.last);
        }
      });
    }

    picker.onClick(clickable, (obj) => {
      if (obj && obj.userData && obj.userData.name) focusBody(obj);
    });

    // 标签也可点：小卫星本体只有几个像素，点名字更省事
    labelByBody.forEach((label, body) => {
      const el = label.element;
      el.style.pointerEvents = 'auto';
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => { e.stopPropagation(); focusBody(body); });
    });

    /* ================= 控制 ================= */
    let isPlaying = true;
    let timeScale = 1;
    const SPEEDS = [1, 4, 20, 60];

    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying ? '<span class="sv-btn__icon">⏸</span><span>暂停</span>' : '<span class="sv-btn__icon">▶</span><span>播放</span>';
      if (!isPlaying) clock.getDelta();
    });

    const speedBtn = document.getElementById('speedBtn');
    speedBtn.addEventListener('click', () => {
      const i = SPEEDS.indexOf(timeScale);
      timeScale = SPEEDS[(i + 1) % SPEEDS.length];
      speedBtn.textContent = '速度 ×' + timeScale;
    });

    const topBtn = document.getElementById('topBtn');
    topBtn.addEventListener('click', () => {
      follow = null;
      selected = null;
      fly.flyTo(new THREE.Vector3(0, 46, 0.01), new THREE.Vector3(0, 0, 0), 1.3);
    });

    /* ================= 自动漫游 ================= */
    const tourBtn = document.getElementById('tourBtn');
    let touring = false, tourIdx = 0, tourState = 'fly', tourT = 0;
    // 月球排在它妈妈地球后面
    const TOUR = ['sun', 'mercury', 'venus', 'earth', 'moon', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];
    const tourTarget = new THREE.Vector3();

    function bodyById(id) {
      if (id === 'sun') return sun;
      const node = nodeById[id] || moonNodes.find((n) => n.def.id === id);
      return node ? node.body : null;
    }

    tourBtn.addEventListener('click', () => {
      touring = !touring;
      if (touring) {
        tourIdx = 0; tourState = 'fly'; tourT = 0;
        follow = null;
        tourBtn.innerHTML = '<span class="sv-btn__icon">⏹</span><span>停止漫游</span>';
        tourBtn.classList.add('is-active');
      } else {
        tourBtn.innerHTML = '<span class="sv-btn__icon">🚀</span><span>自动漫游</span>';
        tourBtn.classList.remove('is-active');
        fly.cancel();
      }
    });

    function tourStep(dt) {
      const obj = bodyById(TOUR[tourIdx]);
      if (!obj) { touring = false; return; }
      obj.getWorldPosition(tourTarget);
      const r = (obj.geometry && obj.geometry.parameters && obj.geometry.parameters.radius) || 0.5;
      const dist = Math.max(r * 5.5 + 1.6, 2.2);
      const camPos = tourTarget.clone().add(new THREE.Vector3(dist * 0.6, dist * 0.45, dist * 0.6));

      if (tourState === 'fly') {
        fly.flyTo(camPos, tourTarget, 1.2);
        tourState = 'intro'; tourT = 0;
      } else if (tourState === 'intro') {
        tourT += dt;
        if (tourT > 2.8) {
          card.show(obj.userData);
          voice.speak(S.narrate(obj.userData), obj.userData.voiceId);
          tourState = 'wait'; tourT = 0;
        }
      } else if (tourState === 'wait') {
        tourT += dt;
        if (tourT > 6.0) {
          tourIdx++;
          if (tourIdx >= TOUR.length) {
            touring = false;
            tourBtn.innerHTML = '<span class="sv-btn__icon">🚀</span><span>自动漫游</span>';
            tourBtn.classList.remove('is-active');
            card.hide();
            fly.flyTo(new THREE.Vector3(0, 24, 46), new THREE.Vector3(0, 0, 0), 1.4);
          } else {
            tourState = 'fly';
          }
        }
      }
    }

    /* ================= 动画 ================= */
    const clock = new THREE.Clock();
    const SUN_SPIN = 0.039;   // 太阳自转（相对地球，25.4 天）

    function animate() {
      const dt = clock.getDelta();
      const dts = isPlaying ? dt * timeScale : 0;

      planetNodes.forEach((m) => {
        m.angle += dts * m.def.orbitSpeed * ORBIT_GAIN;
        m.pivot.position.set(
          Math.cos(m.angle) * m.def.orbit,
          0,
          Math.sin(m.angle) * m.def.orbit
        );
        m.body.rotation.y += dts * m.def.spin * SPIN_GAIN;
      });

      moonNodes.forEach((m) => {
        m.angle += dts * m.def.orbitSpeed * ORBIT_GAIN;
        const R = m.def.orbitR;
        m.pivot.position.set(Math.cos(m.angle) * R, 0, Math.sin(m.angle) * R);
        // 潮汐锁定：自转角 = 公转角，所以总是同一面朝向母星
        m.body.rotation.y = -m.angle;
      });

      // 月球标签始终显示（这是本次要解决的问题：月球不能"隐身"）

      if (isPlaying) {
        sun.rotation.y += dts * SUN_SPIN;
        const pulse = 1 + Math.sin(performance.now() / 600) * 0.04;
        sunGlow.scale.set(16 * pulse, 16 * pulse, 1);
      }

      if (touring && isPlaying) tourStep(dt);
      fly.update(dt);

      // 跟随：把镜头的位移同步给目标天体，让它停在画面中心
      if (follow && !fly.isActive()) {
        follow.obj.getWorldPosition(followPos);
        const dx = followPos.x - follow.last.x;
        const dy = followPos.y - follow.last.y;
        const dz = followPos.z - follow.last.z;
        if (dx * dx + dy * dy + dz * dz < 4) {
          camera.position.x += dx; camera.position.y += dy; camera.position.z += dz;
          controls.target.x += dx; controls.target.y += dy; controls.target.z += dz;
        }
        follow.last.copy(followPos);
      }

      controls.update();
      labelRenderer.render(scene, camera);
      if (composer) composer.render();
      else renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    /* ================= 加载完成 & 自适应 ================= */
    setTimeout(() => document.getElementById('loader').classList.add('is-done'), 300);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
