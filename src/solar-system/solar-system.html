  {

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    

    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 语音（中文） --------- */
    function createVoice() {
      const synth = window.speechSynthesis;
      let enabled = true, zhVoice = null;
      function pick() {
        const vs = synth.getVoices();
        zhVoice = vs.find((v) => /zh/i.test(v.lang)) || null;
      }
      pick();
      synth.addEventListener('voiceschanged', pick);
      function speak(text) {
        if (!enabled || !synth || !text) return;
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.02;
        if (zhVoice) u.voice = zhVoice;
        synth.speak(u);
      }
      function toggle() { enabled = !enabled; if (!enabled) synth.cancel(); return enabled; }
      function stop() { synth.cancel(); }
      return { speak, toggle, stop, isEnabled: () => enabled };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      const el = document.createElement('div');
      el.className = 'sv-card';
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      container.appendChild(el);
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span>' + s.label + '</span><b>' + s.value + '</b>';
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        el.classList.add('is-open');
      }
      function hide() { el.classList.remove('is-open'); }
      close.addEventListener('click', hide);
      return { element: el, show, hide };
    }
    
    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const hits = raycaster.intersectObjects(targets, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          const th = u * Math.PI * 2;
          const nx = Math.cos(th) * 3, ny = Math.sin(th) * 3;
          const n = fbm2(nx + 1.7, v * 5 - ny * 0.4, 5);
          const n2 = fbm2(nx * 2.3 + 9.1, v * 7 + 3.3, 4);
          let t = clamp(n * 0.7 + n2 * 0.3, 0, 1);
          const col = sampleBands(bands, t);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function sampleBands(bands, t) {
      const seg = 1 / (bands.length - 1);
      const idx = Math.min(Math.floor(t / seg), bands.length - 2);
      const local = (t - idx * seg) / seg;
      return bands[idx].clone().lerp(bands[idx + 1], local);
    }
    
    // 恐龙皮肤纹理（鳞片噪声 + 色斑 + 腹部渐变）
    function skinTexture(baseColor, spotColor, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const base = new THREE.Color(baseColor);
      const spot = new THREE.Color(spotColor);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          // 鳞片：高频网格噪声
          const scale = fbm2(u * 18, v * 18, 4);
          const scale2 = fbm2(u * 40 + 3, v * 40 + 7, 3);
          // 色斑：低频大块斑纹
          const spotN = fbm2(u * 6 + 11, v * 6 - 5, 4);
          let col = base.clone();
          col.lerp(spot, S.clamp((spotN - 0.42) * 3.0, 0, 1) * 0.5);
          // 鳞片刻痕（微亮/微暗）
          const sheen = (scale2 - 0.5) * 0.16 + (scale - 0.5) * 0.08;
          col.r = S.clamp(col.r + sheen, 0, 1);
          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    
    /* ---------------- 星空（分层 + 大小/亮度变化） --------- */
    function createStarfield(count, radius, color1, color2) {
      count = count || 1400;
      radius = radius || 240;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c1 = new THREE.Color(color1 || 0xffffff);
      const c2 = new THREE.Color(color2 || 0xaac4ff);
      for (let i = 0; i < count; i++) {
        const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1)
          .normalize().multiplyScalar(radius);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
        const c = c1.clone().lerp(c2, Math.random());
        const b = 0.4 + Math.random() * 0.6;
        col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.5, vertexColors: true, transparent: true, opacity: 0.85,
        sizeAttenuation: true, depthWrite: false,
      });
      return new THREE.Points(geo, mat);
    }
    
    /* ---------------- UI 助手 --------- */
    // 创建 3D 标签（需传入 CSS2DObject 构造器）并定位
    function makeLabel(CSS2DObject, text, position, className) {
      const div = document.createElement('div');
      div.className = className || 'sv-label';
      div.textContent = text;
      const obj = new CSS2DObject(div);
      if (position) obj.position.copy(position);
      return obj;
    }
    
    function toast(text, ms) {  let el = document.querySelector('.sv-toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'sv-toast';
        document.body.appendChild(el);
      }
      el.textContent = text;
      el.classList.add('is-open');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('is-open'), ms || 2200);
    }
    function bindVoiceButton(btn, voice) {
      if (!btn) return;
      const sync = () => btn.classList.toggle('is-off', !voice.isEnabled());
      sync();
      btn.addEventListener('click', () => { voice.toggle(); sync(); });
    }
    
    // 具名导出集合（供 init 返回全部 API）
    const exports = {
      init, hash3, valueNoise2, fbm2, clamp, lerp,
      createRenderer, createScene, createCamera, createControls,
      makeFly, createVoice, createCard, makePicker, makeLabel,
      glowTexture, planetTexture, skinTexture, createStarfield,
      toast, bindVoiceButton,
    };
    
    
    return exports;
    })();

      土星: { color: 0xe5c87c, stats: [['距太阳','14.3 亿 km'],['直径','11.65 万 km'],['公转周期','29.46 年'],['特色','壮观环系']] },
      天王星: { color: 0x7fd8e5, stats: [['距太阳','28.7 亿 km'],['直径','5.07 万 km'],['公转周期','84 年'],['特色','侧躺自转']] },
      海王星: { color: 0x4a6fd6, stats: [['距太阳','45 亿 km'],['直径','4.92 万 km'],['公转周期','164.8 年'],['特色','风速最快']] },
    };
    function planetUserData(name) {
      const p = PLANET_INFO[name];
      return {
        name, type: '行星', color: p.color,
        stats: p.stats.map(([label, value]) => ({ label, value })),
        desc: [],
      };
    }

    const planets = [
      { name: '水星', radius: 5.2, size: 0.34, orbitSpeed: 4.15, spin: 0.5,  tilt: 0.03, palette: ['#7a6f5c', '#b9a98c', '#d8c9a8'] },
      { name: '金星', radius: 7.2, size: 0.5,  orbitSpeed: 1.62, spin: -0.3, tilt: 177.4, palette: ['#c9a04a', '#e8c56a', '#f2d98a'] },
      { name: '地球', radius: 9.4, size: 0.52, orbitSpeed: 1.0,  spin: 1.0,  tilt: 23.4, palette: ['#1b5fb0', '#2f8bd9', '#6bc1e8', '#8fd6a0', '#e0e0c8'] },
      { name: '火星', radius: 11.8, size: 0.4, orbitSpeed: 0.53, spin: 0.97, tilt: 25.2, palette: ['#8a3b2a', '#c96b4a', '#e09a6a'] },
      { name: '木星', radius: 15.0, size: 1.3, orbitSpeed: 0.084, spin: 2.3, tilt: 3.1, palette: ['#c8a06a', '#e0c08a', '#f0dcc0', '#d8a06a', '#e8c890'] },
      { name: '土星', radius: 19.0, size: 1.1, orbitSpeed: 0.034, spin: 2.1, tilt: 26.7, palette: ['#c8b070', '#e5c87c', '#f0d898'] },
      { name: '天王星', radius: 23.0, size: 0.9, orbitSpeed: 0.012, spin: 1.4, tilt: 97.8, palette: ['#6fb8cc', '#9fd8e0', '#c8ecf0'] },
      { name: '海王星', radius: 26.8, size: 0.86, orbitSpeed: 0.006, spin: 1.5, tilt: 28.3, palette: ['#2f4fb0', '#4a6fd6', '#7fa8f0'] },
    ];

    /* ================= 渲染 ================= */
    const scene = S.createScene(0x02040a);
    const camera = S.createCamera(52, 0.1, 2000);
    camera.position.set(0, 18, 34);

    const { renderer, composer, renderPass } = S.createRenderer({ exposure: 1.15, bloomStrength: 0.75, bloomThreshold: 0.8 });
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const controls = S.createControls(camera, renderer.domElement, new THREE.Vector3(0, 0, 0));
    controls.minDistance = 3;
    controls.maxDistance = 90;
    controls.maxPolarAngle = Math.PI;

    // 环境光（程序化 IBL，让 PBR 材质有真实反射）
    renderPass.scene = scene;
    renderPass.camera = camera;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = envTex;
    scene.add(new THREE.AmbientLight(0x334455, 0.35));

    // 主光源（模拟太阳）
    const sunLight = new THREE.PointLight(0xfff2d0, 3.0, 0, 0.5);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    // 星空
    scene.add(S.createStarfield(1600, 500, 0xffffff, 0x9fb8ff));

    /* ================= 太阳 ================= */
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(2.4, 64, 64),
      new THREE.MeshBasicMaterial({ color: 0xffb347 })
    );
    sun.userData = SUN_INFO;
    scene.add(sun);

    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: S.glowTexture('rgba(255,220,140,1)', 'rgba(255,150,50,0.4)'),
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    sunGlow.scale.set(16, 16, 1);
    scene.add(sunGlow);

    /* ================= 行星 ================= */
    const planetMeshes = [];
    const clickable = [sun];
    const orbitGroup = new THREE.Group();
    scene.add(orbitGroup);

    function makeLabel(text) {
      const div = document.createElement('div');
      div.className = 'sv-label';
      div.textContent = text;
      return new CSS2DObject(div);
    }

    planets.forEach((p) => {
      // 轨道环
      const orbit = new THREE.Mesh(
        new THREE.RingGeometry(p.radius - 0.03, p.radius + 0.03, 256),
        new THREE.MeshBasicMaterial({ color: 0x33507a, side: THREE.DoubleSide, transparent: true, opacity: 0.4 })
      );
      orbit.rotation.x = -Math.PI / 2;
      orbitGroup.add(orbit);

      // 自转轴组（带倾角）
      const spinGroup = new THREE.Group();
      spinGroup.rotation.z = THREE.MathUtils.degToRad(p.tilt);

      // 行星表面（程序化贴图）
      const planetTex = S.planetTexture(p.palette, 256);
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(p.size, 48, 48),
        new THREE.MeshStandardMaterial({ map: planetTex, roughness: 0.7, metalness: 0.05 })
      );
      body.userData = planetUserData(p.name);
      spinGroup.add(body);

      // 大气层（背光菲涅尔发光）
      const atmo = new THREE.Mesh(
        new THREE.SphereGeometry(p.size * 1.03, 48, 48),
        new THREE.MeshBasicMaterial({
          color: new THREE.Color(p.palette[2]), transparent: true, opacity: 0.22,
          blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false,
        })
      );
      spinGroup.add(atmo);

      // 土星环
      if (p.name === '土星') {
        const ringTex = S.planetTexture(['#8a7448', '#cbb887', '#e8dcc0', '#c9b078', '#9a8458'], 256);
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(p.size * 1.35, p.size * 2.4, 128),
          new THREE.MeshBasicMaterial({ map: ringTex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.rotation.z = 0.2;
        spinGroup.add(ring);
      }

      // 标签
      const label = makeLabel(p.name);
      label.position.set(0, p.size + 0.7, 0);
      spinGroup.add(label);

      // 公转枢轴
      const pivot = new THREE.Group();
      pivot.add(spinGroup);
      orbitGroup.add(pivot);

      planetMeshes.push({
        data: p, body, spinGroup, pivot, label,
        angle: Math.random() * Math.PI * 2,
      });
      clickable.push(body);
    });

    const sunLabel = makeLabel('太阳');
    sunLabel.position.set(0, 3.6, 0);
    scene.add(sunLabel);

    /* ================= 交互 ================= */
    const voice = S.createVoice();
    S.bindVoiceButton(document.getElementById('voiceBtn'), voice);

    const card = S.createCard(document.body);
    const picker = S.makePicker(camera, renderer.domElement);
    const fly = S.makeFly(camera, controls);

    // 悬停高亮
    let hoveredBody = null;
    function setHover(body) {
      if (hoveredBody === body) return;
      if (hoveredBody) {
        const pm = planetMeshes.find((m) => m.body === hoveredBody);
        if (pm) pm.label.element.classList.remove('is-active');
      }
      hoveredBody = body;
      if (body) {
        const pm = planetMeshes.find((m) => m.body === body);
        if (pm) pm.label.element.classList.add('is-active');
      }
      renderer.domElement.style.cursor = body ? 'pointer' : 'grab';
    }

    picker.onHover(clickable, (obj) => {
      setHover(obj && obj.userData && obj.userData.name ? obj : null);
    });

    picker.onClick(clickable, (obj) => {
      if (!obj || !obj.userData || !obj.userData.name) return;
      card.show(obj.userData);
      voice.speak(obj.userData.name + '。' +
        (obj.userData.stats ? obj.userData.stats.map((s) => s.label + s.value).join('，') : ''));
      // 平滑拉近
      const pm = planetMeshes.find((m) => m.body === obj);
      const target = new THREE.Vector3();
      if (pm) pm.body.getWorldPosition(target);
      else target.set(0, 0, 0);
      const r = obj === sun ? 2.4 : obj.geometry.parameters.radius;
      const dist = r * 6 + 2.5;
      const dir = camera.position.clone().sub(target).normalize();
      fly.flyTo(target.clone().add(dir.multiplyScalar(dist)), target, 1.0);
    });

    /* ================= 控制 ================= */
    let isPlaying = true;
    let timeScale = 1;
    const SPEEDS = [1, 4, 20, 60];

    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying ? '<span class="sv-btn__icon">⏸</span><span>暂停</span>' : '<span class="sv-btn__icon">▶</span><span>播放</span>';
      if (!isPlaying) clock.getDelta();
    });

    const speedBtn = document.getElementById('speedBtn');
    speedBtn.addEventListener('click', () => {
      const i = SPEEDS.indexOf(timeScale);
      timeScale = SPEEDS[(i + 1) % SPEEDS.length];
      speedBtn.textContent = '速度 ×' + timeScale;
    });

    const topBtn = document.getElementById('topBtn');
    topBtn.addEventListener('click', () => {
      fly.flyTo(new THREE.Vector3(0, 46, 0.01), new THREE.Vector3(0, 0, 0), 1.3);
    });

    /* ================= 自动漫游 ================= */
    const tourBtn = document.getElementById('tourBtn');
    let touring = false, tourIdx = 0, tourState = 'fly', tourT = 0;
    const tourOrder = [...planets.map((p) => p.name), '太阳'];
    const tourTarget = new THREE.Vector3();

    tourBtn.addEventListener('click', () => {
      touring = !touring;
      if (touring) {
        tourIdx = 0; tourState = 'fly'; tourT = 0;
        tourBtn.innerHTML = '<span class="sv-btn__icon">⏹</span><span>停止漫游</span>';
        tourBtn.classList.add('is-active');
      } else {
        tourBtn.innerHTML = '<span class="sv-btn__icon">🚀</span><span>自动漫游</span>';
        tourBtn.classList.remove('is-active');
        fly.cancel();
      }
    });

    function tourStep(dt) {
      const name = tourOrder[tourIdx];
      const obj = name === '太阳' ? sun : planetMeshes.find((m) => m.data.name === name).body;
      obj.getWorldPosition(tourTarget);
      const r = obj === sun ? 2.4 : obj.geometry.parameters.radius;
      const dist = r * 6 + 2.5;
      const camPos = tourTarget.clone().add(new THREE.Vector3(dist * 0.6, dist * 0.45, dist * 0.6));

      if (tourState === 'fly') {
        fly.flyTo(camPos, tourTarget, 1.2);
        tourState = 'intro'; tourT = 0;
      } else if (tourState === 'intro') {
        tourT += dt;
        if (tourT > 2.8) {
          card.show(obj.userData);
          voice.speak(name + '。' + (obj.userData.stats || []).map((s) => s.label + s.value).join('，'));
          tourState = 'wait'; tourT = 0;
        }
      } else if (tourState === 'wait') {
        tourT += dt;
        if (tourT > 4.5) {
          tourIdx++;
          if (tourIdx >= tourOrder.length) {
            touring = false;
            tourBtn.innerHTML = '<span class="sv-btn__icon">🚀</span><span>自动漫游</span>';
            tourBtn.classList.remove('is-active');
            card.hide();
            fly.flyTo(new THREE.Vector3(0, 18, 34), new THREE.Vector3(0, 0, 0), 1.4);
          } else {
            tourState = 'fly';
          }
        }
      }
    }

    /* ================= 动画 ================= */
    const clock = new THREE.Clock();

    function animate() {
      const dt = clock.getDelta();
      if (isPlaying) {
        planetMeshes.forEach((m) => {
          m.angle += dt * m.data.orbitSpeed * 0.15 * timeScale;
          m.pivot.position.set(
            Math.cos(m.angle) * m.data.radius,
            0,
            Math.sin(m.angle) * m.data.radius
          );
          m.body.rotation.y += dt * m.data.spin * timeScale;
        });
        sun.rotation.y += dt * 0.05;
        const pulse = 1 + Math.sin(performance.now() / 600) * 0.04;
        sunGlow.scale.set(16 * pulse, 16 * pulse, 1);
      }
      if (touring && isPlaying) tourStep(dt);
      fly.update(dt);
      controls.update();
      labelRenderer.render(scene, camera);
      if (composer) composer.render();
      else renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    /* ================= 加载完成 & 自适应 ================= */
    setTimeout(() => document.getElementById('loader').classList.add('is-done'), 300);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
