<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>太阳系 · 地球自转与公转</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    #info {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(0,0,0,0.55); padding: 10px 18px;
      border-radius: 8px; font-size: 14px; letter-spacing: 1px; pointer-events: none;
      white-space: nowrap;
    }
    #hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #ccc; font-size: 12px; pointer-events: none; }
    #voiceBtn {
      position: absolute; top: 16px; right: 20px; width: 44px; height: 44px;
      border-radius: 50%; border: none; cursor: pointer; font-size: 20px;
      background: rgba(10,15,30,0.85); color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10; transition: transform 0.2s, background 0.2s;
    }
    #voiceBtn:hover { transform: scale(1.1); }
    #voiceBtn.off { opacity: 0.45; }
    #playBtn {
      position: absolute; bottom: 60px; right: 20px; width: 44px; height: 44px;
      border-radius: 50%; border: none; cursor: pointer; font-size: 18px;
      background: rgba(10,15,30,0.85); color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10; transition: transform 0.2s, background 0.2s;
    }
    #playBtn:hover { transform: scale(1.1); }
    #tourBtn {
      position: absolute; bottom: 112px; right: 20px;
      padding: 0 16px; height: 40px; border-radius: 20px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 600; letter-spacing: 1px;
      background: linear-gradient(135deg, #6a5cff, #9a5cff); color: #fff;
      box-shadow: 0 4px 16px rgba(106,92,255,0.5); z-index: 10;
      transition: transform 0.2s, opacity 0.2s;
    }
    #tourBtn:hover { transform: scale(1.06); }
    #tourBtn.active { background: linear-gradient(135deg, #ff5c7a, #ff8a5c); }
    #caption {
      position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(0,0,0,0.65); padding: 10px 22px; border-radius: 24px;
      font-size: 16px; letter-spacing: 1px; text-align: center; white-space: nowrap;
      z-index: 10; display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="info">太阳系 · 地球自转与公转</div>
  <div id="hint">点击行星或恒星查看介绍 · 拖拽旋转视角 · 滚轮缩放</div>
  <button id="voiceBtn" title="语音开关">🔊</button>
  <button id="playBtn" title="暂停/继续动画">⏸</button>
  <button id="tourBtn" title="自动漫游">🚀 自动漫游</button>
  <div id="caption"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ---- 共享：中文语音播报 ----
    function createVoice(buttonEl) {
      const synth = window.speechSynthesis;
      let enabled = true;
      let zhVoice = null;
      function pickVoice() {
        const voices = synth.getVoices();
        zhVoice = voices.find((v) => /zh/i.test(v.lang)) || null;
      }
      pickVoice();
      synth.addEventListener('voiceschanged', pickVoice);
      function speak(text) {
        if (!enabled || !synth || !text) return;
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-CN'; utter.rate = 0.95; utter.pitch = 1.05;
        if (zhVoice) utter.voice = zhVoice;
        synth.speak(utter);
      }
      function toggle() {
        enabled = !enabled;
        if (buttonEl) buttonEl.classList.toggle('off', !enabled);
        if (!enabled) synth.cancel();
        return enabled;
      }
      if (buttonEl) buttonEl.addEventListener('click', toggle);
      return { speak, toggle, stop: () => synth.cancel(), isEnabled: () => enabled };
    }

    // ---- 共享：科普介绍卡片 ----
    function createInfoCard(container, { onShow } = {}) {
      const card = document.createElement('div');
      card.id = 'infoCard';
      card.style.cssText = `
        position: absolute; right: 20px; bottom: 20px; width: 300px;
        color: #fff; background: rgba(10,15,30,0.9); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 12px; padding: 18px 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        display: none; z-index: 10; backdrop-filter: blur(6px); font-family: inherit;
      `;
      const close = document.createElement('button');
      close.className = 'close';
      close.textContent = '\u00D7';
      close.style.cssText = `
        position: absolute; top: 10px; right: 12px; cursor: pointer; color: #9aa3b5;
        font-size: 18px; line-height: 1; background: none; border: none;
      `;
      close.addEventListener('mouseenter', () => (close.style.color = '#fff'));
      close.addEventListener('mouseleave', () => (close.style.color = '#9aa3b5'));
      const h3 = document.createElement('h3');
      h3.style.cssText = 'margin: 0 0 10px; font-size: 20px; display: flex; align-items: center; gap: 10px;';
      const dot = document.createElement('span');
      dot.style.cssText = 'width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0;';
      const title = document.createElement('span');
      h3.appendChild(dot); h3.appendChild(title);
      const body = document.createElement('div');
      body.id = 'cardBody';
      card.appendChild(close); card.appendChild(h3); card.appendChild(body);
      container.appendChild(card);
      close.addEventListener('click', () => hide());
      function show(userData) {
        if (!userData || !userData.name) return;
        dot.style.background = '#' + (userData.color || 0xffffff).toString(16).padStart(6, '0');
        title.textContent = userData.name + '（' + (userData.type || '天体') + '）';
        body.innerHTML = (userData.info || []).map((line) => '<p style="margin:6px 0;font-size:13px;line-height:1.7;color:#cfd6e6;">' + line + '</p>').join('');
        card.style.display = 'block';
        if (onShow) onShow(userData);
      }
      function hide() { card.style.display = 'none'; }
      return { element: card, show, hide };
    }

    // ---- 共享：点击拾取 ----
    function enablePicking(renderer, camera, { clickable, onPick }) {
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      renderer.domElement.addEventListener('click', (event) => {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(clickable, false);
        if (hits.length > 0 && onPick) onPick(hits[0].object);
      });
    }

    // ---- 数据 ----
    const INFO = {
      水星: ['距太阳最近的行星，距离约 0.000006 光年（约 5,790 万 km）', '直径：4,879 km', '公转周期：88 天', '自转周期：约 59 天', '表面温度：-173~427 ℃', '主要由铁构成，是密度最高的行星', '年龄约 45.6 亿年'],
      金星: ['距太阳约 0.00001 光年（约 1.08 亿 km）', '直径：12,104 km', '公转周期：225 天', '自转周期：243 天（逆向）', '浓厚的二氧化碳大气', '由岩石构成，覆盖着硫酸云', '年龄约 45.6 亿年'],
      地球: ['距太阳约 0.00002 光年（约 1.5 亿 km）', '直径：12,742 km', '公转周期：365.25 天', '自转周期：约 24 小时', '是唯一已知存在生命的星球', '由岩石构成，内部有铁质核心', '年龄约 45.4 亿年'],
      火星: ['距太阳约 0.00002 光年（约 2.28 亿 km）', '直径：6,779 km', '公转周期：687 天', '自转周期：约 24.6 小时', '拥有太阳系最高山——奥林帕斯山', '由岩石构成，表面富含氧化铁', '年龄约 45.6 亿年'],
      木星: ['距太阳约 0.00008 光年（约 7.79 亿 km）', '直径：139,820 km', '公转周期：11.86 年', '自转周期：约 9.9 小时', '著名的大红斑是巨型风暴', '主要由氢和氦构成，是气态巨行星', '年龄约 45.6 亿年'],
      土星: ['距太阳约 0.00015 光年（约 14.3 亿 km）', '直径：116,460 km', '公转周期：29.46 年', '自转周期：约 10.7 小时', '密度小于水，可漂浮', '主要由氢和氦构成，是气态巨行星', '年龄约 45.6 亿年'],
      天王星: ['距太阳约 0.0003 光年（约 28.7 亿 km）', '直径：50,724 km', '公转周期：84 年', '自转周期：约 17.2 小时', '自转轴倾角达 98°', '主要由氢、氦和甲烷冰构成', '年龄约 45.6 亿年'],
      海王星: ['距太阳约 0.0005 光年（约 45 亿 km）', '直径：49,244 km', '公转周期：164.8 年', '自转周期：约 16.1 小时', '风速可达每小时 2,100 公里', '主要由氢、氦和甲烷构成', '年龄约 45.6 亿年'],
    };
    const SUN_INFO = ['恒星系中心', '直径：1,392,700 km', '核心温度约 1,500 万 ℃', '约占太阳系总质量的 99.86%', '以氢核聚变产生能量', '主要由氢和氦构成', '年龄约 46 亿年'];
    const planetData = [
      { name: '水星', radius: 4.0, size: 0.28, orbitSpeed: 4.15, spinSpeed: 0.5,  color: 0xb9a98c, tilt: 0.0,  moons: 0 },
      { name: '金星', radius: 5.5, size: 0.42, orbitSpeed: 1.62, spinSpeed: -0.3, color: 0xe8c56a, tilt: 177.4, moons: 0 },
      { name: '地球', radius: 7.0, size: 0.48, orbitSpeed: 1.00, spinSpeed: 1.0,  color: 0x2a6fd6, tilt: 23.4, moons: 1 },
      { name: '火星', radius: 8.8, size: 0.34, orbitSpeed: 0.53, spinSpeed: 0.97, color: 0xd9534f, tilt: 25.2, moons: 2 },
      { name: '木星', radius: 11.5, size: 1.1,  orbitSpeed: 0.084, spinSpeed: 2.3, color: 0xd8a67a, tilt: 3.1, moons: 4 },
      { name: '土星', radius: 14.5, size: 0.95, orbitSpeed: 0.034, spinSpeed: 2.1, color: 0xe5c87c, tilt: 26.7, moons: 3 },
      { name: '天王星', radius: 17.5, size: 0.8, orbitSpeed: 0.012, spinSpeed: 1.4, color: 0x7fd8e5, tilt: 97.8, moons: 2 },
      { name: '海王星', radius: 20.5, size: 0.78, orbitSpeed: 0.006, spinSpeed: 1.5, color: 0x4a6fd6, tilt: 28.3, moons: 2 },
    ];

    // ---- 场景 ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(15, 10, 22);
    camera.lookAt(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    function makeLabel(text) {
      const div = document.createElement('div');
      div.textContent = text;
      div.style.cssText = `
        color: #fff; font-size: 14px; font-weight: 600; text-shadow: 0 0 6px rgba(0,0,0,0.9);
        padding: 2px 8px; background: rgba(0,0,0,0.45); border-radius: 12px; white-space: nowrap;
      `;
      return new CSS2DObject(div);
    }
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    // 星空
    const stars = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xffffff, size: 0.08 }));
    const starPos = new Float32Array(2000 * 3);
    for (let i = 0; i < 2000; i++) {
      starPos[i*3] = (Math.random() - 0.5) * 300;
      starPos[i*3+1] = (Math.random() - 0.5) * 300;
      starPos[i*3+2] = (Math.random() - 0.5) * 300;
    }
    stars.geometry.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(stars);
    // 灯光
    scene.add(new THREE.AmbientLight(0x404060));
    scene.add(new THREE.PointLight(0xffddaa, 2, 0, 0));

    // 太阳
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 48, 48),
      new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0xff6600, emissiveIntensity: 1.2 })
    );
    sun.userData = { type: '恒星', name: '太阳', color: 0xffaa33, info: SUN_INFO };
    scene.add(sun);
    const sunLabel = makeLabel('太阳');
    sunLabel.position.set(0, 3.2, 0);
    scene.add(sunLabel);

    // 行星
    const planets = [];
    const clickable = [sun];
    planetData.forEach((p) => {
      const orbitPoints = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        orbitPoints.push(new THREE.Vector3(Math.cos(a) * p.radius, 0, Math.sin(a) * p.radius));
      }
      const orbitLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(orbitPoints),
        new THREE.LineBasicMaterial({ color: 0x4466aa, transparent: true, opacity: 0.35 })
      );
      scene.add(orbitLine);
      const spin = new THREE.Group();
      spin.rotation.z = p.tilt * Math.PI / 180;
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(p.size, 48, 48),
        new THREE.MeshStandardMaterial({ color: p.color })
      );
      body.userData = { type: '行星', name: p.name, color: p.color, info: INFO[p.name] };
      spin.add(body);
      clickable.push(body);
      const label = makeLabel(p.name);
      label.position.set(0, p.size + 0.5, 0);
      spin.add(label);
      let ring = null;
      if (p.name === '土星') {
        ring = new THREE.Mesh(
          new THREE.RingGeometry(p.size * 1.4, p.size * 2.3, 64),
          new THREE.MeshBasicMaterial({ color: 0xcbb887, side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
        );
        ring.rotation.x = Math.PI / 2;
        spin.add(ring);
      }
      const pivot = new THREE.Group();
      pivot.add(spin);
      scene.add(pivot);
      planets.push({ body, spin, pivot, ring, orbitAngle: Math.random() * Math.PI * 2, moonPivots: [], data: p });
    });
    // 地球自转轴
    const earthSpin = planets.find((e) => e.data.name === '地球').spin;
    earthSpin.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -1.0, 0), new THREE.Vector3(0, 1.0, 0)]),
      new THREE.LineBasicMaterial({ color: 0x88aaff })
    ));
    // 卫星
    planets.forEach((e) => {
      for (let i = 0; i < e.data.moons; i++) {
        const moon = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 24, 24),
          new THREE.MeshStandardMaterial({ color: 0xcccccc })
        );
        const moonPivot = new THREE.Group();
        const dist = e.data.size * 1.6 + 0.2;
        const angle = (i / e.data.moons) * Math.PI * 2 + Math.random();
        moon.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
        moonPivot.rotation.y = Math.random() * Math.PI * 2;
        moonPivot.add(moon);
        e.spin.add(moonPivot);
        e.moonPivots.push(moonPivot);
      }
    });

    // 语音 + 卡片 + 点击
    const voice = createVoice(document.getElementById('voiceBtn'));
    const infoCard = createInfoCard(document.body, {
      onShow: (userData) => voice.speak(userData.name + '。' + (userData.info || []).join('，')),
    });
    enablePicking(renderer, camera, { clickable, onPick: (obj) => infoCard.show(obj.userData) });

    // 自动漫游
    const tourBtn = document.getElementById('tourBtn');
    const caption = document.getElementById('caption');
    const tourOrder = [...planets.map((e) => e.data.name), '太阳'];
    let touring = false, tourIndex = 0, tourState = 'flying', tourTimer = 0;
    const tourTarget = new THREE.Vector3();
    function startTour() {
      touring = true; tourIndex = 0; tourState = 'flying'; tourTimer = 0;
      tourBtn.classList.add('active'); tourBtn.textContent = '⏹ 停止漫游'; controls.enabled = false;
    }
    function stopTour() {
      touring = false; tourBtn.classList.remove('active'); tourBtn.textContent = '🚀 自动漫游';
      controls.enabled = true; caption.style.display = 'none';
    }
    tourBtn.addEventListener('click', () => { if (touring) stopTour(); else startTour(); });
    function tourStep(name, dt) {
      const entry = name === '太阳' ? sun : planets.find((p) => p.data.name === name).body;
      if (!entry) { stopTour(); return; }
      entry.updateWorldMatrix(true, false);
      const targetPos = new THREE.Vector3();
      entry.getWorldPosition(targetPos);
      const size = entry.geometry ? entry.geometry.parameters.radius : 2.2;
      const camDist = size * 5 + 3;
      const camPos = targetPos.clone().add(new THREE.Vector3(camDist * 0.7, camDist * 0.5, camDist * 0.7));
      if (tourState === 'flying') {
        camera.position.lerp(camPos, dt * 1.2);
        tourTarget.copy(targetPos);
        camera.lookAt(tourTarget);
        caption.textContent = '飞往：' + name;
        caption.style.display = 'block';
        tourTimer += dt;
        if (tourTimer > 3.5) {
          tourState = 'intro'; tourTimer = 0; caption.textContent = '这是' + name;
          const info = name === '太阳' ? SUN_INFO : planets.find((p) => p.data.name === name).body.userData.info;
          voice.speak(name + '。' + info.join('，'));
        }
      } else if (tourState === 'intro') {
        camera.position.lerp(camPos, dt * 0.5);
        camera.lookAt(tourTarget);
        tourTimer += dt;
        if (tourTimer > 5) {
          tourState = 'flying'; tourTimer = 0; tourIndex++;
          if (tourIndex >= tourOrder.length) {
            stopTour(); camera.position.set(15, 10, 22); camera.lookAt(0, 0, 0);
          }
        }
      }
    }

    // 播放控制
    const clock = new THREE.Clock();
    let isPlaying = true;
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸' : '▶';
      if (touring) controls.enabled = !isPlaying;
      clock.getDelta();
    });
    function animate() {
      const dt = isPlaying ? clock.getDelta() : 0;
      if (isPlaying) {
        planets.forEach((e) => {
          e.orbitAngle += dt * e.data.orbitSpeed * 0.15;
          e.pivot.position.set(Math.cos(e.orbitAngle) * e.data.radius, 0, Math.sin(e.orbitAngle) * e.data.radius);
          e.body.rotation.y += dt * e.data.spinSpeed;
          e.moonPivots.forEach((m, i) => { m.rotation.y += dt * (3.0 + i * 0.5); });
        });
      }
      if (touring && isPlaying) tourStep(tourOrder[tourIndex], dt);
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
