<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恐龙 · 地质年代漫游</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    #info {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(0,0,0,0.55); padding: 10px 18px;
      border-radius: 8px; font-size: 14px; letter-spacing: 1px; pointer-events: none; white-space: nowrap;
    }
    #hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #eee; font-size: 12px; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    #voiceBtn {
      position: absolute; top: 16px; right: 20px; width: 44px; height: 44px;
      border-radius: 50%; border: none; cursor: pointer; font-size: 20px;
      background: rgba(10,15,30,0.85); color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10; transition: transform 0.2s, background 0.2s;
    }
    #voiceBtn:hover { transform: scale(1.1); }
    #voiceBtn.off { opacity: 0.45; }
    #playBtn {
      position: absolute; bottom: 60px; right: 20px; width: 44px; height: 44px;
      border-radius: 50%; border: none; cursor: pointer; font-size: 18px;
      background: rgba(10,15,30,0.85); color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10; transition: transform 0.2s, background 0.2s;
    }
    #playBtn:hover { transform: scale(1.1); }

    /* 时间机器 */
    #timeMachine {
      position: absolute; left: 20px; bottom: 20px; z-index: 10;
      width: 320px; padding: 16px 18px; border-radius: 14px;
      background: rgba(15,22,38,0.88); border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(6px); color: #fff;
    }
    #eraName { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
    #eraYears { font-size: 12px; color: #aab3c5; margin: 4px 0 12px; }
    .bar {
      position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.15); margin: 16px 0;
    }
    #barFill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #6a5cff, #9a5cff, #ff8a5c); transition: width 0.5s; }
    .marks { display: flex; justify-content: space-between; font-size: 10px; color: #9aa3b5; margin-top: 4px; }
    .nav { display: flex; gap: 8px; margin-top: 14px; }
    .nav button {
      flex: 1; padding: 10px 0; border: none; border-radius: 10px; cursor: pointer;
      font-size: 14px; font-weight: 600; letter-spacing: 1px; color: #fff;
      background: linear-gradient(135deg, #6a5cff, #9a5cff); transition: transform 0.15s, opacity 0.2s;
    }
    .nav button:hover { transform: translateY(-2px); }
    .nav button:disabled { opacity: 0.35; cursor: default; transform: none; }
    #autoTour {
      margin-top: 8px; width: 100%; padding: 9px 0; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px; cursor: pointer; font-size: 13px; color: #fff; background: rgba(255,255,255,0.08);
    }
    #autoTour.active { background: linear-gradient(135deg, #ff5c7a, #ff8a5c); border: none; }
  </style>
</head>
<body>
  <div id="info">恐龙 · 地质年代漫游</div>
  <div id="hint">点击恐龙查看介绍 · 用时间机器穿梭地质年代 · 拖拽视角 · 滚轮缩放</div>
  <button id="voiceBtn" title="语音开关">🔊</button>
  <button id="playBtn" title="暂停/继续动画">⏸</button>

  <div id="timeMachine">
    <div id="eraName">三叠纪</div>
    <div id="eraYears">2.5 亿 ~ 2 亿年前</div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="marks"><span>三叠纪</span><span>侏罗纪</span><span>白垩纪</span></div>
    <div class="nav">
      <button id="prevBtn">◀ 上一个纪</button>
      <button id="nextBtn">下一个纪 ▶</button>
    </div>
    <button id="autoTour">🚀 时间漫游</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---- 共享：中文语音播报 ----
    function createVoice(buttonEl) {
      const synth = window.speechSynthesis;
      let enabled = true;
      let zhVoice = null;
      function pickVoice() {
        const voices = synth.getVoices();
        zhVoice = voices.find((v) => /zh/i.test(v.lang)) || null;
      }
      pickVoice();
      synth.addEventListener('voiceschanged', pickVoice);
      function speak(text) {
        if (!enabled || !synth || !text) return;
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-CN'; utter.rate = 0.95; utter.pitch = 1.05;
        if (zhVoice) utter.voice = zhVoice;
        synth.speak(utter);
      }
      function toggle() {
        enabled = !enabled;
        if (buttonEl) buttonEl.classList.toggle('off', !enabled);
        if (!enabled) synth.cancel();
        return enabled;
      }
      if (buttonEl) buttonEl.addEventListener('click', toggle);
      return { speak, toggle, stop: () => synth.cancel(), isEnabled: () => enabled };
    }

    // ---- 共享：科普介绍卡片 ----
    function createInfoCard(container, { onShow } = {}) {
      const card = document.createElement('div');
      card.id = 'infoCard';
      card.style.cssText = `
        position: absolute; right: 20px; top: 70px; width: 300px;
        color: #fff; background: rgba(10,15,30,0.9); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 12px; padding: 18px 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        display: none; z-index: 10; backdrop-filter: blur(6px); font-family: inherit;
      `;
      const close = document.createElement('button');
      close.className = 'close';
      close.textContent = '\u00D7';
      close.style.cssText = `
        position: absolute; top: 10px; right: 12px; cursor: pointer; color: #9aa3b5;
        font-size: 18px; line-height: 1; background: none; border: none;
      `;
      close.addEventListener('mouseenter', () => (close.style.color = '#fff'));
      close.addEventListener('mouseleave', () => (close.style.color = '#9aa3b5'));
      const h3 = document.createElement('h3');
      h3.style.cssText = 'margin: 0 0 10px; font-size: 20px; display: flex; align-items: center; gap: 10px;';
      const dot = document.createElement('span');
      dot.style.cssText = 'width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0;';
      const title = document.createElement('span');
      h3.appendChild(dot); h3.appendChild(title);
      const body = document.createElement('div');
      body.id = 'cardBody';
      card.appendChild(close); card.appendChild(h3); card.appendChild(body);
      container.appendChild(card);
      close.addEventListener('click', () => hide());
      function show(userData) {
        if (!userData || !userData.name) return;
        dot.style.background = '#' + (userData.color || 0xffffff).toString(16).padStart(6, '0');
        title.textContent = userData.name + '（' + (userData.type || '生物') + '）';
        body.innerHTML = (userData.info || []).map((line) => '<p style="margin:6px 0;font-size:13px;line-height:1.7;color:#cfd6e6;">' + line + '</p>').join('');
        card.style.display = 'block';
        if (onShow) onShow(userData);
      }
      function hide() { card.style.display = 'none'; }
      return { element: card, show, hide };
    }

    // ---- 共享：点击拾取 ----
    function enablePicking(renderer, camera, { clickable, onPick }) {
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      renderer.domElement.addEventListener('click', (event) => {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(clickable, false);
        if (hits.length > 0 && onPick) onPick(hits[0].object);
      });
    }

    // ---- 地质年代数据 ----
    const ERAS = [
      {
        id: 'tri', name: '三叠纪', years: '2.5 亿 ~ 2 亿年前',
        sky: 0x9fd8b8, ground: 0x9a8f62, veg: '早期蕨类',
        desc: ['恐龙在三叠纪末期出现', '大陆还是连成一片的盘古大陆', '气候温暖干燥，遍地是蕨类植物', '出现了最早的恐龙和鳄类爬行动物'],
        creatures: ['小型恐龙', '早期爬行动物'],
      },
      {
        id: 'jur', name: '侏罗纪', years: '2 亿 ~ 1.45 亿年前',
        sky: 0x7ec0ef, ground: 0x5c9a54, veg: '裸子植物森林',
        desc: ['恐龙称霸陆地，种类繁多', '出现了巨大的蜥脚类恐龙', '裸子植物（银杏、苏铁）茂密生长', '始祖鸟等早期鸟类开始出现'],
        creatures: ['蜥脚类恐龙', '剑龙'],
      },
      {
        id: 'cre', name: '白垩纪', years: '1.45 亿 ~ 6600 万年前',
        sky: 0x9ecdf0, ground: 0x6b9a4a, veg: '开花植物',
        desc: ['霸王龙等大型肉食恐龙称霸', '出现了三角龙等角龙类', '开花植物开始遍布地球', '6600 万年前一颗小行星撞击地球，恐龙灭绝'],
        creatures: ['霸王龙', '三角龙'],
      },
    ];

    // ---- 场景 ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(ERAS[0].sky);
    scene.fog = new THREE.Fog(ERAS[0].sky, 30, 70);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(8, 4, 12);
    camera.lookAt(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.5, 0);
    controls.maxPolarAngle = Math.PI * 0.52;

    // 灯光
    const hemi = new THREE.HemisphereLight(0xbfdfff, 0x6a8a5a, 0.9);
    scene.add(hemi);
    const sunLight = new THREE.DirectionalLight(0xfff2d9, 1.4);
    sunLight.position.set(8, 14, 8);
    sunLight.castShadow = true;
    scene.add(sunLight);

    const clickable = [];
    const creatureGroup = new THREE.Group();
    scene.add(creatureGroup);
    const plantGroup = new THREE.Group();
    scene.add(plantGroup);

    // 地面
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(26, 48),
      new THREE.MeshLambertMaterial({ color: ERAS[0].ground })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ---- 程序化恐龙 ----
    function mat(color) { return new THREE.MeshLambertMaterial({ color }); }

    // 小型恐龙（三叠纪，双足）
    function buildSmallDino(color) {
      const g = new THREE.Group();
      const m = mat(color);
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.45, 20, 16), m);
      body.scale.set(1.2, 0.9, 0.9);
      body.position.set(0, 0.85, 0.15);
      // 尾
      for (let i = 1; i <= 4; i++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.22 - i * 0.04, 12, 10), m);
        s.position.set(0, 0.75 - i * 0.12, 0.85 + i * 0.35);
        g.add(s);
      }
      // 头颈
      const neck = new THREE.Mesh(new THREE.SphereGeometry(0.28, 14, 12), m);
      neck.position.set(0, 1.15, -0.45);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 12), m);
      head.scale.set(1, 0.85, 1.2);
      head.position.set(0, 1.3, -0.85);
      // 腿
      [-0.25, 0.25].forEach((x) => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.7, 10), m);
        leg.position.set(x, 0.35, 0.2);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.14, 0.5), m);
        foot.position.set(x, 0.07, 0.32);
        g.add(leg); g.add(foot);
      });
      g.add(body, neck, head);
      return g;
    }

    // 蜥脚类恐龙（侏罗纪，长颈四足）
    function buildSauropod(color) {
      const g = new THREE.Group();
      const m = mat(color);
      const body = new THREE.Mesh(new THREE.SphereGeometry(1.0, 24, 18), m);
      body.scale.set(1.3, 1, 1.6);
      body.position.set(0, 1.3, 0.1);
      // 长尾
      for (let i = 1; i <= 6; i++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.5 - i * 0.07, 12, 10), m);
        s.position.set(0, 1.0 - i * 0.08, 1.6 + i * 0.5);
        g.add(s);
      }
      // 长颈
      const neckCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 1.6, -0.8), new THREE.Vector3(0, 2.4, -1.4),
        new THREE.Vector3(0, 3.0, -1.6), new THREE.Vector3(0, 3.3, -1.5),
      ]);
      const neck = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 20, 0.35, 12, false), m);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 12), m);
      head.scale.set(1, 0.8, 1.3);
      head.position.set(0, 3.4, -1.5);
      // 四腿
      [[-0.6, -0.4], [0.6, -0.4], [-0.5, 0.6], [0.5, 0.6]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 1.2, 12), m);
        leg.position.set(x, 0.6, z);
        g.add(leg);
      });
      g.add(body, neck, head);
      return g;
    }

    // 霸王龙（白垩纪）
    function buildTrex(color) {
      const g = new THREE.Group();
      const m = mat(color);
      const torso = new THREE.Mesh(new THREE.SphereGeometry(0.95, 24, 20), m);
      torso.scale.set(1.2, 1, 1.1);
      torso.position.set(0, 1.8, 0.2);
      // 尾
      for (let i = 1; i <= 5; i++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.55 - i * 0.09, 14, 12), m);
        s.position.set(0, 1.5 - i * 0.12, 1.3 + i * 0.45);
        g.add(s);
      }
      // 头
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 20, 16), m);
      head.scale.set(1, 0.9, 1.3);
      head.position.set(0, 2.7, -1.1);
      const snout = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.7, 12), m);
      snout.rotation.x = Math.PI / 2;
      snout.position.set(0, 2.62, -1.7);
      // 眼睛
      const eyeMat = mat(0xffffff);
      [-0.22, 0.22].forEach((x) => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), eyeMat);
        eye.position.set(x, 2.82, -1.25);
        g.add(eye);
      });
      // 强壮后腿
      [-0.4, 0.4].forEach((x) => {
        const thigh = new THREE.Mesh(new THREE.SphereGeometry(0.45, 14, 12), m);
        thigh.position.set(x, 0.95, 0.3);
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 0.8, 12), m);
        leg.position.set(x, 0.35, 0.3);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.18, 0.8), m);
        foot.position.set(x, 0.09, 0.4);
        g.add(thigh, leg, foot);
      });
      // 小手
      [-0.5, 0.5].forEach((x) => {
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 0.4, 8), m);
        arm.position.set(x, 2.15, 0.55);
        g.add(arm);
      });
      g.add(torso, head, snout);
      return g;
    }

    // 三角龙（白垩纪）
    function buildTriceratops(color) {
      const g = new THREE.Group();
      const m = mat(color);
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.9, 22, 18), m);
      body.scale.set(1.2, 0.95, 1.4);
      body.position.set(0, 1.1, 0.2);
      // 尾
      for (let i = 1; i <= 4; i++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.4 - i * 0.07, 12, 10), m);
        s.position.set(0, 0.95 - i * 0.1, 1.5 + i * 0.4);
        g.add(s);
      }
      // 头 + 颈盾
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 20, 16), m);
      head.scale.set(1, 0.85, 1.2);
      head.position.set(0, 1.55, -1.1);
      const frill = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 16), m);
      frill.scale.set(1.4, 0.9, 0.3);
      frill.position.set(0, 1.8, -0.75);
      // 角
      const hornMat = mat(0xe8d9b0);
      [0, -0.32, 0.32].forEach((x, i) => {
        const len = i === 0 ? 0.5 : 0.35;
        const horn = new THREE.Mesh(new THREE.ConeGeometry(0.08, len, 10), hornMat);
        horn.position.set(x, 1.95, -1.35);
        horn.rotation.x = i === 0 ? Math.PI : Math.PI;
        horn.rotation.z = x;
        g.add(horn);
      });
      // 四腿
      [[-0.55, -0.4], [0.55, -0.4], [-0.5, 0.5], [0.5, 0.5]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 1.0, 12), m);
        leg.position.set(x, 0.5, z);
        g.add(leg);
      });
      g.add(body, head, frill);
      return g;
    }

    // ---- 植物（随年代变化）----
    function buildTree(kind, x, z, s) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18 * s, 0.28 * s, 1.4 * s, 8),
        mat(0x7a5230)
      );
      trunk.position.y = 0.7 * s;
      g.add(trunk);
      if (kind === 'conifer') {
        const crown = new THREE.Mesh(new THREE.ConeGeometry(0.9 * s, 1.6 * s, 10), mat(0x3f7d3a));
        crown.position.y = 1.9 * s;
        g.add(crown);
      } else {
        const crown = new THREE.Mesh(new THREE.SphereGeometry(0.7 * s, 12, 10), mat(0x4a8a3a));
        crown.position.y = 1.9 * s;
        g.add(crown);
      }
      g.position.set(x, 0, z);
      return g;
    }

    function buildFerns(x, z, s) {
      const g = new THREE.Group();
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06 * s, 0.08 * s, 0.8 * s, 6), mat(0x6a8a3a));
      stem.position.y = 0.4 * s;
      g.add(stem);
      for (let i = -1; i <= 1; i += 2) {
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.4 * s, 0.6 * s, 8), mat(0x5c9a4a));
        leaf.position.set(i * 0.3 * s, 0.7 * s, 0);
        leaf.rotation.z = i * 0.8;
        g.add(leaf);
      }
      g.position.set(x, 0, z);
      return g;
    }

    // 每个年代的植物布局
    function buildPlants(eraIndex) {
      plantGroup.clear();
      const r = () => (Math.random() - 0.5) * 2;
      if (eraIndex === 0) {
        // 三叠纪：低矮蕨类
        for (let i = 0; i < 14; i++) plantGroup.add(buildFerns(r() * 10, r() * 10 - 2, 0.8 + Math.random() * 0.6));
      } else if (eraIndex === 1) {
        // 侏罗纪：高大裸子植物
        for (let i = 0; i < 10; i++) plantGroup.add(buildTree('conifer', r() * 11, r() * 11 - 2, 1.2 + Math.random() * 0.8));
        for (let i = 0; i < 6; i++) plantGroup.add(buildFerns(r() * 10, r() * 10 - 2, 1 + Math.random() * 0.5));
      } else {
        // 白垩纪：开花植物 + 阔叶树
        for (let i = 0; i < 9; i++) plantGroup.add(buildTree('leaf', r() * 11, r() * 11 - 2, 1 + Math.random() * 0.7));
        for (let i = 0; i < 8; i++) {
          const f = buildFerns(r() * 10, r() * 10 - 2, 0.9 + Math.random() * 0.5);
          plantGroup.add(f);
        }
      }
    }

    // ---- 年代切换 ----
    let eraIndex = 0;
    const eraName = document.getElementById('eraName');
    const eraYears = document.getElementById('eraYears');
    const barFill = document.getElementById('barFill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function showEra(idx, animate) {
      eraIndex = idx;
      const era = ERAS[idx];
      eraName.textContent = era.name;
      eraYears.textContent = era.years;
      barFill.style.width = ((idx + 1) / ERAS.length * 100) + '%';
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === ERAS.length - 1;

      // 场景氛围
      scene.background = new THREE.Color(era.sky);
      scene.fog = new THREE.Fog(era.sky, 30, 70);
      ground.material.color.setHex(era.ground);

      // 重建恐龙与植物
      creatureGroup.clear();
      clickable.length = 0;
      plantGroup.clear();
      buildPlants(idx);

      let spots = [[-2.5, 0], [2.5, 0]];
      if (idx === 0) {
        const d = buildSmallDino(0xd97b3a);
        d.position.set(spots[0][0], 0, spots[0][1]);
        d.rotation.y = Math.PI * 0.3;
        d.userData = { name: '始盗龙', type: '三叠纪·小型恐龙', color: 0xd97b3a, info: ['体型很小，只有狗那么大', '善于奔跑，行动敏捷', '是最早的恐龙之一', '杂食性，什么都吃'] };
        creatureGroup.add(d); clickable.push(d);
        const d2 = buildSmallDino(0x8a9a6a);
        d2.position.set(spots[1][0], 0, spots[1][1]);
        d2.rotation.y = -Math.PI * 0.4;
        d2.userData = { name: '早期爬行动物', type: '三叠纪·爬行动物', color: 0x8a9a6a, info: ['在恐龙出现前就生活在地球上', '像蜥蜴一样匍匐爬行', '是恐龙和鸟类的远亲'] };
        creatureGroup.add(d2); clickable.push(d2);
      } else if (idx === 1) {
        const s = buildSauropod(0x7a6a5a);
        s.position.set(spots[0][0], 0, spots[0][1]);
        s.rotation.y = Math.PI * 0.5;
        s.userData = { name: '梁龙', type: '侏罗纪·蜥脚类', color: 0x7a6a5a, info: ['脖子和尾巴都很长', '体型巨大，像一架飞机', '是草食性恐龙', '每天要吃很多植物'] };
        creatureGroup.add(s); clickable.push(s);
      } else {
        const t = buildTrex(0x5c8a3a);
        t.position.set(spots[0][0], 0, spots[0][1]);
        t.rotation.y = Math.PI * 0.3;
        t.userData = { name: '霸王龙', type: '白垩纪·肉食恐龙', color: 0x5c8a3a, info: ['体型庞大的肉食恐龙', '嘴巴很大，牙齿锋利', '前肢却非常短小', '是恐龙时代最著名的猎手'] };
        creatureGroup.add(t); clickable.push(t);
        const tr = buildTriceratops(0x9a8a6a);
        tr.position.set(spots[1][0], 0, spots[1][1]);
        tr.rotation.y = -Math.PI * 0.4;
        tr.userData = { name: '三角龙', type: '白垩纪·角龙类', color: 0x9a8a6a, info: ['头上长着三只角', '脖子周围有骨质的颈盾', '是草食性恐龙', '用角和颈盾保护自己'] };
        creatureGroup.add(tr); clickable.push(tr);
      }
    }

    prevBtn.addEventListener('click', () => { if (eraIndex > 0) showEra(eraIndex - 1); });
    nextBtn.addEventListener('click', () => { if (eraIndex < ERAS.length - 1) showEra(eraIndex + 1); });

    // ---- 自动时间漫游 ----
    const autoTourBtn = document.getElementById('autoTour');
    let touring = false;
    let tourTimer = 0;
    autoTourBtn.addEventListener('click', () => {
      touring = !touring;
      autoTourBtn.classList.toggle('active', touring);
      autoTourBtn.textContent = touring ? '⏹ 停止漫游' : '🚀 时间漫游';
    });

    // ---- 语音 + 卡片 + 点击 ----
    const voice = createVoice(document.getElementById('voiceBtn'));
    const infoCard = createInfoCard(document.body, {
      onShow: (userData) => voice.speak(userData.name + '。' + (userData.info || []).join('，')),
    });
    enablePicking(renderer, camera, { clickable, onPick: (obj) => infoCard.show(obj.userData) });

    // ---- 动画 ----
    showEra(0);
    const clock = new THREE.Clock();
    let isPlaying = true;
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸' : '▶';
      clock.getDelta();
    });

    function animate() {
      const dt = isPlaying ? clock.getDelta() : 0;
      if (isPlaying) {
        // 生物轻微摆动（呼吸感）
        creatureGroup.children.forEach((c, i) => {
          c.rotation.z = Math.sin(performance.now() / 900 + i) * 0.02;
        });
        // 自动漫游：每隔几秒切换年代
        if (touring) {
          tourTimer += dt;
          if (tourTimer > 4.5) {
            tourTimer = 0;
            showEra((eraIndex + 1) % ERAS.length);
          }
        }
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
