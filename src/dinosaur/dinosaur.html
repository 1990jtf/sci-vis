  {

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    






    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 讲解文案（卡片 / 语音共用一份） --------- */
    // 优先用 info.say（写给"耳朵"的口语讲解），没有时用结构化字段拼一句
    function narrate(info) {
      if (!info) return '';
      if (info.say) return info.say;
      const parts = [info.name + '。'];
      if (info.type) parts.push(info.type + '。');
      if (info.stats && info.stats.length) {
        parts.push(info.stats.map((s) => s.label + '，' + s.value).join('。') + '。');
      }
      if (info.desc && info.desc.length) parts.push(info.desc.join('。'));
      return parts.join('').replace(/。{2,}/g, '。');
    }
    
    /* ---------------- 语音（神经语音包优先，浏览器语音兜底） ---------------- */
    /**
     * 两级语音方案：
     *   1) 预生成的神经语音包（edge-tts 晓晓 / 云希等）—— 音质接近真人，
     *      文件命名 v_<id>.mp3，放在 audioBase 目录下，离线可用、无密钥。
     *   2) 浏览器 speechSynthesis —— 语音包里没有这句时兜底，并做了音色排序
     *      （优先云端自然音 / 增强音色）与按句切分，比直接取第一个中文音色自然得多。
     *
     * 用法：const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
     *       voice.speak(S.narrate(data), data.voiceId);
     */
    function createVoice(opts) {
      opts = opts || {};
      const audioBase = opts.audioBase || null;   // 语音包目录，留空则纯浏览器语音
      const synth = window.speechSynthesis || null;
      let enabled = true;
      let zhVoice = null;
      let audioEl = null;
      let seq = 0;                                 // 打断计数：切天体时丢弃旧队列
      const missing = Object.create(null);         // 语音包里不存在的 id，只探测一次
    
      /* --- 音色挑选：给候选中文音色打分，取最自然的一个 --- */
      function score(v) {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        let s = 0;
        if (/xiaoxiao|xiaoyi|yunxi|yunjian|晓晓|云希|云扬/.test(name)) s += 60;
        if (/natural|neural|premium|enhanced|自然/.test(name)) s += 40;
        if (/google/.test(name)) s += 32;                 // Chrome 云端音，韵律较自然
        if (/ting-?ting|tingting|meijia|sinji|婷婷|美佳|善怡|美嘉/.test(name)) s += 24;
        if (/^zh[-_]?cn|cmn|^zh$/.test(lang)) s += 18;
        if (/^zh[-_]?(hk|tw)|yue/.test(lang)) s -= 14;    // 粤语 / 台湾腔，普通话场景降权
        if (v.localService) s += 6;                       // 本地音：断网也能用
        return s;
      }
      function pick() {
        if (!synth || !synth.getVoices) return;
        const all = synth.getVoices() || [];
        const zh = all.filter((v) => /^zh|cmn|yue/i.test(v.lang || ''));
        if (!zh.length) return;
        zhVoice = zh.slice().sort((a, b) => score(b) - score(a))[0] || null;
      }
      if (synth) {
        pick();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', pick);
      }
    
      /* --- 兜底：浏览器语音，按句切开逐句念，停顿更自然 --- */
      function chunk(text) {
        const parts = String(text).replace(/\s+/g, '').match(/[^。！？；!?]+[。！？；!?]?/g) || [];
        const out = [];
        let buf = '';
        parts.forEach((p) => {
          if (buf && (buf + p).length > 46) { out.push(buf); buf = p; }
          else buf += p;
        });
        if (buf) out.push(buf);
        return out.length ? out : [String(text)];
      }
      function speakTTS(text) {
        if (!synth || !text) return;
        const mySeq = ++seq;
        const chunks = chunk(text);
        let i = 0;
        const next = () => {
          if (!enabled || mySeq !== seq || i >= chunks.length) return;
          const u = new SpeechSynthesisUtterance(chunks[i++]);
          u.lang = 'zh-CN';
          u.rate = 0.98;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (!zhVoice) pick();
          if (zhVoice) u.voice = zhVoice;
          u.onend = () => setTimeout(next, 90);
          u.onerror = () => {};
          synth.speak(u);
        };
        // Chrome 在 cancel() 之后立刻 speak() 偶发静音，等一小会儿再开口
        setTimeout(next, 60);
      }
    
      /* --- 首选：播放语音包 --- */
      function playPack(id, text) {
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.preload = 'auto';
        }
        const el = audioEl;
        let done = false;
        const fallback = () => {
          if (done) return;
          done = true;
          missing[id] = true;
          speakTTS(text);
        };
        el.onerror = fallback;
        el.onplaying = () => { el.onerror = null; };
        el.src = audioBase + 'v_' + id + '.mp3';
        const p = el.play();
        if (p && p.catch) p.catch(fallback);
      }
    
      function speak(text, id) {
        if (!enabled || !text) return;
        if (id && audioBase && !missing[id]) {
          seq++;                      // 打断上一句（浏览器语音队列）
          if (synth) synth.cancel();
          playPack(id, text);
          return;
        }
        if (audioEl) audioEl.pause();
        if (synth) synth.cancel();
        speakTTS(text);
      }
      function stop() {
        seq++;
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        if (synth) synth.cancel();
      }
      function toggle() {
        enabled = !enabled;
        if (!enabled) stop();
        return enabled;
      }
      return { speak, stop, toggle, isEnabled: () => enabled, hasPack: !!audioBase };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      // 页面里已有 .sv-card 容器时直接复用，避免套娃出两层透明卡片
      const host = container && container.nodeType === 1 ? container : document.body;
      let el;
      if (host.classList && host.classList.contains('sv-card')) {
        el = host;
      } else {
        el = document.createElement('div');
        el.className = 'sv-card';
        host.appendChild(el);
      }
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            // 兼容两种写法：[label, value] 数组 或 { label, value } 对象
            const label = Array.isArray(s) ? s[0] : s.label;
            const value = Array.isArray(s) ? s[1] : s.value;
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span></span><b></b>';
            row.querySelector('span').textContent = label == null ? '' : label;
            row.querySelector('b').textContent = value == null ? '' : value;
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        if (data.facts && data.facts.length) {
          data.facts.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__fact';
            row.innerHTML = '<i>\uD83D\uDCA1</i><span></span>';
            row.querySelector('span').textContent = line;
            body.appendChild(row);
          });
        }
        el.classList.add('is-open');
      }
      function hide() { el.classList.remove('is-open'); }
      close.addEventListener('click', hide);
      return { element: el, show, hide };
    }
    
    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      // targets 可以是数组，也可以是返回数组的函数（换场景后数组会被整体替换）
      const resolve = (targets) => (typeof targets === 'function' ? targets() : targets) || [];
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const list = resolve(targets);
        const hits = raycaster.intersectObjects(list, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;

          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;

      tex.colorSpace = THREE.SRGBColorSpace;

      const idx = Math.min(Math.floor(t / seg), bands.length - 2);

      return bands[idx].clone().lerp(bands[idx + 1], local);

      for (let y = 0; y < size; y++) {

          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;

      ctx.putImageData(img, 0, 0);

    /* ---- 事件旁白 ---- */
    const LINES = {
      impact: {
        id: 'impact', name: '小行星撞击',
        say: '六千六百万年前，一颗直径大约十公里的小行星撞上了地球。撞击掀起的灰尘遮住了太阳，植物枯萎，食物链从最底部开始崩塌。包括所有非鸟恐龙在内，大约四分之三的物种消失了。恐龙的时代结束了。不过今天窗外的鸟，就是恐龙留下的后代。',
      },
    };
    /* @voice-data-end */


    /* ================= 场景 ================= */
    const scene = new THREE.Scene();
    const camera = S.createCamera(48, 0.1, 500);

    const { renderer, composer, renderPass } = S.createRenderer({

    renderPass.camera = camera;

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);

    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';

    const controls = S.createControls(camera, renderer.domElement, new THREE.Vector3(0, 2, 0));

    // 灯光
    const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x6a8a5a, 0.9);

    /* ================= 天空穹顶 ================= */
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: {
        topColor: { value: new THREE.Color(ERAS[0].skyTop) },
        bottomColor: { value: new THREE.Color(ERAS[0].skyBottom) },
        sunDir: { value: new THREE.Vector3(0.5, 0.6, 0.4).normalize() },
      },
      vertexShader: `varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec3 vDir; uniform vec3 topColor, bottomColor, sunDir;
        void main(){
          float h = clamp(vDir.y, 0.0, 1.0);
          vec3 col = mix(bottomColor, topColor, pow(h, 0.55));
          col += vec3(1.0,0.9,0.7) * pow(max(dot(vDir,sunDir),0.0), 30.0) * 0.6;
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 32, 20), skyMat));
    scene.fog = new THREE.Fog(ERAS[0].fog, 30, 110);

    /* ================= 地面（噪声起伏 + 顶点色） ================= */
    const ground = new THREE.Group();
    scene.add(ground);
    function buildGround(groundColor) {
      ground.clear();
      const geo = new THREE.CircleGeometry(60, 64, 40, 40);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const base = new THREE.Color(groundColor);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const n = S.fbm2(x * 0.15 + 3, z * 0.15 - 2, 4);
        pos.setY(i, (n - 0.5) * 1.2);
        const shade = 0.85 + n * 0.3;
        colors[i * 3] = base.r * shade;
        colors[i * 3 + 1] = base.g * shade;
        colors[i * 3 + 2] = base.b * shade;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
      mesh.receiveShadow = true;
      ground.add(mesh);
    }
    buildGround(ERAS[0].ground);

    /* ================= 恐龙模型（CC0 · Gobkit Free Dinosaur Pack） =================
       真实骨骼蒙皮模型 + 烘焙动画（idle / walk / attack / dead）。
       注意：模型朝 +Z；复制蒙皮实例必须用 SkeletonUtils.clone，普通 clone 会丢绑定。 */
    const MODEL_DIR = 'models/';
    const MODEL_FILES = {
      Trex: 'Trex.glb',
      Triceratops: 'Triceratops.glb',
      Ankylosaurus: 'Ankylosaurus.glb',
      Stegosaurus: 'Stegosaurus.glb',
      Carnotaurus: 'Carnotaurus.glb',
      Pterodactylus: 'Pterodactylus.glb',
    };
    const modelCache = {};
    let modelsReady = false;
    let modelsLoading = 0;

    const gltfLoader = new GLTFLoader();
    function loadModels(done) {
      const keys = Object.keys(MODEL_FILES);
      modelsLoading = keys.length;
      keys.forEach((k) => {
        gltfLoader.load(MODEL_DIR + MODEL_FILES[k], (g) => {
          modelCache[k] = g;
          if (--modelsLoading === 0) { modelsReady = true; done && done(); }
        }, undefined, (e) => {
          console.warn('模型加载失败：' + k, e);
          if (--modelsLoading === 0) { modelsReady = true; done && done(); }
        });
      });
    }

    const creatures = [];

    function spawnDino(name, opts) {
      const info = SPECIES[name];
      const src = modelCache[info.model];
      if (!src) return null;

      const root = SkeletonUtils.clone(src.scene);

      // 归一化：这些模型共享骨架、顶点极小，用几何网格的世界包围盒测量才准确
      function measureWorldBox(obj) {
        const b = new THREE.Box3();
        obj.updateWorldMatrix(true, true);
        obj.traverse((o) => {
          if (!o.isMesh) return;
          if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
          b.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
        });
        return b;
      }

      root.position.set(0, 0, 0);
      root.rotation.set(0, 0, 0);
      root.scale.setScalar(1);
      const raw = measureWorldBox(root);
      const rawSize = raw.getSize(new THREE.Vector3());
      const sc = info.height / Math.max(rawSize.y, 0.0001);
      root.scale.setScalar(sc);
      const scaled = measureWorldBox(root);
      root.position.set(opts.x, -scaled.min.y, opts.z);
      root.rotation.y = opts.rotY || 0;

      root.traverse((o) => {
        if (!o.isMesh) return;
        o.castShadow = true;
        o.receiveShadow = true;
        o.frustumCulled = false; // 蒙皮包围球可能失准，避免整体被裁掉
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach((m) => {
          if (!m) return;
          m.metalness = 0;
          m.roughness = 0.88;
          if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        });
      });

      // 动画：按名字取 clip
      const mixer = new THREE.AnimationMixer(root);
      const actions = {};
      ['idle', 'walk', 'attack', 'dead'].forEach((n) => {
        const clip = THREE.AnimationClip.findByName(src.animations, n);
        if (clip) actions[n] = mixer.clipAction(clip);
      });
      if (actions.idle) actions.idle.play();
      if (actions.walk) actions.walk.play().setEffectiveWeight(0);

      // 标签
      const div = document.createElement('div');
      div.className = 'sv-label';
      div.textContent = name;
      // 小恐龙只有十几像素高，点名字比点身体容易得多
      div.style.pointerEvents = 'auto';
      div.style.cursor = 'pointer';
      div.addEventListener('click', (e) => { e.stopPropagation(); focusCreature(root); });
      const label = new CSS2DObject(div);
      label.position.set(0, info.height + 0.45, 0);
      root.add(label);

      root.userData = { name, ...info, kind: 'creature' };
      creatureGroup.add(root);
      clickable.push(root);

      const item = {
        root, mixer, actions, name, info,
        flying: !!opts.flying,
        flyingY: opts.flyingY || 0,
        walkRadius: opts.walkRadius || 0,
        walkSpeed: opts.walkSpeed || 0.2,
        phase: opts.phase != null ? opts.phase : Math.random() * Math.PI * 2,
        center: new THREE.Vector3(opts.x, opts.flyingY || 0, opts.z),
        moving: !!opts.walkRadius,
      };
      creatures.push(item);
      return item;
    }

    // 一次性播放（attack / dead），结束后回到 idle
    function playOnce(item, actionName, stay) {
      const act = item.actions[actionName];
      const idle = item.actions.idle;
      if (!act) return;
      act.reset();
      act.setLoop(THREE.LoopOnce, 1);
      act.clampWhenFinished = true;
      act.setEffectiveWeight(1).fadeIn(0.15).play();
      if (idle) idle.fadeOut(0.15);
      clearTimeout(item._resetT);
      item._resetT = setTimeout(() => {
        if (stay) return;
        act.fadeOut(0.3);
        if (idle) idle.reset().fadeIn(0.3).play();
      }, Math.max((act.getClip().duration - 0.2) * 1000, 400));
    }

    /* ================= 植物 ================= */
    const matOf = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0.02 });
    function shadowify(g) { g.traverse((o) => { if (o.isMesh) { o.castShadow = true; } }); }
    function makeTree(kind, s) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.28 * s, 1.4 * s, 8), matOf(0x7a5230));
      trunk.position.y = 0.7 * s;
      g.add(trunk);
      if (kind === 'conifer') {
        for (let i = 0; i < 3; i++) {
          const r = (0.9 - i * 0.22) * s;
          const cone = new THREE.Mesh(new THREE.ConeGeometry(r, 0.9 * s, 10), matOf(0x2f6b30));
          cone.position.y = (1.5 + i * 0.55) * s;
          g.add(cone);
        }
      } else {
        const crown = new THREE.Mesh(new THREE.SphereGeometry(0.8 * s, 12, 10), matOf(0x4a8a3a));
        crown.position.y = 1.9 * s;
        g.add(crown);
      }
      shadowify(g);
      return g;
    }
    function makeFern(s) {
      const g = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.09 * s, 0.7 * s, 6), matOf(0x5c9a4a));
        const a = (i / 5) * Math.PI * 2;
        leaf.position.set(Math.cos(a) * 0.18 * s, 0.3 * s, Math.sin(a) * 0.18 * s);
        leaf.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5);
        g.add(leaf);
      }
      shadowify(g);
      return g;
    }

    /* ================= 生物管理 ================= */
    const creatureGroup = new THREE.Group();
    scene.add(creatureGroup);
    const plantGroup = new THREE.Group();
    scene.add(plantGroup);
    let clickable = [];

    // scatter：minR 之外随机分布；avoidCam=true 时排除镜头近前方扇区
    function scatter(group, builder, count, radius, minR, avoidCam) {
      minR = minR || 4;
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = minR + Math.random() * (radius - minR);
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        // 避开相机与恐龙之间（z 轴正方向为镜头侧）
        if (avoidCam && z > 3) continue;
        const obj = builder(0.7 + Math.random() * 0.7);
        obj.position.set(x, 0, z);
        obj.rotation.y = Math.random() * Math.PI * 2;
        group.add(obj);
      }
    }

    function buildCreatures(eraIdx) {
      // CSS2DRenderer 的 DOM 标签不会随 object 移除而消失，需手动清理
      creatureGroup.traverse((o) => { if (o.element && o.element.remove) o.element.remove(); });
      creatureGroup.clear();
      plantGroup.clear();
      clickable = [];
      creatures.length = 0;
      if (!modelsReady) return;

      if (eraIdx === 0) {
        // 三叠纪：早期翼龙在头顶盘旋 + 地面腔骨龙（模型的骨架是兽脚类，按腔骨龙尺寸缩小）
        spawnDino('真双型齿翼龙', { x: -3, z: -3, height: 0.75, rotY: 0, flying: true, flyingY: 5.6, walkRadius: 3.0, walkSpeed: 0.35 });
        spawnDino('真双型齿翼龙', { x: 3, z: -5, height: 0.65, rotY: 0, flying: true, flyingY: 6.8, walkRadius: 3.6, walkSpeed: -0.28, phase: 2 });
        spawnDino('腔骨龙', { x: -0.8, z: 0.8, rotY: Math.PI * 0.2, height: 1.15, walkRadius: 1.4, walkSpeed: 0.16 });
        spawnDino('腔骨龙', { x: 1.9, z: 1.6, rotY: Math.PI * 1.1, height: 0.9, walkRadius: 1.1, walkSpeed: -0.22, phase: 1.2 });
        scatter(plantGroup, (s) => makeFern(s), 30, 15);
        // 三叠纪的“树”只有早期针叶树和木贼，没有阔叶林
        scatter(plantGroup, (s) => makeTree('conifer', s * 0.55), 6, 15, 11, true);
      } else if (eraIdx === 1) {

        spawnDino('剑龙', { x: -1.6, z: 0.2, rotY: Math.PI * 0.22, walkRadius: 1.6, walkSpeed: 0.14 });
        spawnDino('剑龙', { x: 2.8, z: -2.2, rotY: Math.PI * 0.45, height: 1.9, walkRadius: 0, phase: 1 });
        spawnDino('剑龙', { x: 0.4, z: -3.4, rotY: Math.PI * 0.8, height: 1.3, walkRadius: 1.3, walkSpeed: 0.2, phase: 2.4 });
        spawnDino('翼龙', { x: -4, z: -4, rotY: 0, flying: true, flyingY: 6.4, walkRadius: 3.4, walkSpeed: 0.3, phase: 0.8 });
        scatter(plantGroup, (s) => makeTree('conifer', s), 8, 13, 9, true);
        scatter(plantGroup, (s) => makeFern(s), 18, 12);
      } else {
        // 白垩纪：霸王龙 / 三角龙 / 甲龙 / 食肉牛龙
        spawnDino('霸王龙', { x: -2.8, z: 0.8, rotY: Math.PI * 0.18, walkRadius: 1.5, walkSpeed: 0.12 });
        spawnDino('三角龙', { x: 1.6, z: -1.4, rotY: Math.PI * 0.12, walkRadius: 0 });
        spawnDino('三角龙', { x: 3.4, z: 0.9, rotY: Math.PI * 0.62, height: 1.9, walkRadius: 0, phase: 1.4 });
        spawnDino('甲龙', { x: 0.2, z: 2.4, rotY: Math.PI * 0.32, walkRadius: 0 });
        spawnDino('食肉牛龙', { x: 4.4, z: -3.2, rotY: Math.PI * 0.9, walkRadius: 1.2, walkSpeed: 0.24, phase: 0.6 });
        scatter(plantGroup, (s) => makeTree('leaf', s), 6, 13, 9, true);
        scatter(plantGroup, (s) => makeFern(s), 18, 12);
      }
    }

    /* ================= 年代切换 ================= */
    let eraIdx = 0;
    let isAsteroid = false;
    const eraName = document.getElementById('eraName');
    const eraYears = document.getElementById('eraYears');
    const eraTagline = document.getElementById('eraTagline');
    const barFill = document.getElementById('barFill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const veil = document.getElementById('veil');
    const voice = S.createVoice({ audioBase: '../audio/dinosaur/' });
    S.bindVoiceButton(document.getElementById('voiceBtn'), voice);
    const card = S.createCard(document.getElementById('card') || document.body);
    const picker = S.makePicker(camera, renderer.domElement);
    const fly = S.makeFly(camera, controls);

    function showEra(idx, announce) {
      eraIdx = idx;
      const era = ERAS[idx];
      eraName.textContent = era.name;
      eraYears.textContent = era.years;
      eraTagline.textContent = era.tagline;
      barFill.style.width = ((idx + 1) / ERAS.length * 100) + '%';
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === ERAS.length - 1;

      skyMat.uniforms.topColor.value.setHex(era.skyTop);
      skyMat.uniforms.bottomColor.value.setHex(era.skyBottom);
      scene.fog.color.setHex(era.fog);
      buildGround(era.ground);
      buildCreatures(idx);
      document.getElementById('asteroidBtn').style.display = idx === 2 ? 'flex' : 'none';
      if (announce) announceEra(idx);
    }

    // 讲一遍这一纪：卡片 + 语音（语音包优先，没有就走浏览器语音）
    function announceEra(idx) {
      const era = ERAS[idx];
      card.show({
        name: era.name, type: era.years, color: era.accent,
        stats: era.stats, desc: era.desc, facts: era.facts,
      });
      voice.speak(era.say, era.id);
    }

    function switchEra(idx) {
      veil.classList.add('is-on');
      setTimeout(() => {
        showEra(idx, true);
        camera.position.set(9, 4.8, 14);
        controls.target.set(0, 1.8, 0);
        veil.classList.remove('is-on');
        S.toast('欢迎来到' + ERAS[idx].name + ' · ' + ERAS[idx].years);
      }, 480);
    }
    prevBtn.addEventListener('click', () => { if (eraIdx > 0) switchEra(eraIdx - 1); });
    nextBtn.addEventListener('click', () => { if (eraIdx < ERAS.length - 1) switchEra(eraIdx + 1); });
    document.getElementById('replayBtn').addEventListener('click', () => announceEra(eraIdx));

    /* ================= 小行星事件 ================= */
    const asteroidBtn = document.getElementById('asteroidBtn');
    asteroidBtn.addEventListener('click', () => {
      if (eraIdx !== 2 || isAsteroid) return;
      isAsteroid = true;
      S.toast('☄️ 小行星撞击！恐龙的时代结束了…', 3600);
      voice.speak(LINES.impact.say, LINES.impact.id);
      // 火球
      const meteor = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 20, 20),
        new THREE.MeshBasicMaterial({ color: 0xffaa33 })
      );
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: S.glowTexture('rgba(255,220,140,1)', 'rgba(255,120,40,0.6)'),
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      glow.scale.set(6, 6, 1);
      meteor.add(glow);
      scene.add(meteor);
      const start = new THREE.Vector3(18, 40, -20);
      const end = new THREE.Vector3(0, 0.5, 0);
      meteor.position.copy(start);
      const t0 = performance.now();
      function flyMeteor() {
        const k = Math.min((performance.now() - t0) / 1400, 1);
        meteor.position.lerpVectors(start, end, k);
        if (k < 1) requestAnimationFrame(flyMeteor);
        else {
          scene.remove(meteor);
          // 撞击闪光
          const flash = new THREE.PointLight(0xffcc66, 30, 60);
          flash.position.copy(end).add(new THREE.Vector3(0, 2, 0));
          scene.add(flash);
          setTimeout(() => {
            // 天空变暗（撞击尘埃）
            skyMat.uniforms.topColor.value.setHex(0x2a2438);
            skyMat.uniforms.bottomColor.value.setHex(0x5a4a3a);
            scene.fog.color.setHex(0x4a3a30);
            hemi.intensity = 0.3;
            sunLight.intensity = 0.5;
            asteroidBtn.textContent = '🌑 灭绝时刻';
            // 恐龙应声倒下
            creatures.forEach((c, i) => {
              c.moving = false;
              setTimeout(() => playOnce(c, 'dead', true), i * 220);
            });
          }, 500);
        }
      }
      flyMeteor();
    });

    /* ================= 拾取 ================= */
    // 选中一只恐龙：弹卡片 + 讲解 + 镜头飞过去（点身体或点名字都走这里）
    function focusCreature(obj) {
      // 点击子网格时向上找到带 creature 标记的祖先
      let o = obj;
      while (o && !(o.userData && o.userData.kind === 'creature')) o = o.parent;
      if (!o) return;
      const d = o.userData;
      const item = creatures.find((c) => c.root === o);
      if (item) playOnce(item, 'attack');   // 被点到的恐龙做一次攻击动作
      card.show({ name: d.name, type: d.type, color: d.color, stats: d.stats, desc: d.desc, facts: d.facts });
      voice.speak(d.say || (d.name + '。' + (d.desc || []).join('')), d.id);
      const t = new THREE.Vector3();
      o.getWorldPosition(t);
      t.y += (d.height || 2) * 0.45;
      const dist = (d.height || 2) * 2.6;
      const dir = camera.position.clone().sub(t).normalize();
      fly.flyTo(t.clone().add(dir.multiplyScalar(dist)), t, 1.1);
    }

    picker.onClick(() => clickable, focusCreature);
    picker.onHover(() => clickable, (obj) => {
      let o = obj;
      while (o && !(o.userData && o.userData.kind === 'creature')) o = o.parent;
      renderer.domElement.style.cursor = o ? 'pointer' : 'grab';
    });

    /* ================= 自动漫游 ================= */
    const autoTourBtn = document.getElementById('autoTour');
    let touring = false, tourTimer = 0;
    autoTourBtn.addEventListener('click', () => {
      touring = !touring;
      autoTourBtn.classList.toggle('is-active', touring);
      autoTourBtn.textContent = touring ? '⏹ 停止漫游' : '🚀 时间漫游';
      if (touring) tourTimer = 3;
    });

    /* ================= 播放控制 ================= */
    let isPlaying = true;
    const clock = new THREE.Clock();
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying ? '<span class="sv-btn__icon">⏸</span><span>暂停</span>' : '<span class="sv-btn__icon">▶</span><span>播放</span>';
      if (!isPlaying) clock.getDelta();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      fly.flyTo(new THREE.Vector3(9, 4.8, 14), new THREE.Vector3(0, 1.8, 0), 1.2);
    });

    /* ================= 动画 ================= */
    function animate() {
      const dt = isPlaying ? clock.getDelta() : 0;
      if (isPlaying) {
        // 骨骼动画 + 沿圆周行走（有 walkRadius 的恐龙会绕圈巡游）
        creatures.forEach((c) => {
          c.mixer.update(dt);
          if (c.moving) {
            c.phase += dt * c.walkSpeed;
            const r = c.walkRadius;
            c.root.position.x = c.center.x + Math.cos(c.phase) * r;
            c.root.position.z = c.center.z + Math.sin(c.phase) * r;
            if (c.flying) {
              c.root.position.y = c.center.y + Math.sin(c.phase * 0.7) * 0.5;
              // 飞行姿态：轻微侧倾
              c.root.rotation.z = Math.cos(c.phase) * 0.18;
            }
            // 朝向切线方向（模型朝 +Z）
            const dirSign = c.walkSpeed >= 0 ? 1 : -1;
            const dx = -Math.sin(c.phase) * dirSign;
            const dz = Math.cos(c.phase) * dirSign;
            c.root.rotation.y = Math.atan2(dx, dz);
            // 行走时混合 walk 动作
            if (c.actions.walk) c.actions.walk.setEffectiveWeight(0.85);
            if (c.actions.idle) c.actions.idle.setEffectiveWeight(0.15);
          }
        });
        if (touring) {
          tourTimer += dt;
          // 每一纪停留 26 秒，刚好够把这一纪的讲解听完（约 30 秒，允许被下一纪打断）
          if (tourTimer > 26) {
            tourTimer = 0;
            switchEra((eraIdx + 1) % ERAS.length);
          }
        }
      }
      fly.update(dt);
      controls.update();
      labelRenderer.render(scene, camera);
      if (composer) composer.render();
      else renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    // 先加载模型，再渲染当前年代
    loadModels(() => {
      showEra(0, true);
      document.getElementById('loader').classList.add('is-done');
    });
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
