  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { createGarden } from './garden-models.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    
    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 讲解文案（卡片 / 语音共用一份） --------- */
    // 优先用 info.say（写给"耳朵"的口语讲解），没有时用结构化字段拼一句
    function narrate(info) {
      if (!info) return '';
      if (info.say) return info.say;
      const parts = [info.name + '。'];
      if (info.type) parts.push(info.type + '。');
      if (info.stats && info.stats.length) {
        parts.push(info.stats.map((s) => s.label + '，' + s.value).join('。') + '。');
      }
      if (info.desc && info.desc.length) parts.push(info.desc.join('。'));
      return parts.join('').replace(/。{2,}/g, '。');
    }
    
    /* ---------------- 语音（神经语音包优先，浏览器语音兜底） ---------------- */
    /**
     * 两级语音方案：
     *   1) 预生成的神经语音包（edge-tts 晓晓 / 云希等）—— 音质接近真人，
     *      文件命名 v_<id>.mp3，放在 audioBase 目录下，离线可用、无密钥。
     *   2) 浏览器 speechSynthesis —— 语音包里没有这句时兜底，并做了音色排序
     *      （优先云端自然音 / 增强音色）与按句切分，比直接取第一个中文音色自然得多。
     *
     * 用法：const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
     *       voice.speak(S.narrate(data), data.voiceId);
     */
    function createVoice(opts) {
      opts = opts || {};
      const audioBase = opts.audioBase || null;   // 语音包目录，留空则纯浏览器语音
      const synth = window.speechSynthesis || null;
      let enabled = true;
      let zhVoice = null;
      let audioEl = null;
      let seq = 0;                                 // 打断计数：切天体时丢弃旧队列
      const missing = Object.create(null);         // 语音包里不存在的 id，只探测一次
    
      /* --- 音色挑选：给候选中文音色打分，取最自然的一个 --- */
      function score(v) {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        let s = 0;
        if (/xiaoxiao|xiaoyi|yunxi|yunjian|晓晓|云希|云扬/.test(name)) s += 60;
        if (/natural|neural|premium|enhanced|自然/.test(name)) s += 40;
        if (/google/.test(name)) s += 32;                 // Chrome 云端音，韵律较自然
        if (/ting-?ting|tingting|meijia|sinji|婷婷|美佳|善怡|美嘉/.test(name)) s += 24;
        if (/^zh[-_]?cn|cmn|^zh$/.test(lang)) s += 18;
        if (/^zh[-_]?(hk|tw)|yue/.test(lang)) s -= 14;    // 粤语 / 台湾腔，普通话场景降权
        if (v.localService) s += 6;                       // 本地音：断网也能用
        return s;
      }
      function pick() {
        if (!synth || !synth.getVoices) return;
        const all = synth.getVoices() || [];
        const zh = all.filter((v) => /^zh|cmn|yue/i.test(v.lang || ''));
        if (!zh.length) return;
        zhVoice = zh.slice().sort((a, b) => score(b) - score(a))[0] || null;
      }
      if (synth) {
        pick();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', pick);
      }
    
      /* --- 兜底：浏览器语音，按句切开逐句念，停顿更自然 --- */
      function chunk(text) {
        const parts = String(text).replace(/\s+/g, '').match(/[^。！？；!?]+[。！？；!?]?/g) || [];
        const out = [];
        let buf = '';
        parts.forEach((p) => {
          if (buf && (buf + p).length > 46) { out.push(buf); buf = p; }
          else buf += p;
        });
        if (buf) out.push(buf);
        return out.length ? out : [String(text)];
      }
      function speakTTS(text) {
        if (!synth || !text) return;
        const mySeq = ++seq;
        const chunks = chunk(text);
        let i = 0;
        const next = () => {
          if (!enabled || mySeq !== seq || i >= chunks.length) return;
          const u = new SpeechSynthesisUtterance(chunks[i++]);
          u.lang = 'zh-CN';
          u.rate = 0.98;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (!zhVoice) pick();
          if (zhVoice) u.voice = zhVoice;
          u.onend = () => setTimeout(next, 90);
          u.onerror = () => {};
          synth.speak(u);
        };
        // Chrome 在 cancel() 之后立刻 speak() 偶发静音，等一小会儿再开口
        setTimeout(next, 60);
      }
    
      /* --- 首选：播放语音包 --- */
      function playPack(id, text) {
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.preload = 'auto';
        }
        const el = audioEl;
        let done = false;
        const fallback = () => {
          if (done) return;
          done = true;
          missing[id] = true;
          speakTTS(text);
        };
        el.onerror = fallback;
        el.onplaying = () => { el.onerror = null; };
        el.src = audioBase + 'v_' + id + '.mp3';
        const p = el.play();
        if (p && p.catch) p.catch(fallback);
      }
    
      function speak(text, id) {
        if (!enabled || !text) return;
        if (id && audioBase && !missing[id]) {
          seq++;                      // 打断上一句（浏览器语音队列）
          if (synth) synth.cancel();
          playPack(id, text);
          return;
        }
        if (audioEl) audioEl.pause();
        if (synth) synth.cancel();
        speakTTS(text);
      }
      function stop() {
        seq++;
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        if (synth) synth.cancel();
      }
      function toggle() {
        enabled = !enabled;
        if (!enabled) stop();
        return enabled;
      }
      return { speak, stop, toggle, isEnabled: () => enabled, hasPack: !!audioBase };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      // 页面里已有 .sv-card 容器时直接复用，避免套娃出两层透明卡片
      const host = container && container.nodeType === 1 ? container : document.body;
      let el;
      if (host.classList && host.classList.contains('sv-card')) {
        el = host;
      } else {
        el = document.createElement('div');
        el.className = 'sv-card';
        host.appendChild(el);
      }
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            // 兼容两种写法：[label, value] 数组 或 { label, value } 对象
            const label = Array.isArray(s) ? s[0] : s.label;
            const value = Array.isArray(s) ? s[1] : s.value;
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span></span><b></b>';
            row.querySelector('span').textContent = label == null ? '' : label;
            row.querySelector('b').textContent = value == null ? '' : value;
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        if (data.facts && data.facts.length) {
          data.facts.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__fact';
            row.innerHTML = '<i>\uD83D\uDCA1</i><span></span>';

    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      // targets 可以是数组，也可以是返回数组的函数（换场景后数组会被整体替换）
      const resolve = (targets) => (typeof targets === 'function' ? targets() : targets) || [];
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const list = resolve(targets);
        const hits = raycaster.intersectObjects(list, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          const th = u * Math.PI * 2;
          const nx = Math.cos(th) * 3, ny = Math.sin(th) * 3;
          const n = fbm2(nx + 1.7, v * 5 - ny * 0.4, 5);
          const n2 = fbm2(nx * 2.3 + 9.1, v * 7 + 3.3, 4);
          let t = clamp(n * 0.7 + n2 * 0.3, 0, 1);
          const col = sampleBands(bands, t);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function sampleBands(bands, t) {
      const seg = 1 / (bands.length - 1);
      const idx = Math.min(Math.floor(t / seg), bands.length - 2);
      const local = (t - idx * seg) / seg;
      return bands[idx].clone().lerp(bands[idx + 1], local);
    }
    
    // 恐龙皮肤纹理（鳞片噪声 + 色斑 + 腹部渐变）
    function skinTexture(baseColor, spotColor, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const base = new THREE.Color(baseColor);
      const spot = new THREE.Color(spotColor);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          // 鳞片：高频网格噪声
          const scale = fbm2(u * 18, v * 18, 4);
          const scale2 = fbm2(u * 40 + 3, v * 40 + 7, 3);
          // 色斑：低频大块斑纹
          const spotN = fbm2(u * 6 + 11, v * 6 - 5, 4);
          let col = base.clone();
          col.lerp(spot, S.clamp((spotN - 0.42) * 3.0, 0, 1) * 0.5);
          // 鳞片刻痕（微亮/微暗）
          const sheen = (scale2 - 0.5) * 0.16 + (scale - 0.5) * 0.08;
          col.r = S.clamp(col.r + sheen, 0, 1);
          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    
    /* ---------------- 星空（分层 + 大小/亮度变化） --------- */
    function createStarfield(count, radius, color1, color2) {
      count = count || 1400;
      radius = radius || 240;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c1 = new THREE.Color(color1 || 0xffffff);
      const c2 = new THREE.Color(color2 || 0xaac4ff);
      for (let i = 0; i < count; i++) {
        const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1)
          .normalize().multiplyScalar(radius);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
        const c = c1.clone().lerp(c2, Math.random());
        const b = 0.4 + Math.random() * 0.6;
        col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.5, vertexColors: true, transparent: true, opacity: 0.85,
        sizeAttenuation: true, depthWrite: false,
      });
      return new THREE.Points(geo, mat);
    }

    // 创建 3D 标签（需传入 CSS2DObject 构造器）并定位
    function makeLabel(CSS2DObject, text, position, className) {
      const div = document.createElement('div');
      div.className = className || 'sv-label';
      div.textContent = text;
      const obj = new CSS2DObject(div);
      if (position) obj.position.copy(position);
      return obj;
    }
    
    function toast(text, ms) {  let el = document.querySelector('.sv-toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'sv-toast';
        document.body.appendChild(el);

      el.textContent = text;
      el.classList.add('is-open');

    }
    function bindVoiceButton(btn, voice) {
      if (!btn) return;

        say: '花窗也叫漏窗，是墙上镂空的一扇窗。它最会半遮半露：全挡住太闷，全打开又没意思，露一半才耐看。你在廊子里走，窗外的竹子一会儿看得见、一会儿看不见，走过去才看清全貌。苏州留园一条廊上的漏窗，几十扇没有一扇重复。',
      },
    ];

    const PLANTS = [
      {
        id: 'song', name: '松', en: 'Pine', color: '#33513a',
        type: '园中植物 · 松',
        stats: [
          ['树种', '黑松 / 罗汉松'],
          ['姿态', '虬曲 · 偃卧'],
          ['寓意', '岁寒不凋'],
          ['典型', '拙政园 古松'],
        ],
        desc: [
          '园中松多经人工盘扎，枝干虬曲，象征君子风骨。',
          '松常与石搭配，"松石图"是文人画最常见的题材。',
        ],
        facts: [
          '一棵造型好的松，往往要盘扎十几年。',
          '松针四季常青，所以和竹、梅并称"岁寒三友"。',
        ],
        say: '园子里的松树大多是人工盘过的，枝干弯弯曲曲，像画里那样。松和石头摆在一起，就是一幅松石图，文人最喜欢画这个。一棵造型好的松，要盘十几年才能成形。',
      },
      {
        id: 'zhu', name: '竹', en: 'Bamboo', color: '#5f7f42',
        type: '园中植物 · 竹',
        stats: [
          ['种类', '慈孝竹 / 紫竹'],
          ['配置', '丛植于墙角'],
          ['寓意', '虚心 · 有节'],
          ['作用', '听风 · 障景'],
        ],
        desc: [
          '竹丛种在墙角或窗后，风过有声，影落粉墙，是最省钱的一幅画。',
          '竹不单株种，要成丛，密才有声、才有影。',
        ],
        facts: [
          '"宁可食无肉，不可居无竹"——苏轼。',
          '粉墙前的竹影，是中国园林最著名的一个画面。',
        ],
        say: '竹子不单棵种，要一丛一丛地种在墙角或者窗后。风一吹就有声音，太阳一照，影子落在白墙上，就是一幅画，几乎不花钱。苏东坡说宁可食无肉，不可居无竹，说的就是这种清雅。',
      },
      {
        id: 'liu', name: '柳', en: 'Willow', color: '#6d8a4e',
        type: '园中植物 · 柳',
        stats: [
          ['种类', '垂柳'],
          ['位置', '池岸'],
          ['寓意', '依依惜别'],
          ['作用', '柔化岸线'],
        ],
        desc: [
          '垂柳依水而植，枝条垂到水面，把生硬的石岸柔化。',
          '柳是园中"软"的元素，与石的"硬"形成对比。',
        ],
        facts: [
          '柳与"留"谐音，古人折柳送别。',
          '柳枝插土即活，是最好种的园林树之一。',
        ],
        say: '柳树种在水边，枝条一直垂到水面上，把硬邦邦的石头岸线软化下来。园子里有石头这样的硬东西，就要有柳这样的软东西来配。古人送别的时候折柳枝，因为柳和留同音，是挽留的意思。',
      },
      {
        id: 'he', name: '荷', en: 'Lotus', color: '#7a9a5e',
        type: '园中植物 · 荷',
        stats: [
          ['种类', '荷花（芙蓉）'],
          ['位置', '池中'],
          ['花期', '6 ~ 9 月'],
          ['寓意', '出淤泥而不染'],
        ],
        desc: [
          '荷叶铺满水面，夏天开花，是园林水景的主角。',
          '荷种在池中不种满，留出水面才有倒影。',
        ],
        facts: [
          '荷叶表面有微结构，水珠滚过不沾湿，叫"荷叶效应"。',
          '荷花与睡莲不同：荷花挺出水面，睡莲贴着水面开。',
        ],
        say: '荷叶铺在水面上，夏天开花，是水池里的主角。荷不能种满，要留出水面，才有倒影可看。荷叶很神奇，水珠落上去会滚下来，一点都不会湿，科学家把这个叫做荷叶效应。',
      },
    ];

    const IDEAS = [
      {
        id: 'jiejing', name: '借景', en: 'Borrowed Scenery', color: '#9a8f7a',
        type: '造园手法 · 借景',
        stats: [
          ['出处', '计成《园冶》'],
          ['原文', '园虽别内外，得景则无拘远近'],
          ['典型', '拙政园借北寺塔'],
          ['分类', '远借 · 邻借 · 仰借 · 俯借'],
        ],
        desc: [
          '把园子外面的景——远塔、远山、天空——借进园里来，园子虽小，眼界却大。',
          '借景是江南园林"小中见大"最关键的一招：自己不造，却把别人的景算进自己的构图。',
        ],
        facts: [
          '拙政园西部从"别有洞天"望出去，正好把园外的北寺塔框进画面。',
          '《园冶》是中国第一本造园专著，作者计成是明代造园家。',
        ],
        say: '借景，是把园子外面的景借进来。远处的塔、远处的山、天上的云，都可以借。拙政园西部有一个门洞，从那里望出去，正好把园外的北寺塔框在画面里，塔明明在园外，看起来却像园子里的一景。园子不大，但眼界可以很大，靠的就是这一招。',
      },
      {
        id: 'kuangjing', name: '框景', en: 'Framed Scenery', color: '#b0a184',
        type: '造园手法 · 框景',
        stats: [
          ['工具', '月洞门 · 花窗 · 廊柱'],
          ['效果', '一框一画'],
          ['出处', '《园冶》'],
          ['相关', '对景 · 移步换景'],
        ],
        desc: [
          '用门洞、窗洞、柱间把景致框住，像给风景装了一个画框。',
          '框景讲究"框正、景深、层次"——框里最好有近景、中景、远景三层。',
        ],
        facts: [
          '同一个景，换个框就是另一幅画，所以园林"一步一景"。',
          '框景常与对景合用：框住的正好是园中最好的那处景。',
        ],
        say: '框景，就是用门洞、窗洞、柱子之间，把风景框起来。同一个景，换个框子就是另一幅画，所以园林里走一步就换一个景。框景讲究框要正、里面要有层次，最好近处有东西、中间有东西、远处还有东西。',
      },
    ];
    /* @voice-data-end */

    /* ==================================================================
       场景骨架
       ================================================================== */
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xd6dcd4, 0.0055);

    const camera = S.createCamera(40, 0.1, 500);
    camera.position.set(27, 30, 32);

    const { renderer, composer, renderPass } = S.createRenderer({
      exposure: 0.91, bloom: false,
    });
    if (renderPass) { renderPass.scene = scene; renderPass.camera = camera; }

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    labelRenderer.domElement.style.overflow = 'hidden';
    document.body.appendChild(labelRenderer.domElement);

    const controls = S.createControls(camera, renderer.domElement, new THREE.Vector3(0, 1.2, 0));
    controls.minDistance = 1.8;
    controls.maxDistance = 180;
    controls.maxPolarAngle = Math.PI * 0.49;

    const P = (x, y, z) => new THREE.Vector3(x, y, z);

    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', '可交互的江南园林三维场景');
    const garden = createGarden(scene, renderer, S, { SPOTS, PLANTS, IDEAS });

    /* ==================================================================
       3D 标签
       ================================================================== */
    const labelObjs = [];
    let labelTick = 0;
    let labelsVisible = true;
    const labelV = new THREE.Vector3();

    function addLabel(text, pos, opt) {
      opt = opt || {};
      const obj = S.makeLabel(CSS2DObject, text, pos, 'sv-label' + (opt.minor ? ' is-minor' : ''));
      obj.userData.inner = obj.element;
      obj.userData.key = opt.key || null;
      if (opt.key) {
        obj.element.style.pointerEvents = 'auto';
        obj.element.style.cursor = 'pointer';
        obj.element.setAttribute('role', 'button');
        obj.element.setAttribute('tabindex', '0');
        obj.element.setAttribute('aria-label', '查看' + text);
        obj.element.addEventListener('click', event => { event.stopPropagation(); focusKey(opt.key); });
        obj.element.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); focusKey(opt.key); }
        });
      }
      scene.add(obj);
      labelObjs.push(obj);
      return obj;
    }

    addLabel('六角亭', P(11.6, 7.5, -7.6), { key: 'ting' });
    addLabel('远香堂', P(-11.2, 7.3, -9.6), { key: 'tang' });
    addLabel('芙蓉榭', P(8.8, 5.7, 8.4), { key: 'xie' });
    addLabel('香洲（舫）', P(-12.6, 5.4, 4.2), { key: 'fang' });
    addLabel('游廊', P(1.5, 4.8, -13.2), { key: 'lang' });
    addLabel('太湖石假山', P(-3.5, 6.4, -6.7), { key: 'shan' });
    addLabel('水池', P(2.2, 1.1, -2.2), { key: 'chi' });
    addLabel('曲桥', P(-1.6, 1.5, 1.9), { key: 'qiao', minor: true });
    addLabel('月洞门', P(0, 4.7, 16), { key: 'men' });
    addLabel('漏窗', P(-21, 4.3, 9.5), { key: 'chuang', minor: true });
    addLabel('松', P(-14.8, 6.7, -3.8), { key: 'song', minor: true });
    addLabel('竹', P(-16.2, 6.8, -1.0), { key: 'zhu', minor: true });
    addLabel('柳', P(10.6, 6, 1.5), { key: 'liu', minor: true });
    addLabel('荷', P(4.8, 1.2, 4.0), { key: 'he', minor: true });
    addLabel('借景 · 园外远塔', P(13, 14.5, -58), { key: 'jiejing', minor: true });

    /* ==================================================================
       交互
       ================================================================== */
    const voice = S.createVoice({ audioBase: '../audio/garden/' });
    S.bindVoiceButton(document.getElementById('voiceBtn'), voice);
    const card = S.createCard(document.getElementById('card'));
    const picker = S.makePicker(camera, renderer.domElement);
    const fly = S.makeFly(camera, controls);

    function defByKey(key) {
      return SPOTS.find((s) => s.id === key)
        || PLANTS.find((p) => p.id === key)
        || IDEAS.find((i) => i.id === key)
        || null;
    }

    function showInfo(def) {
      if (!def) return;
      card.show(def);
      voice.speak(S.narrate(def), def.id);
    }

    function markSpot(key) {
      document.querySelectorAll('.gd-item').forEach((b) => {
        b.classList.toggle('is-on', b.dataset.key === key);
      });
    }

    const FOCUS = {
      ting: { pos: P(21, 8.2, 3), target: P(11.6, 3.1, -7.6) },
      tang: { pos: P(-.5, 6.2, 1), target: P(-11.2, 2.9, -9.6) },
      xie: { pos: P(1.5, 5.3, .7), target: P(8.8, 2.2, 8.4) },
      fang: { pos: P(-5.0, 6.5, 9.5), target: P(-12.6, 3.0, 4.2) },
      lang: { pos: P(2.0, 6.5, -4.5), target: P(1.5, 3.2, -13.2) },
      shan: { pos: P(4, 4.5, 2.5), target: P(-3.5, 2.5, -6.7) },
      chi: { pos: P(2, 9, 19), target: P(0, .5, -.7) },
      qiao: { pos: P(3.0, 5.0, 9.0), target: P(-0.5, 1.0, 1.6) },
      men: { pos: P(0, 3.0, 27), target: P(0, 2.2, 15) },
      chuang: { pos: P(-30, 2.8, 9.5), target: P(-21, 1.8, 9.5) },
      song: { pos: P(-7.5, 4.8, 3), target: P(-14.8, 2.5, -3.8) },
      zhu: { pos: P(-10, 6.5, 2.5), target: P(-16.2, 3.2, -1.0) },
      liu: { pos: P(17, 6.5, 6.5), target: P(11.2, 3.0, 2.6) },
      he: { pos: P(9.5, 4.0, 8.5), target: P(4.8, 0.2, 4.0) },
      jiejing: { pos: P(9, 7, -13), target: P(9, 11, -40) },
    };

    let focusedKey = null;
    function focusKey(key) {
      focusedKey = key;
      const def = defByKey(key);
      if (!def) return;
      showInfo(def);
      markSpot(key);
      const f = FOCUS[key];
      if (f) {
        renderer.domElement.setAttribute('aria-busy', 'true');
        const pos = f.pos.clone().sub(f.target).multiplyScalar(Math.max(1, .85 / camera.aspect)).add(f.target);
        fly.flyTo(pos, f.target, 1.15, () => renderer.domElement.setAttribute('aria-busy', 'false'));
      }
    }

    const labelBtn = document.getElementById('labelBtn');
    labelBtn.addEventListener('click', () => {
      labelsVisible = !labelsVisible;
      labelBtn.classList.toggle('is-on', labelsVisible);
      labelBtn.setAttribute('aria-pressed', String(labelsVisible));
      labelObjs.forEach(o => { o.visible = labelsVisible; });
    });

    /* ---- 拾取 ---- */
    function resolveOwner(obj) {
      let o = obj;
      while (o && !(o.userData && o.userData.kind)) o = o.parent;
      return o ? o.userData : null;
    }
    picker.onHover(() => garden.pickTargets, (obj) => {
      renderer.domElement.style.cursor = resolveOwner(obj) ? 'pointer' : 'grab';
    });
    picker.onClick(() => garden.pickTargets, (obj) => {
      const owner = resolveOwner(obj);
      if (!owner) return;
      if (owner.key) focusKey(owner.key);
    });

    /* ---- 景点索引 ---- */
    const spotList = document.getElementById('spotList');
    ['ting', 'tang', 'xie', 'fang', 'lang', 'shan', 'chi', 'qiao', 'men', 'chuang', 'song', 'zhu', 'liu', 'he'].forEach((key) => {
      const def = defByKey(key);
      if (!def) return;
      const b = document.createElement('button');
      b.className = 'gd-item';
      b.dataset.key = key;
      b.innerHTML = '<span class="gd-item__dot" style="background:' + def.color + ';color:' + def.color + '"></span>' + def.name;
      b.addEventListener('click', () => focusKey(key));
      spotList.appendChild(b);
    });

    /* ==================================================================
       视角
       ================================================================== */
    const VIEWS = {
      overview: { pos: P(32, 28, 38), target: P(0, 1.2, 0) },
      pavilion: { pos: P(11.6, 2.15, -6.2), target: P(-2.0, 1.0, 3.5) },
      xie: { pos: P(7.7, 2.0, 6.8), target: P(-3.0, 1.0, -4.0) },
      moon: { pos: P(0, 1.65, 22), target: P(0, 1.42, 5) },
      aerial: { pos: P(4, 52, 22), target: P(0, 0, 0) },
    };
    let currentView = 'overview';

    function setView(name) {
      focusedKey = null;
      currentView = name;
      const v = VIEWS[name] || VIEWS.overview;
      const pos = v.pos.clone();
      if (name === 'overview' || name === 'aerial') {
        pos.sub(v.target).multiplyScalar(Math.max(1, 1.24 / camera.aspect)).add(v.target);
      }
      renderer.domElement.setAttribute('aria-busy', 'true');
      fly.flyTo(pos, v.target, 1.25, () => renderer.domElement.setAttribute('aria-busy', 'false'));
      document.querySelectorAll('[data-view]').forEach((b) => {
        b.classList.toggle('is-on', b.dataset.view === name);
      });
      // 切视角时把上一张卡片收起来，画面干净
      card.hide();
      labelObjs.forEach((o) => { o.element.style.opacity = '1'; });
      markSpot(null);
    }

    document.querySelectorAll('[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      setView('overview');
    });

    let isPlaying = true;
    const clock = new THREE.Clock();
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying
        ? '<span class="sv-btn__icon">⏸</span><span>暂停</span>'
        : '<span class="sv-btn__icon">▶</span><span>播放</span>';
      if (!isPlaying) clock.getDelta();
    });

    /* ==================================================================
       标签避让
       ================================================================== */
    function layoutLabels() {
      if (!labelsVisible || (labelTick++ % 2) !== 0) return;
      const items = [];
      labelObjs.forEach((o) => {
        const el = o.userData.inner;
        if (!el || parseFloat(el.style.opacity || '1') < 0.3) return;
        o.getWorldPosition(labelV);
        labelV.project(camera);
        const minorInOverview = camera.aspect < 1 && !focusedKey && (currentView === 'overview' || currentView === 'aerial') && !['ting', 'tang', 'xie', 'shan', 'men'].includes(o.userData.key);
        const offscreen = minorInOverview || labelV.z > 1 || Math.abs(labelV.x) > .94 || Math.abs(labelV.y) > .82;
        el.style.visibility = offscreen ? 'hidden' : '';
        if (offscreen) return;
        const x = (labelV.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-labelV.y * 0.5 + 0.5) * window.innerHeight;
        const w = el.offsetWidth || 56;
        const h = el.offsetHeight || 18;
        items.push({ el, sx: x - w / 2, sy: y - h / 2, w, h });
      });
      items.sort((a, b) => a.sy - b.sy);
      const placed = [];
      items.forEach((it) => {
        let shift = 0;
        for (let k = 0; k < 8; k++) {
          const box = { x1: it.sx, y1: it.sy + shift, x2: it.sx + it.w, y2: it.sy + it.h + shift };
          const hit = placed.some((p) => !(box.x2 < p.x1 || box.x1 > p.x2 || box.y2 < p.y1 || box.y1 > p.y2));
          if (!hit) { placed.push(box); break; }
          shift += it.h + 3;
        }
        it.el.style.translate = shift ? '0 ' + shift + 'px' : '';
      });
    }

    /* ==================================================================
       动画
       ================================================================== */
    let elapsed = 0;

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (isPlaying) {
        elapsed += dt;
        garden.update(elapsed);
      }
      fly.update(dt);
      controls.update();
      scene.fog.near = Math.max(65, camera.position.distanceTo(controls.target) + 24);
      scene.fog.far = scene.fog.near + 100;
      layoutLabels();
      labelRenderer.render(scene, camera);
      if (composer) composer.render();
      else renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    /* ==================================================================
       启动
       ================================================================== */
    setView('overview');
    document.getElementById('loader').classList.add('is-done');
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      if (!focusedKey && (currentView === 'overview' || currentView === 'aerial')) setView(currentView);
    });
  </script>
</body>
</html>
