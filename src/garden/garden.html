  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    
    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 讲解文案（卡片 / 语音共用一份） --------- */
    // 优先用 info.say（写给"耳朵"的口语讲解），没有时用结构化字段拼一句
    function narrate(info) {
      if (!info) return '';
      if (info.say) return info.say;
      const parts = [info.name + '。'];
      if (info.type) parts.push(info.type + '。');
      if (info.stats && info.stats.length) {
        parts.push(info.stats.map((s) => s.label + '，' + s.value).join('。') + '。');
      }
      if (info.desc && info.desc.length) parts.push(info.desc.join('。'));
      return parts.join('').replace(/。{2,}/g, '。');
    }
    
    /* ---------------- 语音（神经语音包优先，浏览器语音兜底） ---------------- */
    /**
     * 两级语音方案：
     *   1) 预生成的神经语音包（edge-tts 晓晓 / 云希等）—— 音质接近真人，
     *      文件命名 v_<id>.mp3，放在 audioBase 目录下，离线可用、无密钥。
     *   2) 浏览器 speechSynthesis —— 语音包里没有这句时兜底，并做了音色排序
     *      （优先云端自然音 / 增强音色）与按句切分，比直接取第一个中文音色自然得多。
     *
     * 用法：const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
     *       voice.speak(S.narrate(data), data.voiceId);
     */
    function createVoice(opts) {
      opts = opts || {};
      const audioBase = opts.audioBase || null;   // 语音包目录，留空则纯浏览器语音
      const synth = window.speechSynthesis || null;
      let enabled = true;
      let zhVoice = null;
      let audioEl = null;
      let seq = 0;                                 // 打断计数：切天体时丢弃旧队列
      const missing = Object.create(null);         // 语音包里不存在的 id，只探测一次
    
      /* --- 音色挑选：给候选中文音色打分，取最自然的一个 --- */
      function score(v) {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        let s = 0;
        if (/xiaoxiao|xiaoyi|yunxi|yunjian|晓晓|云希|云扬/.test(name)) s += 60;
        if (/natural|neural|premium|enhanced|自然/.test(name)) s += 40;
        if (/google/.test(name)) s += 32;                 // Chrome 云端音，韵律较自然
        if (/ting-?ting|tingting|meijia|sinji|婷婷|美佳|善怡|美嘉/.test(name)) s += 24;
        if (/^zh[-_]?cn|cmn|^zh$/.test(lang)) s += 18;
        if (/^zh[-_]?(hk|tw)|yue/.test(lang)) s -= 14;    // 粤语 / 台湾腔，普通话场景降权
        if (v.localService) s += 6;                       // 本地音：断网也能用
        return s;
      }
      function pick() {
        if (!synth || !synth.getVoices) return;
        const all = synth.getVoices() || [];
        const zh = all.filter((v) => /^zh|cmn|yue/i.test(v.lang || ''));
        if (!zh.length) return;
        zhVoice = zh.slice().sort((a, b) => score(b) - score(a))[0] || null;
      }
      if (synth) {
        pick();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', pick);
      }
    
      /* --- 兜底：浏览器语音，按句切开逐句念，停顿更自然 --- */
      function chunk(text) {
        const parts = String(text).replace(/\s+/g, '').match(/[^。！？；!?]+[。！？；!?]?/g) || [];
        const out = [];
        let buf = '';
        parts.forEach((p) => {
          if (buf && (buf + p).length > 46) { out.push(buf); buf = p; }
          else buf += p;
        });
        if (buf) out.push(buf);
        return out.length ? out : [String(text)];
      }
      function speakTTS(text) {
        if (!synth || !text) return;
        const mySeq = ++seq;
        const chunks = chunk(text);
        let i = 0;
        const next = () => {
          if (!enabled || mySeq !== seq || i >= chunks.length) return;
          const u = new SpeechSynthesisUtterance(chunks[i++]);
          u.lang = 'zh-CN';
          u.rate = 0.98;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (!zhVoice) pick();
          if (zhVoice) u.voice = zhVoice;
          u.onend = () => setTimeout(next, 90);
          u.onerror = () => {};
          synth.speak(u);
        };
        // Chrome 在 cancel() 之后立刻 speak() 偶发静音，等一小会儿再开口
        setTimeout(next, 60);
      }
    
      /* --- 首选：播放语音包 --- */
      function playPack(id, text) {
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.preload = 'auto';
        }
        const el = audioEl;
        let done = false;
        const fallback = () => {
          if (done) return;
          done = true;
          missing[id] = true;
          speakTTS(text);
        };
        el.onerror = fallback;
        el.onplaying = () => { el.onerror = null; };
        el.src = audioBase + 'v_' + id + '.mp3';
        const p = el.play();
        if (p && p.catch) p.catch(fallback);
      }
    
      function speak(text, id) {
        if (!enabled || !text) return;
        if (id && audioBase && !missing[id]) {
          seq++;                      // 打断上一句（浏览器语音队列）
          if (synth) synth.cancel();
          playPack(id, text);
          return;
        }
        if (audioEl) audioEl.pause();
        if (synth) synth.cancel();
        speakTTS(text);
      }
      function stop() {
        seq++;
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        if (synth) synth.cancel();
      }
      function toggle() {
        enabled = !enabled;
        if (!enabled) stop();
        return enabled;
      }
      return { speak, stop, toggle, isEnabled: () => enabled, hasPack: !!audioBase };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      // 页面里已有 .sv-card 容器时直接复用，避免套娃出两层透明卡片
      const host = container && container.nodeType === 1 ? container : document.body;
      let el;
      if (host.classList && host.classList.contains('sv-card')) {
        el = host;
      } else {
        el = document.createElement('div');
        el.className = 'sv-card';
        host.appendChild(el);
      }
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            // 兼容两种写法：[label, value] 数组 或 { label, value } 对象
            const label = Array.isArray(s) ? s[0] : s.label;
            const value = Array.isArray(s) ? s[1] : s.value;
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span></span><b></b>';
            row.querySelector('span').textContent = label == null ? '' : label;
            row.querySelector('b').textContent = value == null ? '' : value;
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        if (data.facts && data.facts.length) {
          data.facts.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__fact';
            row.innerHTML = '<i>\uD83D\uDCA1</i><span></span>';
            row.querySelector('span').textContent = line;
            body.appendChild(row);
          });
        }
        el.classList.add('is-open');
      }
      function hide() { el.classList.remove('is-open'); }
      close.addEventListener('click', hide);
      return { element: el, show, hide };
    }
    
    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      // targets 可以是数组，也可以是返回数组的函数（换场景后数组会被整体替换）
      const resolve = (targets) => (typeof targets === 'function' ? targets() : targets) || [];
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const list = resolve(targets);
        const hits = raycaster.intersectObjects(list, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          const th = u * Math.PI * 2;
          const nx = Math.cos(th) * 3, ny = Math.sin(th) * 3;
          const n = fbm2(nx + 1.7, v * 5 - ny * 0.4, 5);
          const n2 = fbm2(nx * 2.3 + 9.1, v * 7 + 3.3, 4);
          let t = clamp(n * 0.7 + n2 * 0.3, 0, 1);
          const col = sampleBands(bands, t);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function sampleBands(bands, t) {
      const seg = 1 / (bands.length - 1);
      const idx = Math.min(Math.floor(t / seg), bands.length - 2);
      const local = (t - idx * seg) / seg;
      return bands[idx].clone().lerp(bands[idx + 1], local);
    }
    
    // 恐龙皮肤纹理（鳞片噪声 + 色斑 + 腹部渐变）
    function skinTexture(baseColor, spotColor, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const base = new THREE.Color(baseColor);
      const spot = new THREE.Color(spotColor);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          // 鳞片：高频网格噪声
          const scale = fbm2(u * 18, v * 18, 4);
          const scale2 = fbm2(u * 40 + 3, v * 40 + 7, 3);
          // 色斑：低频大块斑纹
          const spotN = fbm2(u * 6 + 11, v * 6 - 5, 4);
          let col = base.clone();
          col.lerp(spot, S.clamp((spotN - 0.42) * 3.0, 0, 1) * 0.5);
          // 鳞片刻痕（微亮/微暗）
          const sheen = (scale2 - 0.5) * 0.16 + (scale - 0.5) * 0.08;
          col.r = S.clamp(col.r + sheen, 0, 1);
          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    
    /* ---------------- 星空（分层 + 大小/亮度变化） --------- */
    function createStarfield(count, radius, color1, color2) {
      count = count || 1400;
      radius = radius || 240;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c1 = new THREE.Color(color1 || 0xffffff);
      const c2 = new THREE.Color(color2 || 0xaac4ff);
      for (let i = 0; i < count; i++) {
        const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1)
          .normalize().multiplyScalar(radius);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
        const c = c1.clone().lerp(c2, Math.random());
        const b = 0.4 + Math.random() * 0.6;
        col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.5, vertexColors: true, transparent: true, opacity: 0.85,
        sizeAttenuation: true, depthWrite: false,
      });
      return new THREE.Points(geo, mat);

    function pavingTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#b8b2a0';
      ctx.fillRect(0, 0, 512, 512);
      // 卵石
      for (let i = 0; i < 1400; i++) {
        const x = Math.random() * 512, y = Math.random() * 512;
        const r = 2.4 + Math.random() * 6;
        const g = 128 + Math.random() * 58;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * (0.7 + Math.random() * 0.5), Math.random() * 3.14, 0, 6.283);
        ctx.fillStyle = 'rgb(' + Math.round(g) + ',' + Math.round(g - 5) + ',' + Math.round(g - 20) + ')';
        ctx.fill();
      }
      // 苔藓斑
      for (let i = 0; i < 90; i++) {
        const x = Math.random() * 512, y = Math.random() * 512;
        const r = 8 + Math.random() * 26;
        const grd = ctx.createRadialGradient(x, y, 0, x, y, r);
        grd.addColorStop(0, 'rgba(96,112,74,0.30)');
        grd.addColorStop(1, 'rgba(96,112,74,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(1, 1);
      t.anisotropy = 4;
      return t;
    }

    function rockGeo(rx, ry, rz, opt) {

      const pos = g.attributes.position;
      const v = new THREE.Vector3();
      const seed = opt.seed || 0;
      const noise = opt.noise != null ? opt.noise : 0.18;
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const n = S.fbm2(v.x * 2.4 + seed, v.y * 2.4 + v.z * 1.7 + seed, 3);
        const fine = S.fbm2(v.x * 7.5 + seed * 2, v.y * 7.5 + v.z * 3.4, 2);
        const k = 1 + (n - 0.5) * 2 * noise + (fine - 0.5) * 0.12;
        pos.setXYZ(i, v.x * rx * k, v.y * ry * k, v.z * rz * k);
      }
      g.computeVertexNormals();
      return g;

    // 沿曲线的变半径管（树干、枝条、柳条）
    function sweep(pts, radFn, opt) {
      opt = opt || {};
      const tub = opt.tubular || 48;
      const rad = opt.radial || 7;
      const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
      const frames = curve.computeFrenetFrames(tub, false);
      const pos = [], uv = [], idx = [];
      const c = new THREE.Vector3();
      for (let i = 0; i <= tub; i++) {
        const t = i / tub;
        curve.getPointAt(t, c);
        const N = frames.normals[i], B = frames.binormals[i];
        const r = typeof radFn === 'function' ? radFn(t) : radFn;
        for (let j = 0; j <= rad; j++) {
          const a = (j / rad) * Math.PI * 2;
          const ca = Math.cos(a) * r, sa = Math.sin(a) * r;
          pos.push(c.x + N.x * ca + B.x * sa, c.y + N.y * ca + B.y * sa, c.z + N.z * ca + B.z * sa);
          uv.push(t, j / rad);
        }
      }
      for (let i = 0; i < tub; i++) {
        for (let j = 0; j < rad; j++) {
          const a = i * (rad + 1) + j, b = a + 1, d = a + rad + 1, e = d + 1;
          idx.push(a, d, b, b, d, e);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, opt.mat || MAT.stone);
      m.castShadow = true;
      return m;
    }

    /* ==================================================================
       理水：不规则池岸、池底、水面
       ================================================================== */
    const WATER_Y = -0.16;

    function pondShape(scale) {
      const pts = POND.map(([x, z]) => P(x * (scale || 1), 0, z * (scale || 1)));
      const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
      const arr = curve.getSpacedPoints(120);
      const shape = new THREE.Shape();
      arr.forEach((v, i) => (i ? shape.lineTo(v.x, -v.z) : shape.moveTo(v.x, -v.z)));
      shape.closePath();
      return { shape, curve };
    }
    const pond = pondShape(1);
    const pondInner = pondShape(0.985);

    // 池底
    const bedGeo = new THREE.ShapeGeometry(pondInner.shape, 24);
    bedGeo.rotateX(-Math.PI / 2);
    const bed = new THREE.Mesh(bedGeo, std(0x2b3a34, { rough: 0.98 }));
    bed.position.y = -1.25;
    bed.receiveShadow = true;
    scene.add(bed);

    // 水面
    const waterGeo = new THREE.ShapeGeometry(pond.shape, 28);
    waterGeo.rotateX(-Math.PI / 2);
    // 给水面一点 UV：ShapeGeometry 的 uv 直接取世界 xz
    const waterMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 },
        uDeep: { value: new THREE.Color(0x18342f) },
        uLight: { value: new THREE.Color(0x496a5f) },
        uSky: { value: new THREE.Color(0xc9d6ce) },
      },
      vertexShader: `
        varying vec3 vWorld;
        void main(){
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorld = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        varying vec3 vWorld;
        uniform float uTime;
        uniform vec3 uDeep, uLight, uSky;
        void main(){
          vec3 V = normalize(cameraPosition - vWorld);
          // 细密涟漪：极轻微的法线扰动，制造"波光"
          float r1 = sin(vWorld.x * 2.1 + uTime * 0.9) * cos(vWorld.z * 1.7 - uTime * 0.7);
          float r2 = sin((vWorld.x + vWorld.z) * 3.4 - uTime * 1.3);
          float ripple = r1 * 0.5 + r2 * 0.24;
          float fres = pow(1.0 - clamp(V.y, 0.0, 1.0), 2.6);
          vec3 col = mix(uDeep, uLight, 0.34 + ripple * 0.16);
          col = mix(col, uSky, fres * 0.48);
          // 点点波光
          float glint = smoothstep(0.86, 1.0, ripple * 0.5 + 0.5);
          col += vec3(0.55, 0.6, 0.56) * glint * 0.28;
          gl_FragColor = vec4(col, 0.94);
        }`,
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = WATER_Y;
    water.userData = { ...SPOTS.find((s) => s.id === 'chi'), kind: 'spot', key: 'chi' };
    scene.add(water);

    /* ---- 驳岸：沿池岸犬牙交错地摆石头 ---- */
    (function revetment() {
      const arr = pond.curve.getSpacedPoints(96);
      const g = new THREE.Group();
      arr.forEach((v, i) => {
        if (i % 2 !== 0) return;
        const rr = 0.3 + Math.random() * 0.3;
        const m = new THREE.Mesh(rockGeo(rr * 1.25, rr * 0.75, rr, { seed: i * 2.7, noise: 0.26, seg: 10, seg2: 8 }), MAT.stone);
        m.position.set(v.x + (Math.random() - 0.5) * 0.3, -0.12 + Math.random() * 0.12, v.z + (Math.random() - 0.5) * 0.3);
        m.rotation.y = Math.random() * 6.28;
        m.castShadow = true;
        m.receiveShadow = true;
        g.add(m);
      });
      scene.add(g);
    })();

    /* ==================================================================
       建筑：六角亭
       ================================================================== */
    function hexRoof(R, h, lip) {
      // 中心 + 6 檐角（翘起）+ 6 檐中（下垂），形成飞檐曲线
      const pos = [0, h, 0];
      const idx = [];
      for (let i = 0; i < 6; i++) {
        const a0 = (i / 6) * Math.PI * 2 + Math.PI / 6;
        const a1 = ((i + 0.5) / 6) * Math.PI * 2 + Math.PI / 6;
        pos.push(Math.cos(a0) * R, lip, Math.sin(a0) * R);
        pos.push(Math.cos(a1) * R * 0.955, 0, Math.sin(a1) * R * 0.955);
      }
      for (let i = 0; i < 6; i++) {
        const c1 = 1 + i * 2, mid = 2 + i * 2, c2 = 1 + ((i + 1) % 6) * 2;
        idx.push(0, c1, mid, 0, mid, c2);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      return geo;
    }

    function buildPavilion(x, z) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      const R = 2.7;       // 柱心六边形半径
      const H = 3.4;       // 檐口高度

      // 台基
      const base = cyl(3.05, 3.2, 0.42, 6, MAT.stone, 0, 0.21, 0);
      base.rotation.y = Math.PI / 6;
      g.add(base);
      const step = box(1.5, 0.16, 0.5, MAT.stone, 0, 0.08, 3.0);
      g.add(step);

      // 六柱
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
        const cx = Math.cos(a) * R, cz = Math.sin(a) * R;
        const col = cyl(0.13, 0.15, H, 10, MAT.wood, cx, 0.42 + H / 2, cz);
        g.add(col);
        // 柱础
        const bs = cyl(0.2, 0.22, 0.14, 10, MAT.stone, cx, 0.49, cz);
        g.add(bs);
        // 坐凳栏杆（柱间矮栏）
        const a2 = ((i + 1) / 6) * Math.PI * 2 + Math.PI / 6;
        const nx = Math.cos(a2) * R, nz = Math.sin(a2) * R;
        if (i !== 2) {   // 留一面做入口
          const mx = (cx + nx) / 2, mz = (cz + nz) / 2;
          const len = Math.hypot(nx - cx, nz - cz);
          const ang = Math.atan2(nz - cz, nx - cx);
          const rail = box(len * 0.92, 0.1, 0.16, MAT.wood, mx, 0.95, mz, -ang);
          g.add(rail);
          const rail2 = box(len * 0.92, 0.08, 0.1, MAT.wood, mx, 0.62, mz, -ang);
          g.add(rail2);
        }
      }

      // 檐枋：一圈六边形梁
      const beam = cyl(2.62, 2.62, 0.2, 6, MAT.woodDark, 0, 0.42 + H - 0.1, 0);
      beam.rotation.y = Math.PI / 6;
      g.add(beam);

      // 屋顶
      const roof = new THREE.Mesh(hexRoof(3.5, 2.15, 0.5), matTileTex);
      roof.position.y = 0.42 + H + 0.1;
      roof.castShadow = true;
      roof.userData = { ...SPOTS.find((s) => s.id === 'ting'), kind: 'spot', key: 'ting' };
      g.add(roof);
      // 檐口薄板，遮住屋顶下沿的锯齿
      const eave = cyl(3.56, 3.5, 0.06, 6, MAT.tileDark, 0, 0.42 + H + 0.1, 0);
      eave.rotation.y = Math.PI / 6;
      g.add(eave);

      // 宝顶
      const knob = cyl(0.09, 0.3, 0.36, 10, MAT.tileDark, 0, 0.42 + H + 2.15 + 0.16, 0);
      g.add(knob);
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 10), MAT.tileDark);
      ball.position.y = 0.42 + H + 2.15 + 0.44;
      ball.castShadow = true;
      g.add(ball);

      // 匾额
      const pl = box(1.25, 0.34, 0.07, std(0x33261d, { rough: 0.6 }), 0, 0.42 + H - 0.34, R - 0.06);
      g.add(pl);
      const plEdge = box(1.36, 0.42, 0.04, std(0xb08b46, { rough: 0.45, metal: 0.35 }), 0, 0.42 + H - 0.34, R - 0.1);
      g.add(plEdge);

      // 亭中石桌石凳
      const table = cyl(0.62, 0.58, 0.12, 16, MAT.stone, 0, 1.02, 0);
      g.add(table);
      g.add(cyl(0.16, 0.2, 0.6, 10, MAT.stone, 0, 0.72, 0));
      [[0.95, 0], [-0.48, 0.82], [-0.48, -0.82]].forEach(([dx, dz]) => {
        g.add(cyl(0.24, 0.26, 0.34, 12, MAT.stone, dx, 0.17, dz));
      });

      scene.add(g);
      return g;
    }
    const pavilion = buildPavilion(11.6, -7.6);

    /* ==================================================================
       建筑：厅堂（远香堂）——硬山顶，四面长窗
       ================================================================== */
    function gableRoof(w, d, hLow, hHigh, mat) {
      const g = new THREE.Group();
      const half = d / 2;
      const rise = hHigh - hLow;
      const slopeLen = Math.hypot(half, rise);
      const ang = Math.atan2(rise, half);
      // 两坡
      [1, -1].forEach((s) => {
        const slab = box(w, 0.16, slopeLen, mat, 0, (hLow + hHigh) / 2, s * half / 2);
        slab.rotation.x = -s * ang;
        g.add(slab);
      });
      // 屋脊
      g.add(box(w + 0.24, 0.24, 0.4, MAT.tileDark, 0, hHigh + 0.06, 0));
      // 两端山墙（三角）
      [1, -1].forEach((s) => {
        const shape = new THREE.Shape();
        shape.moveTo(-half, 0);
        shape.lineTo(half, 0);
        shape.lineTo(0, rise);
        shape.closePath();
        const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.18, bevelEnabled: false });
        geo.translate(0, 0, -0.09);
        const m = new THREE.Mesh(geo, MAT.wall);
        m.rotation.y = s * Math.PI / 2;
        m.position.set(s * (w / 2 + 0.09), hLow, 0);
        m.castShadow = true;
        g.add(m);
      });
      return g;
    }

    function buildHall(x, z) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      const W = 9.8, D = 5.6, H = 4.0;

      // 台基
      g.add(box(W + 0.9, 0.55, D + 0.9, MAT.stone, 0, 0.275, 0));
      g.add(box(W + 1.6, 0.16, 1.0, MAT.stone, 0, 0.08, D / 2 + 1.0));

      // 柱（四角 + 前后各两根）
      const colXs = [-W / 2 + 0.35, -W / 6, W / 6, W / 2 - 0.35];
      colXs.forEach((cx) => {
        [D / 2 - 0.3, -D / 2 + 0.3].forEach((cz) => {
          g.add(cyl(0.15, 0.17, H, 10, MAT.wood, cx, 0.55 + H / 2, cz));
        });
      });

      // 三面白墙（后墙 + 两山墙），正面敞开做长窗
      g.add(box(W, H, 0.24, MAT.wall, 0, 0.55 + H / 2, -D / 2 + 0.18));
      [-1, 1].forEach((s) => {
        g.add(box(0.24, H, D, MAT.wall, s * (W / 2 - 0.12), 0.55 + H / 2, 0));
      });

      // 正面落地长窗：木框 + 细格
      const frame = box(W - 0.5, H - 0.3, 0.1, MAT.woodDark, 0, 0.55 + H / 2, D / 2 - 0.16);
      g.add(frame);
      const glass = box(W - 1.2, H - 0.9, 0.04, std(0xcdbfa0, { rough: 0.4, transparent: true, opacity: 0.32 }), 0, 0.55 + H / 2, D / 2 - 0.1);
      g.add(glass);
      for (let i = 0; i < 9; i++) {
        const px = -W / 2 + 0.7 + i * ((W - 1.4) / 8);
        g.add(box(0.05, H - 0.85, 0.06, MAT.wood, px, 0.55 + H / 2, D / 2 - 0.12));
      }
      for (let i = 0; i < 4; i++) {
        const py = 0.75 + i * ((H - 0.9) / 3);
        g.add(box(W - 1.3, 0.045, 0.06, MAT.wood, 0, py, D / 2 - 0.12));
      }

      // 屋顶
      const roof = gableRoof(W + 1.3, D + 1.3, 0.55 + H, 0.55 + H + 1.55, matTileTex);
      roof.position.z = 0;
      g.add(roof);

      // 匾额
      const plaque = box(1.7, 0.44, 0.08, std(0x3a2c22, { rough: 0.6 }), 0, 0.55 + H + 0.02, D / 2 + 0.02);
      g.add(plaque);
      const plaqueEdge = box(1.82, 0.54, 0.05, std(0xa8863f, { rough: 0.45, metal: 0.4 }), 0, 0.55 + H + 0.02, D / 2 - 0.01);
      g.add(plaqueEdge);

      scene.add(g);
      return g;
    }
    const hall = buildHall(-11.2, -9.6);
    hall.rotation.y = 0;

    /* ==================================================================
       建筑：水榭（芙蓉榭）——平台挑出水面
       ================================================================== */
    function buildXie(x, z) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      const W = 6.4, D = 5.0, H = 3.3;

      // 台基：一半在岸，一半挑水
      g.add(box(W + 0.8, 0.5, D + 0.8, MAT.stone, 0, 0.25, 0));
      // 临水侧的栏杆
      g.add(box(W + 0.6, 0.09, 0.12, MAT.wood, 0, 1.02, D / 2 + 0.32));
      for (let i = 0; i < 8; i++) {
        g.add(box(0.09, 0.5, 0.09, MAT.wood, -W / 2 + i * (W / 7), 0.76, D / 2 + 0.32));
      }

      // 四柱
      [[-W / 2 + 0.3, D / 2 - 0.3], [W / 2 - 0.3, D / 2 - 0.3], [-W / 2 + 0.3, -D / 2 + 0.3], [W / 2 - 0.3, -D / 2 + 0.3]]
        .forEach(([cx, cz]) => {
          g.add(cyl(0.13, 0.15, H, 10, MAT.wood, cx, 0.5 + H / 2, cz));
        });

      // 后墙（北）与两侧短墙
      g.add(box(W, H, 0.22, MAT.wall, 0, 0.5 + H / 2, -D / 2 + 0.11));
      [-1, 1].forEach((s) => {
        g.add(box(0.22, H, D * 0.6, MAT.wall, s * (W / 2 - 0.11), 0.5 + H / 2, -D * 0.2));
      });

      // 屋顶
      const roof = gableRoof(W + 1.1, D + 1.1, 0.5 + H, 0.5 + H + 0.92, matTileTex);
      g.add(roof);

      // 匾额
      g.add(box(1.3, 0.34, 0.07, std(0x3a2c22, { rough: 0.6 }), 0, 0.5 + H - 0.02, D / 2 + 0.01));

      scene.add(g);
      return g;
    }
    const xie = buildXie(8.8, 8.4);

    /* ==================================================================
       建筑：舫（香洲）——旱船，前端尖
       ================================================================== */
    function buildBoat(x, z, rot) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.rotation.y = rot || 0;

      // 船体：前尖后方
      const s = new THREE.Shape();
      s.moveTo(0, 3.9);
      s.quadraticCurveTo(1.25, 2.4, 1.35, -0.4);
      s.lineTo(1.35, -3.2);
      s.quadraticCurveTo(1.2, -3.7, 0, -3.7);
      s.quadraticCurveTo(-1.2, -3.7, -1.35, -3.2);
      s.lineTo(-1.35, -0.4);
      s.quadraticCurveTo(-1.25, 2.4, 0, 3.9);
      const hullGeo = new THREE.ExtrudeGeometry(s, { depth: 0.85, bevelEnabled: false, curveSegments: 18 });
      hullGeo.rotateX(-Math.PI / 2);
      const hull = new THREE.Mesh(hullGeo, std(0x8a7d68, { rough: 0.92 }));
      hull.position.y = 0.06;
      hull.castShadow = true;
      hull.receiveShadow = true;
      g.add(hull);
      // 甲板
      const deck = new THREE.Mesh(new THREE.ShapeGeometry(s, 20), MAT.woodLight);
      deck.rotation.x = -Math.PI / 2;
      deck.position.y = 0.93;
      g.add(deck);

      // 中舱：四柱小亭
      [[-1.1, 1.6], [1.1, 1.6], [-1.1, -0.6], [1.1, -0.6]].forEach(([cx, cz]) => {
        g.add(cyl(0.1, 0.11, 2.05, 8, MAT.wood, cx, 1.96, cz));
      });
      g.add(box(2.9, 2.1, 2.5, std(0xcdbfa2, { rough: 0.5, transparent: true, opacity: 0.18 }), 0, 1.98, 0.5));
      const cabinRoof = gableRoof(3.4, 3.0, 2.96, 3.56, matTileTex);
      cabinRoof.position.set(0, 0, 0.5);
      g.add(cabinRoof);

      // 尾楼：两层
      g.add(box(2.7, 2.0, 1.9, MAT.wall, 0, 1.94, -2.6));
      const tailRoof = gableRoof(3.1, 2.3, 2.96, 3.4, matTileTex);
      tailRoof.position.set(0, 0, -2.6);
      g.add(tailRoof);
      // 栏杆
      g.add(box(2.9, 0.08, 0.1, MAT.wood, 0, 1.64, -1.62));

      // 船头石阶
      g.add(box(1.7, 0.16, 0.6, MAT.stone, 0, 0.92, 3.5));

      scene.add(g);
      return g;
    }
    const boat = buildBoat(-12.6, 4.2, Math.PI / 2);

    /* ==================================================================
       建筑：游廊——L 形，单坡顶，柱间坐凳
       ================================================================== */
    function buildCorridor(points) {
      const g = new THREE.Group();
      const H = 2.85;
      for (let seg = 0; seg < points.length - 1; seg++) {
        const a = points[seg], b = points[seg + 1];
        const dx = b[0] - a[0], dz = b[1] - a[1];
        const len = Math.hypot(dx, dz);
        const ang = Math.atan2(dz, dx);
        const n = Math.max(2, Math.round(len / 2.3));
        const midX = (a[0] + b[0]) / 2, midZ = (a[1] + b[1]) / 2;

        // 内外两排柱子，屋顶才有支撑
        const nx = Math.sin(-ang), nz = Math.cos(-ang);
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          const px = a[0] + dx * t, pz = a[1] + dz * t;
          g.add(cyl(0.1, 0.12, H, 8, MAT.wood, px, H / 2, pz));
          g.add(cyl(0.09, 0.1, H * 0.92, 8, MAT.wood, px + nx * 1.25, H * 0.46, pz + nz * 1.25));
        }
        // 柱顶檐枋
        const beam = box(len + 0.3, 0.16, 1.55, MAT.woodDark, midX, H + 0.02, midZ, -ang);
        g.add(beam);
        // 屋顶：单坡，靠墙一侧高
        const roof = box(len + 0.4, 0.12, 1.6, matTileTex, midX, H + 0.22, midZ, -ang);
        roof.rotation.z = 0.12;
        g.add(roof);
        // 檐口
        const eave = box(len + 0.4, 0.08, 0.12, MAT.tileDark, midX, H + 0.05, midZ, -ang);
        eave.position.x += Math.sin(-ang) * 0.7;
        eave.position.z += Math.cos(-ang) * 0.7;
        g.add(eave);
        // 坐凳栏杆（外侧）
        const bench = box(len + 0.2, 0.1, 0.16, MAT.wood, midX, 0.86, midZ, -ang);
        bench.position.x += Math.sin(-ang) * 0.55;
        bench.position.z += Math.cos(-ang) * 0.55;
        g.add(bench);
      }
      scene.add(g);
      return g;
    }

    /* ==================================================================
       叠山：太湖石假山（瘦皱漏透）
       ================================================================== */
    function buildRockery(cx, cz) {
      const g = new THREE.Group();
      g.position.set(cx, 0, cz);
      // [dx, dz, 高, 半径, 纵深, 旋转]
      const blocks = [
        [0, 0, 2.3, 1.5, 1.25, 0.2],
        [-1.5, 0.7, 1.55, 1.05, 0.9, 1.1],
        [1.45, 0.5, 1.8, 1.0, 0.85, 2.4],
        [0.35, -0.9, 1.2, 0.95, 0.8, 0.7],
        [-0.7, -0.6, 2.85, 0.85, 0.7, 1.9],
        [0.9, 1.4, 0.85, 0.8, 0.7, 0.4],
      ];
      blocks.forEach(([dx, dz, h, rx, rz, rot], i) => {
        const m = new THREE.Mesh(
          rockGeo(rx, h, rz, { seed: 11.3 + i * 5.1, noise: 0.30, seg: 18, seg2: 13 }),
          i % 3 === 0 ? MAT.stoneDark : MAT.stone
        );
        m.position.set(dx, h * 0.72, dz);
        m.rotation.y = rot;
        m.castShadow = true;
        m.receiveShadow = true;
        g.add(m);
      });
      // 山脚碎石
      for (let i = 0; i < 9; i++) {
        const a = Math.random() * 6.283;
        const r = 1.6 + Math.random() * 1.1;
        const s = 0.3 + Math.random() * 0.34;
        const m = new THREE.Mesh(rockGeo(s * 1.3, s * 0.8, s, { seed: 40 + i, noise: 0.28, seg: 9, seg2: 7 }), MAT.stone);
        m.position.set(Math.cos(a) * r, s * 0.5, Math.sin(a) * r * 0.8);
        m.rotation.y = a;
        m.castShadow = true;
        g.add(m);
      }
      scene.add(g);
      return g;
    }
    const rockery = buildRockery(-5.6, -8.2);

    /* ==================================================================
       曲桥：低平贴水，折线三折
       ================================================================== */
    function buildBridge(pts) {
      const g = new THREE.Group();
      const Y = 0.16;
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const dx = b[0] - a[0], dz = b[1] - a[1];
        const len = Math.hypot(dx, dz);
        const ang = Math.atan2(dz, dx);
        const mx = (a[0] + b[0]) / 2, mz = (a[1] + b[1]) / 2;
        const deck = box(len + 0.3, 0.14, 1.5, MAT.stone, mx, Y, mz, -ang);
        g.add(deck);
        // 低栏（两根矮柱 + 横杆）
        [-1, 1].forEach((s) => {
          const off = 0.66 * s;
          const px = mx + Math.sin(-ang) * off, pz = mz + Math.cos(-ang) * off;
          const rail = box(len, 0.07, 0.09, MAT.stoneDark, px, Y + 0.34, pz, -ang);
          g.add(rail);
          for (let k = 0; k <= 2; k++) {
            const tt = k / 2;
            const bx = a[0] + dx * tt + Math.sin(-ang) * off;
            const bz = a[1] + dz * tt + Math.cos(-ang) * off;
            g.add(box(0.09, 0.36, 0.09, MAT.stoneDark, bx, Y + 0.18, bz));
          }
        });
        // 桥墩
        const pier = cyl(0.16, 0.18, 1.4, 8, MAT.stoneDark, mx, Y - 0.7, mz);
        g.add(pier);
      }
      scene.add(g);
      return g;
    }
    const bridge = buildBridge([[-8.8, 0.6], [-4.6, 1.9], [-0.6, 0.9], [3.4, 2.4], [6.2, 3.9]]);

    /* ==================================================================
       植物：松、竹、柳、荷、芭蕉
       ================================================================== */
    function makePine(x, z, s) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.scale.setScalar(s || 1);
      // 虬曲主干
      const trunkPts = [P(0, 0, 0), P(0.22, 1.1, 0.1), P(-0.12, 2.1, -0.15), P(0.28, 3.0, 0.12), P(0.05, 3.7, 0)];
      g.add(sweep(trunkPts, (t) => lerp(0.27, 0.09, t), { tubular: 26, radial: 7, mat: MAT.trunk }));
      // 侧枝
      g.add(sweep([P(0.18, 2.0, 0), P(-0.9, 2.5, 0.3), P(-1.6, 2.75, 0.2)], (t) => lerp(0.12, 0.05, t), { tubular: 16, radial: 6, mat: MAT.trunk }));
      g.add(sweep([P(0.1, 2.7, 0), P(0.95, 3.05, -0.2), P(1.55, 3.2, -0.35)], (t) => lerp(0.1, 0.04, t), { tubular: 16, radial: 6, mat: MAT.trunk }));
      // 树冠：扁平的松针团
      const pads = [
        [0.0, 3.9, 0.0, 1.15, 0.34],
        [-1.5, 2.95, 0.15, 0.86, 0.26],
        [1.5, 3.35, -0.3, 0.78, 0.24],
        [0.35, 3.35, 0.72, 0.7, 0.22],
      ];
      pads.forEach(([px, py, pz, r, h], i) => {
        const m = new THREE.Mesh(rockGeo(r, h, r * 0.92, { seed: 70 + i * 3.3, noise: 0.24, seg: 12, seg2: 9 }), i % 2 ? MAT.leafDark : MAT.leafMid);
        m.position.set(px, py, pz);
        m.castShadow = true;
        g.add(m);
      });
      g.userData = { ...PLANTS.find((p) => p.id === 'song'), kind: 'plant', key: 'song' };
      scene.add(g);
      return g;
    }

    function makeBamboo(x, z, count, spread) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      const leafGeo = new THREE.ConeGeometry(0.07, 0.62, 4);
      for (let i = 0; i < count; i++) {
        const a = Math.random() * 6.283;
        const r = Math.random() * (spread || 1.6);
        const px = Math.cos(a) * r, pz = Math.sin(a) * r * 0.8;
        const h = 4.2 + Math.random() * 2.6;
        const lean = (Math.random() - 0.5) * 0.22;
        const stem = cyl(0.038, 0.055, h, 6, MAT.bambooStem, px, h / 2, pz);
        stem.rotation.z = lean;
        g.add(stem);
        // 竹节
        for (let k = 1; k < 5; k++) {
          const ny = (h / 5) * k;
          const ring = cyl(0.058, 0.058, 0.03, 6, MAT.leafDark, px + lean * (ny - h / 2) * 0.0, ny, pz);
          g.add(ring);
        }
        // 叶：顶部几片
        for (let k = 0; k < 5; k++) {
          const leaf = new THREE.Mesh(leafGeo, k % 2 ? MAT.bamboo : MAT.leafMid);
          leaf.position.set(px + (Math.random() - 0.5) * 0.7, h - 0.1 + Math.random() * 0.5, pz + (Math.random() - 0.5) * 0.7);
          leaf.rotation.set(Math.PI * 0.5 + (Math.random() - 0.5) * 0.5, Math.random() * 6.28, (Math.random() - 0.5) * 0.8);
          leaf.castShadow = true;
          g.add(leaf);
        }
      }
      g.userData = { ...PLANTS.find((p) => p.id === 'zhu'), kind: 'plant', key: 'zhu' };
      scene.add(g);
      return g;
    }

    function makeWillow(x, z, s) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.scale.setScalar(s || 1);
      const trunkPts = [P(0, 0, 0), P(0.18, 1.3, 0.12), P(-0.1, 2.4, -0.1), P(0.2, 3.2, 0.05)];
      g.add(sweep(trunkPts, (t) => lerp(0.24, 0.1, t), { tubular: 22, radial: 7, mat: MAT.trunk }));
      // 下垂枝条
      const twigGeo = new THREE.ConeGeometry(0.055, 1.5, 4);
      for (let i = 0; i < 16; i++) {
        const a = Math.random() * 6.283;
        const r = 0.5 + Math.random() * 1.5;
        const topY = 2.9 + Math.random() * 0.7;
        const px = Math.cos(a) * r, pz = Math.sin(a) * r;
        const pts = [
          P(0.1, topY, 0),
          P(px * 0.5, topY + 0.15, pz * 0.5),
          P(px, topY - 0.5, pz),
          P(px * 1.06, topY - 1.7, pz * 1.06),
        ];
        g.add(sweep(pts, (t) => lerp(0.05, 0.018, t), { tubular: 12, radial: 4, mat: MAT.leafMid }));

        for (let k = 0; k < 3; k++) {

    function makeLotus() {

    /* ==================================================================
       标签避让
       ================================================================== */
    function layoutLabels() {
      if ((labelTick++ % 2) !== 0) return;
      const items = [];
      labelObjs.forEach((o) => {
        const el = o.userData.inner;
        if (!el || parseFloat(el.style.opacity || '1') < 0.3) return;
        o.getWorldPosition(labelV);
        labelV.project(camera);
        if (labelV.z > 1) return;
        const x = (labelV.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-labelV.y * 0.5 + 0.5) * window.innerHeight;
        const w = el.offsetWidth || 56;
        const h = el.offsetHeight || 18;
        items.push({ el, sx: x - w / 2, sy: y - h / 2, w, h });
      });
      items.sort((a, b) => a.sy - b.sy);
      const placed = [];
      items.forEach((it) => {
        let shift = 0;
        for (let k = 0; k < 8; k++) {
          const box = { x1: it.sx, y1: it.sy + shift, x2: it.sx + it.w, y2: it.sy + it.h + shift };
          const hit = placed.some((p) => !(box.x2 < p.x1 || box.x1 > p.x2 || box.y2 < p.y1 || box.y1 > p.y2));
          if (!hit) { placed.push(box); break; }
          shift += it.h + 3;
        }
        it.el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
      });
    }

    /* ==================================================================
       动画
       ================================================================== */
    let elapsed = 0;
    const willowGroups = [willow, willow2];
    const bambooGroups = [bamboo, bamboo2];

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (isPlaying) {
        elapsed += dt;
        waterMat.uniforms.uTime.value = elapsed;
        // 柳条与竹丛随风轻摆
        willowGroups.forEach((g, i) => {
          if (!g) return;
          g.rotation.z = Math.sin(elapsed * 0.7 + i) * 0.012;
          g.rotation.x = Math.cos(elapsed * 0.55 + i) * 0.008;
        });
        bambooGroups.forEach((g, i) => {
          if (!g) return;
          g.rotation.z = Math.sin(elapsed * 0.9 + i * 2) * 0.008;
        });
      }
      fly.update(dt);
      controls.update();
      layoutLabels();
      labelRenderer.render(scene, camera);
      if (composer) composer.render();
      else renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    /* ==================================================================
       启动
       ================================================================== */
    setView('overview');
    document.getElementById('loader').classList.add('is-done');
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
