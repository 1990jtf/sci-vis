  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 讲解文案（卡片 / 语音共用一份） --------- */
    // 优先用 info.say（写给"耳朵"的口语讲解），没有时用结构化字段拼一句
    function narrate(info) {
      if (!info) return '';
      if (info.say) return info.say;
      const parts = [info.name + '。'];
      if (info.type) parts.push(info.type + '。');
      if (info.stats && info.stats.length) {
        parts.push(info.stats.map((s) => s.label + '，' + s.value).join('。') + '。');
      }
      if (info.desc && info.desc.length) parts.push(info.desc.join('。'));
      return parts.join('').replace(/。{2,}/g, '。');
    }
    
    /* ---------------- 语音（神经语音包优先，浏览器语音兜底） ---------------- */
    /**
     * 两级语音方案：
     *   1) 预生成的神经语音包（edge-tts 晓晓 / 云希等）—— 音质接近真人，
     *      文件命名 v_<id>.mp3，放在 audioBase 目录下，离线可用、无密钥。
     *   2) 浏览器 speechSynthesis —— 语音包里没有这句时兜底，并做了音色排序
     *      （优先云端自然音 / 增强音色）与按句切分，比直接取第一个中文音色自然得多。
     *
     * 用法：const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
     *       voice.speak(S.narrate(data), data.voiceId);
     */
    function createVoice(opts) {
      opts = opts || {};
      const audioBase = opts.audioBase || null;   // 语音包目录，留空则纯浏览器语音
      const synth = window.speechSynthesis || null;
      let enabled = true;
      let zhVoice = null;
      let audioEl = null;
      let seq = 0;                                 // 打断计数：切天体时丢弃旧队列
      const missing = Object.create(null);         // 语音包里不存在的 id，只探测一次
    
      /* --- 音色挑选：给候选中文音色打分，取最自然的一个 --- */
      function score(v) {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        let s = 0;
        if (/xiaoxiao|xiaoyi|yunxi|yunjian|晓晓|云希|云扬/.test(name)) s += 60;
        if (/natural|neural|premium|enhanced|自然/.test(name)) s += 40;
        if (/google/.test(name)) s += 32;                 // Chrome 云端音，韵律较自然
        if (/ting-?ting|tingting|meijia|sinji|婷婷|美佳|善怡|美嘉/.test(name)) s += 24;
        if (/^zh[-_]?cn|cmn|^zh$/.test(lang)) s += 18;
        if (/^zh[-_]?(hk|tw)|yue/.test(lang)) s -= 14;    // 粤语 / 台湾腔，普通话场景降权
        if (v.localService) s += 6;                       // 本地音：断网也能用
        return s;
      }
      function pick() {
        if (!synth || !synth.getVoices) return;
        const all = synth.getVoices() || [];
        const zh = all.filter((v) => /^zh|cmn|yue/i.test(v.lang || ''));
        if (!zh.length) return;
        zhVoice = zh.slice().sort((a, b) => score(b) - score(a))[0] || null;
      }
      if (synth) {
        pick();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', pick);
      }
    
      /* --- 兜底：浏览器语音，按句切开逐句念，停顿更自然 --- */
      function chunk(text) {
        const parts = String(text).replace(/\s+/g, '').match(/[^。！？；!?]+[。！？；!?]?/g) || [];
        const out = [];
        let buf = '';
        parts.forEach((p) => {
          if (buf && (buf + p).length > 46) { out.push(buf); buf = p; }
          else buf += p;
        });
        if (buf) out.push(buf);
        return out.length ? out : [String(text)];
      }
      function speakTTS(text) {
        if (!synth || !text) return;
        const mySeq = ++seq;
        const chunks = chunk(text);
        let i = 0;
        const next = () => {
          if (!enabled || mySeq !== seq || i >= chunks.length) return;
          const u = new SpeechSynthesisUtterance(chunks[i++]);
          u.lang = 'zh-CN';
          u.rate = 0.98;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (!zhVoice) pick();
          if (zhVoice) u.voice = zhVoice;
          u.onend = () => setTimeout(next, 90);
          u.onerror = () => {};
          synth.speak(u);
        };
        // Chrome 在 cancel() 之后立刻 speak() 偶发静音，等一小会儿再开口
        setTimeout(next, 60);
      }
    
      /* --- 首选：播放语音包 --- */
      function playPack(id, text) {
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.preload = 'auto';
        }
        const el = audioEl;
        let done = false;
        const fallback = () => {
          if (done) return;
          done = true;
          missing[id] = true;
          speakTTS(text);
        };
        el.onerror = fallback;
        el.onplaying = () => { el.onerror = null; };
        el.src = audioBase + 'v_' + id + '.mp3';
        const p = el.play();
        if (p && p.catch) p.catch(fallback);
      }
    
      function speak(text, id) {
        if (!enabled || !text) return;
        if (id && audioBase && !missing[id]) {
          seq++;                      // 打断上一句（浏览器语音队列）
          if (synth) synth.cancel();
          playPack(id, text);
          return;
        }
        if (audioEl) audioEl.pause();
        if (synth) synth.cancel();
        speakTTS(text);
      }
      function stop() {
        seq++;
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        if (synth) synth.cancel();
      }
      function toggle() {
        enabled = !enabled;
        if (!enabled) stop();
        return enabled;
      }
      return { speak, stop, toggle, isEnabled: () => enabled, hasPack: !!audioBase };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      // 页面里已有 .sv-card 容器时直接复用，避免套娃出两层透明卡片
      const host = container && container.nodeType === 1 ? container : document.body;
      let el;
      if (host.classList && host.classList.contains('sv-card')) {
        el = host;
      } else {
        el = document.createElement('div');
        el.className = 'sv-card';
        host.appendChild(el);
      }
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            // 兼容两种写法：[label, value] 数组 或 { label, value } 对象
            const label = Array.isArray(s) ? s[0] : s.label;
            const value = Array.isArray(s) ? s[1] : s.value;
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span></span><b></b>';
            row.querySelector('span').textContent = label == null ? '' : label;
            row.querySelector('b').textContent = value == null ? '' : value;
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        if (data.facts && data.facts.length) {
          data.facts.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__fact';
            row.innerHTML = '<i>\uD83D\uDCA1</i><span></span>';
            row.querySelector('span').textContent = line;
            body.appendChild(row);
          });
        }
        el.classList.add('is-open');
      }
      function hide() { el.classList.remove('is-open'); }
      close.addEventListener('click', hide);
      return { element: el, show, hide };
    }
    
    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      // targets 可以是数组，也可以是返回数组的函数（换场景后数组会被整体替换）
      const resolve = (targets) => (typeof targets === 'function' ? targets() : targets) || [];
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const list = resolve(targets);
        const hits = raycaster.intersectObjects(list, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          const th = u * Math.PI * 2;
          const nx = Math.cos(th) * 3, ny = Math.sin(th) * 3;
          const n = fbm2(nx + 1.7, v * 5 - ny * 0.4, 5);
          const n2 = fbm2(nx * 2.3 + 9.1, v * 7 + 3.3, 4);
          let t = clamp(n * 0.7 + n2 * 0.3, 0, 1);
          const col = sampleBands(bands, t);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function sampleBands(bands, t) {
      const seg = 1 / (bands.length - 1);
      const idx = Math.min(Math.floor(t / seg), bands.length - 2);
      const local = (t - idx * seg) / seg;
      return bands[idx].clone().lerp(bands[idx + 1], local);
    }
    
    // 恐龙皮肤纹理（鳞片噪声 + 色斑 + 腹部渐变）
    function skinTexture(baseColor, spotColor, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const base = new THREE.Color(baseColor);
      const spot = new THREE.Color(spotColor);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          // 鳞片：高频网格噪声
          const scale = fbm2(u * 18, v * 18, 4);
          const scale2 = fbm2(u * 40 + 3, v * 40 + 7, 3);
          // 色斑：低频大块斑纹
          const spotN = fbm2(u * 6 + 11, v * 6 - 5, 4);
          let col = base.clone();
          col.lerp(spot, S.clamp((spotN - 0.42) * 3.0, 0, 1) * 0.5);
          // 鳞片刻痕（微亮/微暗）
          const sheen = (scale2 - 0.5) * 0.16 + (scale - 0.5) * 0.08;
          col.r = S.clamp(col.r + sheen, 0, 1);
          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    
    /* ---------------- 星空（分层 + 大小/亮度变化） --------- */
    function createStarfield(count, radius, color1, color2) {
      count = count || 1400;
      radius = radius || 240;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c1 = new THREE.Color(color1 || 0xffffff);
      const c2 = new THREE.Color(color2 || 0xaac4ff);
      for (let i = 0; i < count; i++) {
        const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1)
          .normalize().multiplyScalar(radius);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
        const c = c1.clone().lerp(c2, Math.random());
        const b = 0.4 + Math.random() * 0.6;
        col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.5, vertexColors: true, transparent: true, opacity: 0.85,
        sizeAttenuation: true, depthWrite: false,
      });
      return new THREE.Points(geo, mat);
    }

      div.textContent = text;
      const obj = new CSS2DObject(div);
      if (position) obj.position.copy(position);
      return obj;
    }

      if (!el) {
        el = document.createElement('div');
        el.className = 'sv-toast';
        document.body.appendChild(el);
      }
      el.textContent = text;
      el.classList.add('is-open');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('is-open'), ms || 2200);
    }

      if (!btn) return;

    const scene = new THREE.Scene();

    const P = (x, y, z) => new THREE.Vector3(x, y, z);
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const lerp = (a, b, t) => a + (b - a) * t;

    /* ==================================================================
       地形：一座有雪山、森林、湖泊、河流的岛
       ================================================================== */
    const ISLAND_R = 33;
    const LAKE = { x: 5.5, z: 6.6, r: 3.3 };
    const SEA_Y = 0;

    // 河道折线（雪山 → 湖 → 出湖 → 入海），地形会沿它下切出河谷
    const RIVER = [
      [-3.6, -3.2], [-2.4, -2.4], [-1.0, -1.4], [0.6, -0.2], [2.2, 1.2],
      [3.6, 2.8], [4.8, 4.6],
      [5.4, 6.4], [6.1, 8.4], [6.5, 10.2], [6.0, 11.6], [5.2, 12.6],
    ];

    function segDist(px, pz, ax, az, bx, bz) {
      const vx = bx - ax, vz = bz - az;
      const wx = px - ax, wz = pz - az;
      const t = clamp((wx * vx + wz * vz) / (vx * vx + vz * vz || 1), 0, 1);
      return Math.hypot(px - (ax + vx * t), pz - (az + vz * t));
    }
    function riverDist(x, z) {
      let d = 1e9;
      for (let i = 0; i < RIVER.length - 1; i++) {
        const d2 = segDist(x, z, RIVER[i][0], RIVER[i][1], RIVER[i + 1][0], RIVER[i + 1][1]);
        if (d2 < d) d = d2;
      }
      return d;
    }

    function landMask(x, z) {
      const ang = Math.atan2(z, x);
      // 沿角度调制的海岸线：做出岬角、海湾，不再是一个圆
      const angNoise = (S.fbm2(Math.cos(ang) * 2.6 + 7.2, Math.sin(ang) * 2.6 - 3.4, 3) - 0.5) * 8.0;
      const r = Math.hypot(x * 1.02, z * 1.18);
      const edge = 20.0 + angNoise + (S.fbm2(x * 0.11 + 31.7, z * 0.11 + 17.3, 3) - 0.5) * 5.5;
      let m = 1 - clamp((r - edge * 0.62) / (edge * 0.58), 0, 1);
      return Math.pow(clamp(m, 0, 1), 1.05);
    }

    function heightAt(x, z) {
      const m = landMask(x, z);
      const g = (cx, cz, h, s) => h * Math.exp(-((x - cx) * (x - cx) + (z - cz) * (z - cz)) / (2 * s * s));
      // 主峰 + 两座次峰，构成一条西北—东南走向的山脊
      const mount = g(-7.2, -6.2, 11.6, 4.2) + g(-2.4, -10.6, 7.2, 3.4) + g(-13.0, -3.4, 6.8, 3.2);
      const ridge = 2.2 * Math.exp(-Math.pow((x * 0.46 - z * 0.52 + 3.2) / 6.4, 2));
      const rough = (S.fbm2(x * 0.33 + 3.1, z * 0.33 - 8.4, 4) - 0.5) * 3.4;
      // 山腰以上加一层岩石棱角，山不是一个光滑的馒头
      const crag = (S.fbm2(x * 0.62 + 11.4, z * 0.62 + 3.7, 3) - 0.5) * 2.0 * clamp((mount - 2.6) / 5.0, 0, 1);

      // 河床 / 湖盆范围内把噪声压平，水面才贴得住
      const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
      const rd = riverDist(x, z);
      const lakeW = Math.exp(-Math.pow(dl / (LAKE.r * 0.78), 2));
      const riverW = Math.exp(-Math.pow(rd / 1.3, 2));
      const flatten = 1 - clamp(lakeW * 0.85 + riverW * 0.7, 0, 0.92);

      let h = m * (1.15 + mount + ridge + crag + rough * (0.45 + 0.55 * m) * flatten);

      // 湖盆
      h -= lakeW * 2.6 * m;
      // 河谷
      h -= riverW * 1.75 * m * (1 - lakeW * 0.88);

      // 海岸：先压成缓滩，再向海床快速下沉，避免出现“蛋糕边”
      const shore = Math.pow(1 - m, 1.6);
      h = h * m - shore * 6.0 + (1 - m) * 0.5;
      return h;
    }

    /* ---- 地形网格 + 顶点色（深海→沙滩→草地→岩石→积雪） ---- */
    const TERRAIN_SIZE = 74;
    const SEGS = 150;
    const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, SEGS, SEGS);
    terrainGeo.rotateX(-Math.PI / 2);
    const tpos = terrainGeo.attributes.position.array;
    const tcol = new Float32Array(tpos.length);

    const C_DEEP = new THREE.Color(0x07293c);
    const C_SHALLOW = new THREE.Color(0x2a8fa6);
    const C_SAND = new THREE.Color(0xd4bc86);
    const C_GRASS = new THREE.Color(0x548f3d);
    const C_GRASS2 = new THREE.Color(0x83b356);
    const C_ROCK = new THREE.Color(0x867c6c);
    const C_ROCKD = new THREE.Color(0x6f6556);
    const C_MUD = new THREE.Color(0x6b6450);
    const C_SNOW = new THREE.Color(0xffffff);

    const hCache = new Float32Array((SEGS + 1) * (SEGS + 1));
    for (let i = 0; i < tpos.length; i += 3) {
      const x = tpos[i], z = tpos[i + 2];
      const h = heightAt(x, z);
      tpos[i + 1] = h;
      hCache[i / 3] = h;
    }
    // 第二遍：用高度差算坡度，再上色
    const stride = SEGS + 1;
    for (let i = 0, vi = 0; i < tpos.length; i += 3, vi++) {
      const x = tpos[i], z = tpos[i + 2], h = hCache[vi];
      const ix = vi % stride, iz = Math.floor(vi / stride);
      const hx = hCache[vi + (ix < SEGS ? 1 : 0)] - hCache[vi - (ix > 0 ? 1 : 0)];
      const hz = hCache[vi + (iz < SEGS ? stride : 0)] - hCache[vi - (iz > 0 ? stride : 0)];
      const slope = Math.min(Math.hypot(hx, hz) / (TERRAIN_SIZE / SEGS), 2.2);
      const grain = S.fbm2(x * 0.55 + 7, z * 0.55 - 2, 3);

      let c = new THREE.Color();
      if (h < -0.6) {
        // 水下：浅滩青 → 深海
        c.copy(C_SHALLOW).lerp(C_DEEP, clamp((-h - 0.6) / 3.4, 0, 1));
      } else if (h < 0.75) {
        c.copy(C_SHALLOW).lerp(C_SAND, clamp((h + 0.6) / 1.35, 0, 1));
      } else if (h < 1.7) {
        c.copy(C_SAND).lerp(C_GRASS, clamp((h - 0.75) / 0.95, 0, 1));
      } else if (h < 5.0) {
        c.copy(C_GRASS).lerp(C_GRASS2, clamp(grain * 1.1, 0, 1));
        c.lerp(C_ROCK, clamp((slope - 0.9) / 1.0, 0, 1) * 0.5);
      } else if (h < 6.6) {
        c.copy(C_GRASS2).lerp(C_ROCKD, clamp((h - 5.0) / 3.0, 0, 1));
        c.lerp(C_SNOW, clamp((h - 6.0) / 1.0, 0, 1) * clamp(1.35 - slope * 0.65, 0, 1) * 0.85);
      } else {
        // 雪线以上：缓坡积雪，陡壁露岩
        c.copy(C_ROCK).lerp(C_ROCKD, clamp(slope * 0.42, 0, 1));
        c.lerp(C_SNOW, clamp((h - 6.2) / 1.0, 0, 1) * clamp(1.55 - slope * 0.38, 0, 1));
      }
      // 河谷 / 湖岸：湿土色压一压，避免整条谷底泛白
      const rd = riverDist(x, z);
      if (h > -0.4 && rd < 3.2) c.lerp(C_MUD, (1 - rd / 3.2) * 0.5);
      const dl2 = Math.hypot(x - LAKE.x, z - LAKE.z);
      if (h > -0.4 && dl2 < LAKE.r * 1.5) c.lerp(C_MUD, (1 - dl2 / (LAKE.r * 1.5)) * 0.38);
      tcol[i] = c.r; tcol[i + 1] = c.g; tcol[i + 2] = c.b;
    }
    terrainGeo.setAttribute('color', new THREE.BufferAttribute(tcol, 3));
    terrainGeo.computeVertexNormals();

    const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.94, metalness: 0, flatShading: false,
    }));
    terrain.receiveShadow = true;
    terrain.castShadow = true;
    terrain.userData = { name: '陆地', ...SEGMENTS.land, kind: 'segment', key: 'land' };
    scene.add(terrain);

    /* ---- 湖泊水面 ---- */
    const lakeBed = heightAt(LAKE.x, LAKE.z);
    const lakeY = lakeBed + 1.5;
    const lakeGeo = new THREE.CircleGeometry(LAKE.r * 1.0, 48);
    lakeGeo.rotateX(-Math.PI / 2);
    const lake = new THREE.Mesh(lakeGeo, new THREE.MeshPhysicalMaterial({
      color: 0x2d8fa8, roughness: 0.12, metalness: 0.1, transparent: true, opacity: 0.88,
      clearcoat: 1, clearcoatRoughness: 0.06, emissive: 0x0d3f52, emissiveIntensity: 0.35,
    }));
    lake.position.set(LAKE.x, lakeY, LAKE.z);
    lake.userData = { ...ENTITIES.find((e) => e.id === 'lake'), kind: 'entity', key: 'lake' };
    scene.add(lake);

    /* ==================================================================
       海洋：波浪 + 菲涅尔 + 太阳高光
       ================================================================== */
    const waterGeo = new THREE.PlaneGeometry(220, 220, 150, 150);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMat = new THREE.ShaderMaterial({
      transparent: true,
      uniforms: {
        uTime: { value: 0 },
        uSun: { value: new THREE.Vector3(0.62, 0.42, 0.18).normalize() },
        uDeep: { value: new THREE.Color(0x07293d) },
        uShallow: { value: new THREE.Color(0x1d7c92) },
        uSky: { value: new THREE.Color(0xa8cbe8) },
        uGloom: { value: 0 },
      },
      vertexShader: `
        varying vec3 vNormal; varying vec3 vWorld; varying float vH;
        uniform float uTime;
        float wave(vec2 p, float t){
          return sin(p.x * 0.34 + t * 0.95) * 0.30
               + sin(p.y * 0.46 + t * 0.72) * 0.24
               + sin((p.x + p.y) * 0.21 + t * 0.55) * 0.20
               + sin((p.x - p.y) * 0.62 + t * 1.35) * 0.10;
        }
        void main(){
          vec3 p = position;
          float h = wave(p.xz, uTime);
          p.y += h;
          float e = 0.6;
          float hx = wave(p.xz + vec2(e, 0.0), uTime);
          float hz = wave(p.xz + vec2(0.0, e), uTime);
          vNormal = normalize(vec3(h - hx, e, h - hz));
          vec4 wp = modelMatrix * vec4(p, 1.0);
          vWorld = wp.xyz;
          vH = h;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        varying vec3 vNormal; varying vec3 vWorld; varying float vH;
        uniform vec3 uSun, uDeep, uShallow, uSky;
        uniform float uGloom;
        void main(){
          vec3 N = normalize(vNormal);
          vec3 V = normalize(cameraPosition - vWorld);
          float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
          vec3 col = mix(uDeep, uShallow, clamp(N.y * 0.9 + 0.28, 0.0, 1.0));
          vec3 L = normalize(uSun);
          vec3 H = normalize(L + V);
          float spec = pow(max(dot(N, H), 0.0), 320.0) * 1.15;
          float sheen = pow(max(dot(N, H), 0.0), 26.0) * 0.13;
          col += vec3(1.0, 0.95, 0.82) * (spec + sheen);
          col = mix(col, uSky, fres * 0.55);
          // 波峰泛白
          col += vec3(0.5, 0.65, 0.72) * smoothstep(0.36, 0.62, vH) * 0.16;
          col = mix(col, col * vec3(0.62, 0.68, 0.74), uGloom * 0.7);
          gl_FragColor = vec4(col, 0.965);
        }`,
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = SEA_Y;
    water.userData = { ...ENTITIES.find((e) => e.id === 'ocean'), kind: 'entity', key: 'ocean' };
    scene.add(water);

    /* ==================================================================
       河流：沿地形下切的河谷铺一条压扁的水带
       ================================================================== */
    function riverPoints() {
      const pts = [];
      let prevY = 999;
      for (let i = 0; i < RIVER.length; i++) {
        const [x, z] = RIVER[i];
        let y = heightAt(x, z) + 0.42;
        // 湖段：水面与湖面齐平，避免河比湖低一截
        if (Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r * 1.8) y = lakeY + 0.02;
        y = Math.min(y, prevY);                                // 顺流只降不升
        prevY = y;
        pts.push(P(x, Math.max(y, 0.04), z));
      }
      return pts;
    }
    const riverCurvePts = riverPoints();

    function buildSweep(pts, radFn, opt) {
      opt = opt || {};
      const tub = opt.tubular || 120;
      const rad = opt.radial || 14;
      const curve = new THREE.CatmullRomCurve3(pts, !!opt.closed, 'catmullrom', opt.tension != null ? opt.tension : 0.5);
      const frames = curve.computeFrenetFrames(tub, !!opt.closed);
      const flat = opt.flat != null ? opt.flat : 1;
      const rs = opt.roundStart != null ? opt.roundStart : 0.02;
      const re = opt.roundEnd != null ? opt.roundEnd : 0.02;
      const pos = [], uv = [], idx = [];
      const c = new THREE.Vector3();
      for (let i = 0; i <= tub; i++) {
        const t = i / tub;
        curve.getPointAt(t, c);
        const N = frames.normals[i], B = frames.binormals[i];
        let r = typeof radFn === 'function' ? radFn(t) : radFn;
        let ra, rb;
        if (typeof r === 'number') { ra = r; rb = r * flat; }
        else { ra = r.a != null ? r.a : r.r; rb = r.b != null ? r.b : ra * flat; }
        let cap = 1;
        if (rs > 0 && t < rs) cap = Math.sqrt(Math.max(0, 1 - Math.pow(1 - t / rs, 2)));
        if (re > 0 && t > 1 - re) cap = Math.min(cap, Math.sqrt(Math.max(0, 1 - Math.pow((1 - t) / re, 2))));
        cap = Math.max(cap, 0.04);
        for (let j = 0; j <= rad; j++) {
          const a = (j / rad) * Math.PI * 2;
          const ca = Math.cos(a) * ra * cap, sa = Math.sin(a) * rb * cap;
          pos.push(
            c.x + N.x * ca + B.x * sa,
            c.y + N.y * ca + B.y * sa,
            c.z + N.z * ca + B.z * sa
          );
          uv.push(t, j / rad);
        }
      }
      for (let i = 0; i < tub; i++) {
        for (let j = 0; j < rad; j++) {
          const a = i * (rad + 1) + j, b = a + 1, d = a + rad + 1, e = d + 1;
          idx.push(a, d, b, b, d, e);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, opt.mat);
      m.userData.curve = curve;
      return m;
    }

    // 河流水面：沿管长推进的流动条纹
    const riverMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uTime: { value: 0 }, uGloom: { value: 0 } },
      vertexShader: `
        varying vec2 vUv; varying vec3 vWorld;
        void main(){
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorld = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        varying vec2 vUv; varying vec3 vWorld;
        uniform float uTime, uGloom;
        void main(){
          float flow = fract(vUv.x * 9.0 - uTime * 0.6);
          float streak = smoothstep(0.0, 0.12, flow) * smoothstep(0.5, 0.12, flow);
          vec3 deep = vec3(0.09, 0.40, 0.62);
          vec3 foam = vec3(0.55, 0.86, 1.0);
          vec3 col = mix(deep, foam, streak * 0.5);
          col = mix(col, col * vec3(0.66, 0.72, 0.78), uGloom * 0.6);
          gl_FragColor = vec4(col, 0.94);
        }`,
    });
    const river = buildSweep(riverCurvePts, (t) => lerp(0.55, 1.05, Math.pow(t, 0.72)), {
      tubular: 220, radial: 10, flat: 0.3, mat: riverMat, roundStart: 0.01, roundEnd: 0.02,
    });
    river.userData = { name: '河流', en: 'River', color: '#59d2ff', kind: 'entity', key: 'river', ...STAGES[4] };
    scene.add(river);

    /* ==================================================================
       森林：圆锥树冠 + 圆柱树干，按高度与坡度撒点
       ================================================================== */
    const TREES = 205;
    const treeData = [];
    let tries = 0;
    while (treeData.length < TREES && tries < 20000) {
      tries++;
      const x = (Math.random() - 0.5) * 40;
      const z = (Math.random() - 0.5) * 40;
      const h = heightAt(x, z);
      if (h < 1.15 || h > 5.9) continue;
      if (Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r * 1.45) continue;
      if (riverDist(x, z) < 2.2) continue;
      const slope = Math.abs(heightAt(x + 0.8, z) - h) + Math.abs(heightAt(x, z + 0.8) - h);
      if (slope > 1.5) continue;
      // 用噪声做森林聚落，避免均匀撒胡椒面
      const dens = S.fbm2(x * 0.15 + 5, z * 0.15 - 3, 3);
      if (dens < 0.47 && Math.random() > 0.22) continue;
      treeData.push({ x, y: h, z, s: 0.6 + Math.random() * 0.68, rot: Math.random() * 6.28 });
    }

    const trunkGeo = new THREE.CylinderGeometry(0.055, 0.085, 1.0, 5);
    trunkGeo.translate(0, 0.5, 0);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a5a3e, roughness: 0.95 });
    const crownGeo = new THREE.ConeGeometry(0.62, 1.9, 7);
    crownGeo.translate(0, 1.62, 0);
    const crownMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88, flatShading: true });

    const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeData.length);
    const crowns = new THREE.InstancedMesh(crownGeo, crownMat, treeData.length);
    const dummy = new THREE.Object3D();
    const treeColor = new THREE.Color();
    treeData.forEach((t, i) => {
      dummy.position.set(t.x, t.y - 0.15, t.z);
      dummy.rotation.set(0, t.rot, 0);
      dummy.scale.set(t.s, t.s * (0.85 + Math.random() * 0.4), t.s);
      dummy.updateMatrix();
      trunks.setMatrixAt(i, dummy.matrix);
      crowns.setMatrixAt(i, dummy.matrix);
      // 每棵树一个色相：深墨绿 → 黄绿，森林不再是一块平面色
      const hue = 0.255 + (Math.random() - 0.5) * 0.07;
      const sat = 0.34 + Math.random() * 0.2;
      const lig = 0.12 + Math.random() * 0.1;
      treeColor.setHSL(hue, sat, lig);
      crowns.setColorAt(i, treeColor);
    });
    if (crowns.instanceColor) crowns.instanceColor.needsUpdate = true;
    trunks.castShadow = true; crowns.castShadow = true;
    trunks.receiveShadow = true;
    const forest = new THREE.Group();
    forest.add(trunks, crowns);
    forest.userData = { ...ENTITIES.find((e) => e.id === 'forest'), kind: 'entity', key: 'forest' };
    scene.add(forest);
    // 拾取用：给 instancedMesh 挂上实体数据
    trunks.userData = forest.userData;
    crowns.userData = forest.userData;

    /* ==================================================================
       太阳：圆盘 + 光晕 + 体积光锥
       ================================================================== */
    const SUN_DIR = new THREE.Vector3(0.62, 0.42, 0.18).normalize();
    const sunGroup = new THREE.Group();
    sunGroup.position.copy(SUN_DIR).multiplyScalar(120);

    const sunDisc = new THREE.Mesh(
      new THREE.CircleGeometry(3.0, 64),
      new THREE.MeshBasicMaterial({ color: 0xfff6cf, fog: false })
    );
    sunDisc.lookAt(0, 0, 0);
    sunGroup.add(sunDisc);

    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: S.glowTexture('rgba(255,250,220,1)', 'rgba(255,208,120,0.32)', 256),
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
    }));
    sunGlow.scale.set(26, 26, 1);
    sunGroup.add(sunGlow);
    const sunGlow2 = new THREE.Sprite(new THREE.SpriteMaterial({
      map: S.glowTexture('rgba(255,236,190,0.55)', 'rgba(255,180,90,0.06)', 256),
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
    }));
    sunGlow2.scale.set(64, 64, 1);
    sunGroup.add(sunGlow2);
    sunGroup.userData = { ...ENTITIES.find((e) => e.id === 'sun'), kind: 'entity', key: 'sun' };
    scene.add(sunGroup);

    /* ==================================================================
       天空穹顶（随天气从湛蓝转向铅灰）
       ================================================================== */
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: {
        uTop: { value: new THREE.Color(0x2a6ec4) },
        uBottom: { value: new THREE.Color(0xbfd8ea) },
        uGloom: { value: 0 },
        uSunDir: { value: SUN_DIR.clone() },
      },
      vertexShader: `
        varying vec3 vDir;
        void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec3 vDir;
        uniform vec3 uTop, uBottom, uSunDir;
        uniform float uGloom;
        void main(){
          float h = clamp(vDir.y, 0.0, 1.0);
          vec3 col = mix(uBottom, uTop, pow(h, 0.62));
          // 地平线雾带
          col = mix(col, vec3(0.86, 0.9, 0.94), pow(1.0 - h, 7.0) * 0.42);
          // 日晕
          float s = pow(max(dot(vDir, uSunDir), 0.0), 26.0);
          col += vec3(1.0, 0.88, 0.6) * s * 0.55 * (1.0 - uGloom);
          // 阴天：整体压灰
          vec3 grey = mix(vec3(0.52, 0.57, 0.62), vec3(0.72, 0.76, 0.8), h);
          col = mix(col, grey, uGloom * 0.82);
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(240, 40, 24), skyMat));

    /* ==================================================================
       光照
       ================================================================== */
    const hemi = new THREE.HemisphereLight(0xdcefff, 0x53663f, 1.7);
    scene.add(hemi);
    const sunLight = new THREE.DirectionalLight(0xfff2d8, 2.5);
    sunLight.position.copy(SUN_DIR).multiplyScalar(60);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -34;
    sunLight.shadow.camera.right = 34;
    sunLight.shadow.camera.top = 34;
    sunLight.shadow.camera.bottom = -34;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 160;
    sunLight.shadow.bias = -0.0006;
    scene.add(sunLight);
    // 补光：从相机一侧打回来，避免逆光时山体糊成一团剪影
    const fillLight = new THREE.DirectionalLight(0xb9d4ff, 1.35);
    fillLight.position.set(-26, 14, 28);
    scene.add(fillLight);

    /* ==================================================================
       云：每朵由数个噪声球组成，分“晴云”和“雨云”两组
       ================================================================== */
    const cloudWhiteMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, roughness: 1, metalness: 0,
      transparent: true, opacity: 1, depthWrite: false,
      emissive: 0xbcd6ec, emissiveIntensity: 0.28,
    });
    const cloudDarkMat = new THREE.MeshStandardMaterial({
      color: 0x8d99a6, roughness: 1, metalness: 0,
      transparent: true, opacity: 0, depthWrite: false,
      emissive: 0x39434f, emissiveIntensity: 0.12,
    });

    function cloudPuffGeo(seed, r) {
      const g = new THREE.SphereGeometry(1, 20, 14);
      const pos = g.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const n = S.fbm2(v.x * 2.3 + seed, v.y * 2.3 + v.z * 1.7 + seed, 3);
        const k = 1 + (n - 0.5) * 0.62;
        pos.setXYZ(i, v.x * k * r, v.y * k * r * 0.78, v.z * k * r);
      }
      g.computeVertexNormals();
      return g;
    }

    function makeCloud(cx, cy, cz, scale, seed, mat, puffs) {
      const g = new THREE.Group();
      const n = puffs || 6;
      for (let i = 0; i < n; i++) {
        const r = (0.9 + Math.random() * 0.85) * scale;
        const geo = cloudPuffGeo(seed + i * 3.7, r);
        const m = new THREE.Mesh(geo, mat);
        const k = scale * 1.55;
        m.position.set(
          (Math.random() - 0.5) * k * 1.5,
          (Math.random() - 0.42) * k * 0.5,
          (Math.random() - 0.5) * k * 1.05
        );
        g.add(m);
      }
      g.position.set(cx, cy, cz);
      g.userData = { ...ENTITIES.find((e) => e.id === 'cloud'), kind: 'entity', key: 'cloud' };
      g.userData._baseY = cy;
      g.userData._seed = seed;
      return g;
    }

    const fairClouds = [];
    const fairDefs = [
      [-22, 18.5, -14, 1.5], [2, 21, -19, 1.7], [19, 17.5, 1, 1.35], [-10, 19.5, 13, 1.55],
      [25, 20, -13, 1.45], [-27, 16.5, 7, 1.25], [11, 22, 15, 1.6],
    ];
    fairDefs.forEach(([x, y, z, s], i) => {
      const c = makeCloud(x, y, z, s, i * 11.3, cloudWhiteMat, 6 + (i % 3));
      c.userData._cx = x;
      scene.add(c);
      fairClouds.push(c);
    });

    const stormClouds = [];
    const stormDefs = [
      [-7, 17.0, -4, 2.1], [5, 16.6, 2, 2.0], [-13, 16.2, 5, 1.8], [11, 16.4, -7, 1.9],
      [0, 17.4, 9, 1.9],
    ];
    stormDefs.forEach(([x, y, z, s], i) => {
      const c = makeCloud(x, y, z, s, 40 + i * 7.1, cloudDarkMat, 7);
      c.userData._cx = x;
      scene.add(c);
      stormClouds.push(c);
    });

    /* ==================================================================
       雨：实例化细长条，落点高度预先算好，避免穿模
       ================================================================== */
    const RAIN_MAX = 900;
    const rainGeo = new THREE.BoxGeometry(0.03, 0.62, 0.03);
    const rainMat = new THREE.MeshBasicMaterial({
      color: 0xa8d8ff, transparent: true, opacity: 0.55, depthWrite: false,
    });
    const rainMesh = new THREE.InstancedMesh(rainGeo, rainMat, RAIN_MAX);
    rainMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    rainMesh.frustumCulled = false;
    const rainDrops = [];
    for (let i = 0; i < RAIN_MAX; i++) {
      const x = (Math.random() - 0.5) * 26;
      const z = (Math.random() - 0.5) * 24;
      rainDrops.push({
        x, z,
        y: 14 + Math.random() * 6,
        v: 11 + Math.random() * 9,
        ground: Math.max(heightAt(x, z), SEA_Y) + 0.1,
      });
    }
    scene.add(rainMesh);

    // 雨云底部到地面的"雨帘"整体位置
    const RAIN_ORIGIN = new THREE.Vector3(-2, 0, 0);

    /* ==================================================================
       水汽粒子：海面蒸发（金）+ 森林蒸腾（绿）
       ================================================================== */
    function makeVapor(opts) {
      const n = opts.count;
      const pos = new Float32Array(n * 3);
      const phase = new Float32Array(n);
      const size = new Float32Array(n);
      const seed = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        let x = 0, z = 0, guard = 0;
        do {
          x = opts.cx + (Math.random() - 0.5) * opts.rx;
          z = opts.cz + (Math.random() - 0.5) * opts.rz;
          guard++;
        } while (opts.onlySea && heightAt(x, z) > 0.12 && guard < 60);
        pos[i * 3] = x;
        pos[i * 3 + 1] = opts.y0 + Math.random() * 0.6;
        pos[i * 3 + 2] = z;
        phase[i] = Math.random();
        size[i] = 3.0 + Math.random() * 4.2;
        seed[i] = Math.random() * 6.28;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
      geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uRise: { value: opts.rise },
          uColor: { value: new THREE.Color(opts.color) },
          uOpacity: { value: opts.opacity != null ? opts.opacity : 0.85 },
        },
        vertexShader: `
          attribute float aPhase; attribute float aSize; attribute float aSeed;
          uniform float uTime, uRise;
          varying float vA;
          void main(){
            float cyc = fract(aPhase + uTime * uRise);
            vec3 p = position;
            p.y += cyc * 9.5;
            p.x += sin(cyc * 5.2 + aSeed * 3.1) * 1.5 * cyc;
            p.z += cos(cyc * 4.1 + aSeed * 2.3) * 1.3 * cyc;
            vA = sin(cyc * 3.14159) * 0.95;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = aSize * (72.0 / max(-mv.z, 1.0));
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: `
          uniform vec3 uColor; uniform float uOpacity;
          varying float vA;
          void main(){
            vec2 d = gl_PointCoord - 0.5;
            float r = length(d);
            if (r > 0.5) discard;
            float a = smoothstep(0.5, 0.02, r) * vA * uOpacity;
            gl_FragColor = vec4(uColor, a);
          }`,
      });
      const p = new THREE.Points(geo, mat);
      p.frustumCulled = false;
      return p;
    }

    const evapVapor = makeVapor({
      count: 520, cx: 20, cz: 2, rx: 46, rz: 44, y0: 0.2, rise: 0.055, onlySea: true,
      color: 0xffd49a, opacity: 0.8,
    });
    evapVapor.userData = { ...STAGES[0], kind: 'stage', key: 'evap' };
    scene.add(evapVapor);

    const transpVapor = makeVapor({
      count: 320, cx: -3, cz: -1, rx: 16, rz: 14, y0: 1.4, rise: 0.075,
      color: 0xa8f593, opacity: 0.72,
    });
    transpVapor.userData = { ...STAGES[1], kind: 'stage', key: 'transp' };
    scene.add(transpVapor);

    /* ==================================================================
       下渗 + 地下水：贴地的暗色渗流带 + 向下钻的蓝色粒子
       ================================================================== */
    const infilPts = [];
    for (let i = 0; i < 130; i++) {
      const t = Math.random();
      const idx = Math.floor(t * (riverCurvePts.length - 2));
      const a = riverCurvePts[idx], b = riverCurvePts[idx + 1];
      const f = Math.random();
      const off = (Math.random() - 0.5) * 5.0;
      const x = lerp(a.x, b.x, f) + off;
      const z = lerp(a.z, b.z, f) + off * 0.5;
      infilPts.push({ x, z, y: Math.max(heightAt(x, z), 0.3) + 0.05, ph: Math.random() });
    }
    const infilGeo = new THREE.BufferGeometry();
    const infilPos = new Float32Array(infilPts.length * 3);
    infilGeo.setAttribute('position', new THREE.BufferAttribute(infilPos, 3));
    const infilMat = new THREE.PointsMaterial({
      color: 0x9c8bff, size: 0.3, transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const infil = new THREE.Points(infilGeo, infilMat);
    infil.frustumCulled = false;
    infil.userData = { ...STAGES[5], kind: 'stage', key: 'infil' };
    scene.add(infil);

    // 地下水：贴地的一条半透明暗蓝带（示意地下水流向海洋）
    const gwPts = [
      P(6.4, 0, 7.2), P(7.2, 0, 9.0), P(7.4, 0, 10.8),
      P(7.0, 0, 12.6), P(6.0, 0, 14.2), P(4.4, 0, 15.6), P(2.4, 0, 16.8),
    ].map((v) => {
      const h = heightAt(v.x, v.z);
      return P(v.x, Math.max(h, 0.2) + 0.08, v.z);
    });
    const gwMat = new THREE.MeshBasicMaterial({
      color: 0x6f5bd8, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const gw = buildSweep(gwPts, 0.34, { tubular: 60, radial: 6, flat: 0.4, mat: gwMat, roundStart: 0.06, roundEnd: 0.06 });
    gw.userData = { ...STAGES[5], kind: 'stage', key: 'infil' };
    gw.visible = false;   // 默认隐藏，聚焦"下渗"时出现

    /* ==================================================================
       3D 标签
       ================================================================== */
    const labelObjs = [];
    const labelTick = { v: 0 };
    const labelV = new THREE.Vector3();

    function addLabel(text, pos, opt) {
      opt = opt || {};
      const obj = S.makeLabel(CSS2DObject, text, pos, 'sv-label' + (opt.minor ? ' is-minor' : ''));
      obj.userData.inner = obj.element;
      obj.userData.key = opt.key || null;
      obj.userData.follow = opt.follow || null;
      obj.userData.offset = opt.offset ? opt.offset.clone() : null;
      scene.add(obj);
      labelObjs.push(obj);
      return obj;
    }

    const peakLabelPos = (() => {
      // 找山脊最高点
      let best = { h: -99, x: 0, z: 0 };
      for (let x = -16; x <= 2; x += 0.5) {
        for (let z = -16; z <= 2; z += 0.5) {
          const h = heightAt(x, z);
          if (h > best.h) best = { h, x, z };
        }
      }
      return P(best.x, best.h + 1.6, best.z);
    })();

    addLabel('☀ 太阳', sunGroup.position.clone().multiplyScalar(0.55), { key: 'sun' });
    addLabel('蒸发', P(20, 4.6, 6), { key: 'evap' });
    addLabel('蒸腾', P(-4, 6.4, -2), { key: 'transp', minor: true });
    const cloudLabelObj = addLabel('云 · 凝结', P(-4, 20.5, -6), { key: 'cloud' });
    addLabel('降水', P(-6, 9.2, 4), { key: 'precip' });
    addLabel('雪山', peakLabelPos, { key: 'peak' });
    addLabel('森林', P(-8.5, 4.6, 4.5), { key: 'forest', minor: true });
    addLabel('湖泊', P(LAKE.x + 3.4, lakeY + 2.2, LAKE.z), { key: 'lake', minor: true });
    const riverLabelPt = riverCurvePts[Math.floor(riverCurvePts.length * 0.72)];
    addLabel('河流 · 径流', riverLabelPt.clone().add(P(0, 1.7, 0)), { key: 'runoff' });
    addLabel('海洋', P(26, 1.4, 14), { key: 'ocean' });
    const infilLabelPt = riverCurvePts[Math.floor(riverCurvePts.length * 0.38)];
    addLabel('下渗 · 地下水', infilLabelPt.clone().add(P(-2.6, 1.4, 0)), { key: 'infil', minor: true });

    /* ==================================================================
       交互：卡片 / 语音 / 聚焦
       ================================================================== */
    const voice = S.createVoice({ audioBase: '../audio/weather/' });
    S.bindVoiceButton(document.getElementById('voiceBtn'), voice);
    const card = S.createCard(document.getElementById('card'));
    const picker = S.makePicker(camera, renderer.domElement);
    const fly = S.makeFly(camera, controls);

    function defByKey(key) {
      const st = STAGES.find((s) => s.id === key);
      if (st) return st;
      const en = ENTITIES.find((e) => e.id === key);
      if (en) return en;
      return null;
    }

    function showInfo(def) {
      if (!def) return;
      card.show(def);
      voice.speak(S.narrate(def), def.id);
    }

    function markStage(key) {
      document.querySelectorAll('.wx-item').forEach((b) => {
        b.classList.toggle('is-on', b.dataset.key === key);
      });
    }

    /* ---- 聚焦某个对象 ---- */
    function focusKey(key) {
      const def = defByKey(key);
      if (!def) return;
      showInfo(def);
      markStage(key);
      const spots = {
        sun: { pos: P(52, 40, 22), target: P(74, 50, 22) },
        ocean: { pos: P(34, 8, 26), target: P(12, 0.5, 8) },
        cloud: { pos: P(-2, 20, 30), target: P(-3, 17, -2) },
        peak: { pos: P(7, 18, 25), target: peakLabelPos.clone().setY(peakLabelPos.y - 1.6) },
        forest: { pos: P(-13, 9, 18), target: P(-3, 3, 4) },
        lake: { pos: P(16, 8, 15), target: P(LAKE.x, lakeY, LAKE.z) },
        river: { pos: P(17, 10, 23), target: P(4, 3, 9) },
        evap: { pos: P(26, 10, 26), target: P(15, 3, 6) },
        transp: { pos: P(-14, 9, 10), target: P(-4, 2.6, -1) },
        cond: { pos: P(-2, 21, 30), target: P(-3, 17, -2) },
        precip: { pos: P(-8, 8, 18), target: P(-5, 7, 0) },
        runoff: { pos: P(17, 10, 23), target: P(4, 3, 9) },
        infil: { pos: P(18, 9, 20), target: P(5, 2.5, 11) },
        collect: { pos: P(34, 8, 26), target: P(12, 0.5, 8) },
      };
      const s = spots[key];
      if (s) fly.flyTo(s.pos, s.target, 1.15);
      // 地下水只在聚焦下渗时露出来
      gw.visible = key === 'infil';
      highlightRelated(key);
    }

    function highlightRelated(key) {
      const related = {
        evap: ['evap'], transp: ['transp'], cond: ['cloud'], precip: ['precip'],
        runoff: ['runoff'], infil: ['infil'], collect: ['ocean'],
        sun: ['sun'], ocean: ['ocean'], cloud: ['cloud'], peak: ['peak'],
        forest: ['forest'], lake: ['lake'], river: ['runoff'],
      }[key] || [];
      labelObjs.forEach((o) => {
        const k = o.userData.key;
        const on = !k || related.indexOf(k) >= 0 || related.indexOf(key) >= 0;
        o.element.style.opacity = related.length ? (on ? '1' : '0.18') : '1';
      });
    }

    /* ---- 可拾取对象 ---- */
    function pickTargets() {
      return [sunDisc, sunGlow, water, lake, terrain, river, trunks, crowns,
        evapVapor, transpVapor, infil, ...fairClouds, ...stormClouds];
    }
    function resolveOwner(obj) {
      let o = obj;
      while (o && !(o.userData && o.userData.name)) o = o.parent;
      return o ? o.userData : null;
    }

    picker.onHover(() => pickTargets(), (obj) => {
      renderer.domElement.style.cursor = resolveOwner(obj) ? 'pointer' : 'grab';
    });
    picker.onClick(() => pickTargets(), (obj) => {
      const owner = resolveOwner(obj);
      if (!owner) return;
      if (owner.key) focusKey(owner.key);
      else if (owner.name) showInfo(owner);
    });

    /* ---- 环节索引 ---- */
    const stageList = document.getElementById('stageList');
    STAGES.forEach((st) => {
      const b = document.createElement('button');
      b.className = 'wx-item';
      b.dataset.key = st.id;
      b.innerHTML = '<span class="wx-item__dot" style="background:' + st.color + ';color:' + st.color + '"></span>' + st.name;
      b.addEventListener('click', () => focusKey(st.id));
      b.addEventListener('mouseenter', () => { if (gw) gw.visible = gw.visible || st.id === 'infil'; });
      stageList.appendChild(b);
    });

    /* ==================================================================
       分段：全景 / 海洋段 / 大气段 / 陆地段
       ================================================================== */
    const views = {
      overview: { pos: P(28, 16, 34), target: P(0, 4, 0) },
      ocean: { pos: P(33, 11, 31), target: P(7, 2, 7) },
      air: { pos: P(6, 17, 32), target: P(-2, 14, -3) },
      land: { pos: P(29, 19, 35), target: P(3, 3, 8) },
    };

    let currentSeg = 'overview';

    function applySegment(name) {
      currentSeg = name;
      const v = views[name] || views.overview;
      fly.flyTo(v.pos, v.target, 1.25);
      const def = name === 'overview' ? SEGMENTS.overview
        : name === 'ocean' ? SEGMENTS.ocean
        : name === 'air' ? SEGMENTS.air : SEGMENTS.land;
      showInfo(def);
      markStage(null);
      document.querySelectorAll('[data-seg]').forEach((b) => {
        b.classList.toggle('is-on', b.dataset.seg === name);
      });
      // 分段只高亮本段元素
      const dim = (obj, on) => {
        obj.traverse((c) => {
          if (!c.material) return;
          const mats = Array.isArray(c.material) ? c.material : [c.material];
          mats.forEach((m) => {
            if (m.userData._baseOpacity == null) m.userData._baseOpacity = m.opacity != null ? m.opacity : 1;
            m.transparent = true;
            m.opacity = on ? m.userData._baseOpacity : m.userData._baseOpacity * 0.16;
          });
        });
      };
      dim(evapVapor, name === 'overview' || name === 'ocean');
      dim(transpVapor, name === 'overview' || name === 'land');
      dim(fairCloudsGroup, name === 'overview' || name === 'air');
      dim(stormCloudsGroup, name === 'overview' || name === 'air' || name === 'ocean');
      dim(forest, name === 'overview' || name === 'land');
      dim(lake, name === 'overview' || name === 'land');
      river.visible = name !== 'air';
      gw.visible = name === 'land' ? gw.visible : false;
    }

    // 把云打包成组，方便整体调透明度
    const fairCloudsGroup = new THREE.Group();
    fairClouds.forEach((c) => fairCloudsGroup.add(c));
    scene.add(fairCloudsGroup);
    const stormCloudsGroup = new THREE.Group();
    stormClouds.forEach((c) => stormCloudsGroup.add(c));
    scene.add(stormCloudsGroup);

    /* ==================================================================
       天气：晴朗 / 多云 / 降雨 / 暴雨 渐变过渡
       ================================================================== */
    const weatherKeys = ['clear', 'cloudy', 'rain', 'storm'];
    let weatherIdx = 0;
    const wxTarget = { ...WEATHERS.clear };
    const wxNow = { cloudWhite: 1, cloudDark: 0, rain: 0, sun: 1, fog: 0.0008, sky: 0 };

    function setWeather(key) {
      weatherIdx = Math.max(0, weatherKeys.indexOf(key));
      const w = WEATHERS[key];
      Object.assign(wxTarget, w);
      const btn = document.getElementById('weatherBtn');
      if (btn) btn.innerHTML = '<span class="sv-btn__icon">' + w.icon + '</span><span>' + w.name + '</span>';
      S.toast('天气：' + w.name);
    }

    /* ==================================================================
       UI 绑定
       ================================================================== */
    // 用 createCard 的容器
    document.querySelectorAll('[data-seg]').forEach((btn) => {
      btn.addEventListener('click', () => applySegment(btn.dataset.seg));
    });

    document.getElementById('weatherBtn').addEventListener('click', () => {
      const next = weatherKeys[(weatherIdx + 1) % weatherKeys.length];
      setWeather(next);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      applySegment('overview');
      card.hide();
      gw.visible = false;
      labelObjs.forEach((o) => { o.element.style.opacity = '1'; });
      markStage(null);
    });

    let isPlaying = true;
    const clock = new THREE.Clock();
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying
        ? '<span class="sv-btn__icon">⏸</span><span>暂停</span>'
        : '<span class="sv-btn__icon">▶</span><span>播放</span>';
      if (!isPlaying) clock.getDelta();
    });

    /* ==================================================================
       标签避让
       ================================================================== */
    function layoutLabels() {
      if ((labelTick.v++ % 2) !== 0) return;
      const items = [];
      labelObjs.forEach((o) => {
        const el = o.userData.inner;
        if (!el || parseFloat(el.style.opacity || '1') < 0.3) return;
        o.getWorldPosition(labelV);
        labelV.project(camera);
        if (labelV.z > 1) return;
        const x = (labelV.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-labelV.y * 0.5 + 0.5) * window.innerHeight;
        const w = el.offsetWidth || 56;
        const h = el.offsetHeight || 18;
        items.push({ el, sx: x - w / 2, sy: y - h / 2, w, h });
      });
      items.sort((a, b) => a.sy - b.sy);
      const placed = [];
      items.forEach((it) => {
        let shift = 0;
        for (let k = 0; k < 8; k++) {
          const box = { x1: it.sx, y1: it.sy + shift, x2: it.sx + it.w, y2: it.sy + it.h + shift };
          const hit = placed.some((p) => !(box.x2 < p.x1 || box.x1 > p.x2 || box.y2 < p.y1 || box.y1 > p.y2));
          if (!hit) { placed.push(box); break; }
          shift += it.h + 3;
        }
        it.el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
      });
    }

    /* ==================================================================
       动画
       ================================================================== */
    let elapsed = 0;

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (isPlaying) {
        elapsed += dt;
        const t = elapsed;
        waterMat.uniforms.uTime.value = t;
        riverMat.uniforms.uTime.value = t;
        evapVapor.material.uniforms.uTime.value = t;
        transpVapor.material.uniforms.uTime.value = t;

        // 云标签跟着云走
        if (cloudLabelObj) {
          const anchor = fairClouds[1] || fairClouds[0];
          if (anchor) cloudLabelObj.position.copy(anchor.position).add(P(0, 1.6, 0));
        }
        // 云飘
        fairClouds.forEach((c, i) => {
          c.position.x += dt * (0.28 + i * 0.03);
          if (c.position.x > 30) c.position.x = -30;
          c.position.y = c.userData._baseY + Math.sin(t * 0.32 + i) * 0.22;
        });
        stormClouds.forEach((c, i) => {
          c.position.x += dt * 0.16;
          if (c.position.x > 30) c.position.x = -30;
          c.position.y = c.userData._baseY + Math.sin(t * 0.22 + i * 1.7) * 0.16;
        });

        // 雨
        const rainOn = wxNow.rain > 0.02;
        if (rainOn) {
          const activeN = Math.floor(RAIN_MAX * wxNow.rain);
          for (let i = 0; i < RAIN_MAX; i++) {
            const r = rainDrops[i];
            if (i < activeN) {
              r.y -= dt * r.v;
              if (r.y < r.ground) {
                r.y = 15 + Math.random() * 4;
                r.x = (Math.random() - 0.5) * 26 + RAIN_ORIGIN.x;
                r.z = (Math.random() - 0.5) * 24 + RAIN_ORIGIN.z;
                r.ground = Math.max(heightAt(r.x, r.z), SEA_Y) + 0.1;
              }
              dummy.position.set(r.x, r.y, r.z);
              dummy.scale.set(1, 1, 1);
            } else {
              dummy.position.set(0, -999, 0);
              dummy.scale.set(0.001, 0.001, 0.001);
            }
            dummy.updateMatrix();
            rainMesh.setMatrixAt(i, dummy.matrix);
          }
          rainMesh.instanceMatrix.needsUpdate = true;
        }
        rainMesh.visible = rainOn;

        // 下渗粒子：往下钻，到地下消失
        for (let i = 0; i < infilPts.length; i++) {
          const p = infilPts[i];
          const cyc = (p.ph + t * 0.22) % 1;
          infilPos[i * 3] = p.x;
          infilPos[i * 3 + 1] = p.y - cyc * 1.1;
          infilPos[i * 3 + 2] = p.z;
        }
        infilGeo.attributes.position.needsUpdate = true;
        infilMat.opacity = 0.25 + wxNow.rain * 0.65;

        // 天气渐变
        wxNow.cloudWhite = lerp(wxNow.cloudWhite, wxTarget.cloudWhite, dt * 1.6);
        wxNow.cloudDark = lerp(wxNow.cloudDark, wxTarget.cloudDark, dt * 1.6);
        wxNow.rain = lerp(wxNow.rain, wxTarget.rain, dt * 1.1);
        wxNow.sun = lerp(wxNow.sun, wxTarget.sun, dt * 1.6);
        wxNow.fog = lerp(wxNow.fog, wxTarget.fog, dt * 1.2);
        wxNow.sky = lerp(wxNow.sky, wxTarget.sky, dt * 1.4);

        cloudWhiteMat.opacity = wxNow.cloudWhite;
        cloudDarkMat.opacity = wxNow.cloudDark;
        cloudWhiteMat.color.setRGB(
          lerp(1.0, 0.72, wxNow.sky), lerp(1.0, 0.78, wxNow.sky), lerp(1.0, 0.84, wxNow.sky)
        );
        skyMat.uniforms.uGloom.value = wxNow.sky;
        waterMat.uniforms.uGloom.value = wxNow.sky;
        riverMat.uniforms.uGloom.value = wxNow.sky;
        scene.fog.density = wxNow.fog;
        scene.fog.color.setRGB(
          lerp(0.74, 0.55, wxNow.sky), lerp(0.84, 0.59, wxNow.sky), lerp(0.92, 0.64, wxNow.sky)
        );
        sunLight.intensity = 0.55 + 1.95 * wxNow.sun;
        hemi.intensity = 0.42 + 0.58 * wxNow.sun;
        sunGlow.material.opacity = 0.35 + 0.65 * wxNow.sun;
        sunDisc.material.color.setRGB(1, lerp(0.96, 0.86, 1 - wxNow.sun), lerp(0.82, 0.62, 1 - wxNow.sun));
        renderer.toneMappingExposure = lerp(1.02, 0.82, wxNow.sky * 0.8);
      }

      fly.update(dt);
      controls.update();
      layoutLabels();
      labelRenderer.render(scene, camera);
      if (composer) composer.render();
      else renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    /* ==================================================================
       启动
       ================================================================== */
    applySegment('overview');
    setWeather('clear');
    document.getElementById('loader').classList.add('is-done');
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
