  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer } from 'three/addons/renderers/CSS2DRenderer.js';
    




    // ===== SciVis Kit（由 tools/inline-kit.js 自动内联，勿手改） =====
    const SciVis = (function () {
    
    // THREE / addons 依赖占位，由 init() 注入
    let THREE = null;
    let OrbitControls = null;
    let EffectComposer = null;
    let RenderPass = null;
    let UnrealBloomPass = null;
    
    function init(_THREE, addons) {
      THREE = _THREE;
      addons = addons || {};
      OrbitControls = addons.OrbitControls;
      EffectComposer = addons.EffectComposer;
      RenderPass = addons.RenderPass;
      UnrealBloomPass = addons.UnrealBloomPass;
      return exports;
    }
    
    /* ---------------- 确定性噪声（替代 Math.random 做程序化纹理） --------- */
    function hash3(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const a = hash3(ix, iy, 0), b = hash3(ix + 1, iy, 0);
      const c = hash3(ix, iy + 1, 0), d = hash3(ix + 1, iy + 1, 0);
      return a + (b - a) * smooth(fx) + (c - a) * smooth(fy) * (1 - smooth(fx)) + (d - b) * smooth(fx) * smooth(fy);
    }
    function fbm2(x, y, oct) {
      let v = 0, amp = 0.5, f = 1;
      for (let i = 0; i < (oct || 5); i++) { v += amp * valueNoise2(x * f, y * f); f *= 2; amp *= 0.5; }
      return v;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    /* ---------------- 渲染器：ACES 色调映射 + UnrealBloom --------- */
    function createRenderer(opts) {
      opts = opts || {};
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: opts.alpha !== false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = opts.exposure != null ? opts.exposure : 1.1;
      if (opts.shadow !== false) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      }
      document.body.appendChild(renderer.domElement);
    
      let composer = null, bloom = null, renderPass = null;
      if (opts.bloom !== false) {
        composer = new EffectComposer(renderer);
        renderPass = new RenderPass(new THREE.Scene(), new THREE.Camera());
        composer.addPass(renderPass);
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          opts.bloomStrength != null ? opts.bloomStrength : 0.55,
          opts.bloomRadius != null ? opts.bloomRadius : 0.7,
          opts.bloomThreshold != null ? opts.bloomThreshold : 0.85
        );
        composer.addPass(bloom);
      }
      // 页面需将真实场景/相机绑定到 renderPass：renderPass.scene = scene; renderPass.camera = camera;
      return { renderer, composer, bloom, renderPass };
    }
    
    /* ---------------- 基础场景 + 相机 + 轨道控制 --------- */
    function createScene(bg, fog) {
      const scene = new THREE.Scene();
      if (bg) scene.background = new THREE.Color(bg);
      if (fog) scene.fog = fog;
      return scene;
    }
    function createCamera(fov, near, far) {
      return new THREE.PerspectiveCamera(fov || 50, window.innerWidth / window.innerHeight, near || 0.1, far || 1000);
    }
    function createControls(camera, dom, target) {
      const c = new OrbitControls(camera, dom);
      c.enableDamping = true;
      c.dampingFactor = 0.08;
      c.rotateSpeed = 0.7;
      if (target) c.target.copy(target);
      return c;
    }
    
    /* ---------------- 平滑运镜（点击聚焦 / 漫游） --------- */
    function makeFly(camera, controls) {
      const state = {
        active: false,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
        t: 0, dur: 1, onDone: null,
      };
      function flyTo(pos, target, dur, onDone) {
        state.from.copy(camera.position);
        state.to.copy(pos);
        state.fromTarget.copy(controls.target);
        state.toTarget.copy(target);
        state.t = 0;
        state.dur = dur || 1;
        state.onDone = onDone || null;
        state.active = true;
        controls.enabled = false;
      }
      function update(dt) {
        if (!state.active) return;
        state.t += dt / state.dur;
        const k = state.t >= 1 ? 1 : 1 - Math.pow(1 - state.t, 3); // easeOutCubic
        camera.position.lerpVectors(state.from, state.to, k);
        controls.target.lerpVectors(state.fromTarget, state.toTarget, k);
        camera.lookAt(controls.target);
        if (state.t >= 1) {
          state.active = false;
          controls.enabled = true;
          if (state.onDone) state.onDone();
        }
      }
      function cancel() {
        if (!state.active) return;
        state.active = false;
        controls.enabled = true;
      }
      return { flyTo, update, cancel, isActive: () => state.active };
    }
    
    /* ---------------- 讲解文案（卡片 / 语音共用一份） --------- */
    // 优先用 info.say（写给"耳朵"的口语讲解），没有时用结构化字段拼一句
    function narrate(info) {
      if (!info) return '';
      if (info.say) return info.say;
      const parts = [info.name + '。'];
      if (info.type) parts.push(info.type + '。');
      if (info.stats && info.stats.length) {
        parts.push(info.stats.map((s) => s.label + '，' + s.value).join('。') + '。');
      }
      if (info.desc && info.desc.length) parts.push(info.desc.join('。'));
      return parts.join('').replace(/。{2,}/g, '。');
    }
    
    /* ---------------- 语音（神经语音包优先，浏览器语音兜底） ---------------- */
    /**
     * 两级语音方案：
     *   1) 预生成的神经语音包（edge-tts 晓晓 / 云希等）—— 音质接近真人，
     *      文件命名 v_<id>.mp3，放在 audioBase 目录下，离线可用、无密钥。
     *   2) 浏览器 speechSynthesis —— 语音包里没有这句时兜底，并做了音色排序
     *      （优先云端自然音 / 增强音色）与按句切分，比直接取第一个中文音色自然得多。
     *
     * 用法：const voice = S.createVoice({ audioBase: '../audio/solar-system/' });
     *       voice.speak(S.narrate(data), data.voiceId);
     */
    function createVoice(opts) {
      opts = opts || {};
      const audioBase = opts.audioBase || null;   // 语音包目录，留空则纯浏览器语音
      const synth = window.speechSynthesis || null;
      let enabled = true;
      let zhVoice = null;
      let audioEl = null;
      let seq = 0;                                 // 打断计数：切天体时丢弃旧队列
      const missing = Object.create(null);         // 语音包里不存在的 id，只探测一次
    
      /* --- 音色挑选：给候选中文音色打分，取最自然的一个 --- */
      function score(v) {
        const name = (v.name || '').toLowerCase();
        const lang = (v.lang || '').toLowerCase();
        let s = 0;
        if (/xiaoxiao|xiaoyi|yunxi|yunjian|晓晓|云希|云扬/.test(name)) s += 60;
        if (/natural|neural|premium|enhanced|自然/.test(name)) s += 40;
        if (/google/.test(name)) s += 32;                 // Chrome 云端音，韵律较自然
        if (/ting-?ting|tingting|meijia|sinji|婷婷|美佳|善怡|美嘉/.test(name)) s += 24;
        if (/^zh[-_]?cn|cmn|^zh$/.test(lang)) s += 18;
        if (/^zh[-_]?(hk|tw)|yue/.test(lang)) s -= 14;    // 粤语 / 台湾腔，普通话场景降权
        if (v.localService) s += 6;                       // 本地音：断网也能用
        return s;
      }
      function pick() {
        if (!synth || !synth.getVoices) return;
        const all = synth.getVoices() || [];
        const zh = all.filter((v) => /^zh|cmn|yue/i.test(v.lang || ''));
        if (!zh.length) return;
        zhVoice = zh.slice().sort((a, b) => score(b) - score(a))[0] || null;
      }
      if (synth) {
        pick();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', pick);
      }
    
      /* --- 兜底：浏览器语音，按句切开逐句念，停顿更自然 --- */
      function chunk(text) {
        const parts = String(text).replace(/\s+/g, '').match(/[^。！？；!?]+[。！？；!?]?/g) || [];
        const out = [];
        let buf = '';
        parts.forEach((p) => {
          if (buf && (buf + p).length > 46) { out.push(buf); buf = p; }
          else buf += p;
        });
        if (buf) out.push(buf);
        return out.length ? out : [String(text)];
      }
      function speakTTS(text) {
        if (!synth || !text) return;
        const mySeq = ++seq;
        const chunks = chunk(text);
        let i = 0;
        const next = () => {
          if (!enabled || mySeq !== seq || i >= chunks.length) return;
          const u = new SpeechSynthesisUtterance(chunks[i++]);
          u.lang = 'zh-CN';
          u.rate = 0.98;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (!zhVoice) pick();
          if (zhVoice) u.voice = zhVoice;
          u.onend = () => setTimeout(next, 90);
          u.onerror = () => {};
          synth.speak(u);
        };
        // Chrome 在 cancel() 之后立刻 speak() 偶发静音，等一小会儿再开口
        setTimeout(next, 60);
      }
    
      /* --- 首选：播放语音包 --- */
      function playPack(id, text) {
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.preload = 'auto';
        }
        const el = audioEl;
        let done = false;
        const fallback = () => {
          if (done) return;
          done = true;
          missing[id] = true;
          speakTTS(text);
        };
        el.onerror = fallback;
        el.onplaying = () => { el.onerror = null; };
        el.src = audioBase + 'v_' + id + '.mp3';
        const p = el.play();
        if (p && p.catch) p.catch(fallback);
      }
    
      function speak(text, id) {
        if (!enabled || !text) return;
        if (id && audioBase && !missing[id]) {
          seq++;                      // 打断上一句（浏览器语音队列）
          if (synth) synth.cancel();
          playPack(id, text);
          return;
        }
        if (audioEl) audioEl.pause();
        if (synth) synth.cancel();
        speakTTS(text);
      }
      function stop() {
        seq++;
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        if (synth) synth.cancel();
      }
      function toggle() {
        enabled = !enabled;
        if (!enabled) stop();
        return enabled;
      }
      return { speak, stop, toggle, isEnabled: () => enabled, hasPack: !!audioBase };
    }
    
    /* ---------------- 信息卡片（CSS 类 + 结构化字段） --------- */
    function createCard(container) {
      // 页面里已有 .sv-card 容器时直接复用，避免套娃出两层透明卡片
      const host = container && container.nodeType === 1 ? container : document.body;
      let el;
      if (host.classList && host.classList.contains('sv-card')) {
        el = host;
      } else {
        el = document.createElement('div');
        el.className = 'sv-card';
        host.appendChild(el);
      }
      el.innerHTML =
        '<div class="sv-card__head">' +
        '  <span class="sv-card__dot"></span>' +
        '  <div class="sv-card__titles"><div class="sv-card__title"></div><div class="sv-card__sub"></div></div>' +
        '  <button class="sv-card__close" aria-label="关闭">\u00D7</button>' +
        '</div>' +
        '<div class="sv-card__body"></div>';
      const dot = el.querySelector('.sv-card__dot');
      const title = el.querySelector('.sv-card__title');
      const sub = el.querySelector('.sv-card__sub');
      const body = el.querySelector('.sv-card__body');
      const close = el.querySelector('.sv-card__close');
    
      function show(data) {
        if (!data || !data.name) return;
        const color = data.color ? '#' + data.color.toString(16).padStart(6, '0') : '#6a8cff';
        dot.style.background = color;
        dot.style.color = color;
        title.textContent = data.name;
        sub.textContent = data.type || '';
        body.innerHTML = '';
        if (data.stats && data.stats.length) {
          data.stats.forEach((s) => {
            const row = document.createElement('div');
            row.className = 'sv-card__stat';
            row.innerHTML = '<span>' + s.label + '</span><b>' + s.value + '</b>';
            body.appendChild(row);
          });
        }
        if (data.desc && data.desc.length) {
          data.desc.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'sv-card__row';
            row.textContent = line;
            body.appendChild(row);
          });
        }
        el.classList.add('is-open');
      }
      function hide() { el.classList.remove('is-open'); }
      close.addEventListener('click', hide);
      return { element: el, show, hide };
    }
    
    /* ---------------- 悬停 + 点击拾取（合并） --------- */
    function makePicker(camera, dom) {
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      function setFromEvent(e) {
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
      }
      function pick(e, targets) {
        setFromEvent(e);
        const hits = raycaster.intersectObjects(targets, true);
        return hits.length ? hits[0].object : null;
      }
      function onHover(targets, cb) {
        dom.addEventListener('mousemove', (e) => cb(pick(e, targets), e));
        dom.addEventListener('mouseleave', () => cb(null, null));
      }
      function onClick(targets, cb) {
        dom.addEventListener('click', (e) => cb(pick(e, targets), e));
      }
      return { pick, onHover, onClick };
    }
    
    /* ---------------- 程序化纹理 --------- */
    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      return c;
    }
    function glowTexture(inner, mid, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    // 行星地表（fbm 噪声 + 色带，经度无缝）
    function planetTexture(palette, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bands = palette.map((p) => new THREE.Color(p));
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          const th = u * Math.PI * 2;
          const nx = Math.cos(th) * 3, ny = Math.sin(th) * 3;
          const n = fbm2(nx + 1.7, v * 5 - ny * 0.4, 5);
          const n2 = fbm2(nx * 2.3 + 9.1, v * 7 + 3.3, 4);
          let t = clamp(n * 0.7 + n2 * 0.3, 0, 1);
          const col = sampleBands(bands, t);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function sampleBands(bands, t) {
      const seg = 1 / (bands.length - 1);
      const idx = Math.min(Math.floor(t / seg), bands.length - 2);
      const local = (t - idx * seg) / seg;
      return bands[idx].clone().lerp(bands[idx + 1], local);
    }
    
    // 恐龙皮肤纹理（鳞片噪声 + 色斑 + 腹部渐变）
    function skinTexture(baseColor, spotColor, size) {
      size = size || 256;
      const c = makeCanvas(size);
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const base = new THREE.Color(baseColor);
      const spot = new THREE.Color(spotColor);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          // 鳞片：高频网格噪声
          const scale = fbm2(u * 18, v * 18, 4);
          const scale2 = fbm2(u * 40 + 3, v * 40 + 7, 3);
          // 色斑：低频大块斑纹
          const spotN = fbm2(u * 6 + 11, v * 6 - 5, 4);
          let col = base.clone();
          col.lerp(spot, S.clamp((spotN - 0.42) * 3.0, 0, 1) * 0.5);
          // 鳞片刻痕（微亮/微暗）
          const sheen = (scale2 - 0.5) * 0.16 + (scale - 0.5) * 0.08;
          col.r = S.clamp(col.r + sheen, 0, 1);
          col.g = S.clamp(col.g + sheen, 0, 1);
          col.b = S.clamp(col.b + sheen, 0, 1);
          const i = (y * size + x) * 4;
          img.data[i] = col.r * 255;
          img.data[i + 1] = col.g * 255;
          img.data[i + 2] = col.b * 255;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    
    /* ---------------- 星空（分层 + 大小/亮度变化） --------- */
    function createStarfield(count, radius, color1, color2) {
      count = count || 1400;
      radius = radius || 240;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c1 = new THREE.Color(color1 || 0xffffff);
      const c2 = new THREE.Color(color2 || 0xaac4ff);
      for (let i = 0; i < count; i++) {
        const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1)
          .normalize().multiplyScalar(radius);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
        const c = c1.clone().lerp(c2, Math.random());
        const b = 0.4 + Math.random() * 0.6;
        col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.5, vertexColors: true, transparent: true, opacity: 0.85,
        sizeAttenuation: true, depthWrite: false,
      });
      return new THREE.Points(geo, mat);
    }
    
    /* ---------------- UI 助手 --------- */
    // 创建 3D 标签（需传入 CSS2DObject 构造器）并定位
    function makeLabel(CSS2DObject, text, position, className) {
      const div = document.createElement('div');
      div.className = className || 'sv-label';
      div.textContent = text;
      const obj = new CSS2DObject(div);
      if (position) obj.position.copy(position);
      return obj;
    }
    
    function toast(text, ms) {  let el = document.querySelector('.sv-toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'sv-toast';
        document.body.appendChild(el);
      }
      el.textContent = text;
      el.classList.add('is-open');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('is-open'), ms || 2200);
    }
    function bindVoiceButton(btn, voice) {
      if (!btn) return;
      const sync = () => btn.classList.toggle('is-off', !voice.isEnabled());
      sync();
      btn.addEventListener('click', () => { voice.toggle(); sync(); });
    }
    
    // 具名导出集合（供 init 返回全部 API）
    const exports = {
      init, hash3, valueNoise2, fbm2, clamp, lerp,
      createRenderer, createScene, createCamera, createControls,
      makeFly, createVoice, narrate, createCard, makePicker, makeLabel,
      glowTexture, planetTexture, skinTexture, createStarfield,
      toast, bindVoiceButton,
    };
    
    
    return exports;
    })();


    const S = SciVis.init(THREE, { OrbitControls, EffectComposer, RenderPass, UnrealBloomPass });

    /* ================= 科普数据 ================= */
    const INFO = {
      太阳: {
        color: 0xffd166, type: '能量来源',
        stats: [['表面温度','约 5500 ℃'],['能量来源','氢核聚变'],['地日距离','1.5 亿 km']],
        desc: ['水循环的全部动力来源', '阳光加热海洋，驱动蒸发'],
      },
      云: {
        color: 0xe8f4ff, type: '天气现象',
        stats: [['成分','小水滴 / 小冰晶'],['云滴大小','约 0.02 mm'],['成雨条件','水滴足够大、足够重']],
        desc: ['水汽上升遇冷凝结成云', '云朵聚集变重就会下雨'],
      },
      海洋: {
        color: 0x2f7fb5, type: '水体',
        stats: [['占地球水','约 97%'],['平均深度','约 3700 m'],['最大深度','约 11000 m']],
        desc: ['水循环最大的水汽来源', '蒸发留下盐分，所以海水是咸的'],
      },
      水循环: {
        color: 0x8ecae6, type: '自然过程',
        stats: [['环节','蒸发→冷凝→降水→径流'],['驱动力','太阳能 + 重力'],['特点','周而复始，永不停歇']],
        desc: ['水在海洋、天空、陆地之间旅行', '让地球上的水用之不竭'],
      },
    };

    /* ================= 场景 ================= */
    const scene = new THREE.Scene();

    const camera = S.createCamera(48, 0.1, 400);
    camera.position.set(16, 9, 20);

    const { renderer, composer, renderPass } = S.createRenderer({
      exposure: 1.0, bloomStrength: 0.25, bloomRadius: 0.6, bloomThreshold: 0.9,
    });
    renderPass.scene = scene;
    renderPass.camera = camera;

    const controls = S.createControls(camera, renderer.domElement, new THREE.Vector3(0, 3, 0));
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 6;
    controls.maxDistance = 60;

    // 灯光
    const sunDir = new THREE.Vector3(-14, 16, -10);
    const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x507040, 0.95);
    scene.add(hemi);
    const sunLight = new THREE.DirectionalLight(0xfff0d5, 2.0);
    sunLight.position.copy(sunDir);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    Object.assign(sunLight.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22 });
    scene.add(sunLight);

    /* ================= 渐变天空穹顶 ================= */
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: {
        topColor: { value: new THREE.Color(0x2a63a8) },
        bottomColor: { value: new THREE.Color(0xa8cbe8) },
        sunDirection: { value: sunDir.clone().normalize() },
      },
      vertexShader: `
        varying vec3 vDir;
        void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec3 vDir;
        uniform vec3 topColor, bottomColor, sunDirection;
        void main(){
          float h = clamp(vDir.y, 0.0, 1.0);
          vec3 col = mix(bottomColor, topColor, pow(h, 0.5));
          float s = pow(max(dot(vDir, sunDirection), 0.0), 32.0);
          col += vec3(1.0, 0.85, 0.55) * s * 0.5;
          col = mix(col, vec3(0.82, 0.9, 0.96), pow(1.0 - h, 6.0) * 0.35);
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(180, 32, 20), skyMat));

    /* ================= 太阳（盘 + 光晕） ================= */
    const sunGroup = new THREE.Group();
    const sunDisc = new THREE.Mesh(
      new THREE.CircleGeometry(2.2, 48),
      new THREE.MeshBasicMaterial({ color: 0xfff3b0, fog: false })
    );
    sunDisc.position.copy(sunDir);
    sunDisc.lookAt(0, 3, 0);
    sunGroup.add(sunDisc);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: S.glowTexture('rgba(255,244,200,1)', 'rgba(255,220,140,0.4)'),
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
    }));
    sunGlow.scale.set(13, 13, 1);
    sunGlow.position.copy(sunDir);
    sunGroup.add(sunGlow);
    sunGroup.userData = INFO['太阳'];
    scene.add(sunGroup);

    /* ================= 海洋（PBR 波浪 shader） ================= */
    const waterGeo = new THREE.PlaneGeometry(90, 90, 96, 96);
    waterGeo.rotateX(-Math.PI / 2);
    const waterBase = waterGeo.attributes.position.array.slice();
    const waterMat = new THREE.ShaderMaterial({
      transparent: true,
      uniforms: { uTime: { value: 0 }, uSun: { value: sunDir.clone().normalize() } },
      vertexShader: `
        varying vec3 vPos; varying vec3 vNormal; varying vec3 vWorld;
        uniform float uTime;
        float wave(vec2 p, float t){
          return sin(p.x * 0.8 + t * 1.4) * 0.14
               + sin(p.y * 1.1 + t * 1.1) * 0.12
               + sin((p.x + p.y) * 0.5 + t * 0.8) * 0.1;
        }
        void main(){
          vec3 p = position;
          float t = uTime;
          float h = wave(p.xz, t);
          p.y += h;
          float e = 0.4;
          float hx = wave(p.xz + vec2(e,0.0), t);
          float hz = wave(p.xz + vec2(0.0,e), t);
          vNormal = normalize(vec3(h - hx, e, h - hz));
          vPos = p;
          vWorld = (modelMatrix * vec4(p, 1.0)).xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }`,
      fragmentShader: `
        varying vec3 vPos; varying vec3 vNormal; varying vec3 vWorld;
        uniform vec3 uSun;
        void main(){
          vec3 N = normalize(vNormal);
          vec3 V = normalize(cameraPosition - vWorld);
          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.5);
          vec3 deep = vec3(0.05, 0.22, 0.42);
          vec3 shallow = vec3(0.15, 0.5, 0.65);
          vec3 col = mix(deep, shallow, clamp(N.y, 0.0, 1.0) * 0.6 + fresnel * 0.4);
          // 太阳镜面反射
          vec3 L = normalize(uSun);
          vec3 H = normalize(L + V);
          float spec = pow(max(dot(N, H), 0.0), 90.0) * 1.6;
          col += vec3(1.0, 0.9, 0.7) * spec;
          col = mix(col, vec3(0.7, 0.85, 0.95), fresnel * 0.35);
          gl_FragColor = vec4(col, 0.96);
        }`,
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = 0.25;
    water.userData = INFO['海洋'];
    scene.add(water);

    /* ================= 岛屿地形（顶点色：沙滩→草地→岩石） ================= */
    const terrainGeo = new THREE.PlaneGeometry(34, 34, 90, 90);
    terrainGeo.rotateX(-Math.PI / 2);
    const tp = terrainGeo.attributes.position.array;
    const tColors = new Float32Array(tp.length);
    const sandC = new THREE.Color(0xdcc894), grassC = new THREE.Color(0x5fae5a), rockC = new THREE.Color(0x8a8578);
    for (let i = 0; i < tp.length; i += 3) {
      const x = tp[i], z = tp[i + 2];
      const r = Math.sqrt(x * x + z * z);
      const falloff = 1 - Math.min(Math.max((r - 8) / 6, 0), 1);
      let h = 2.2 * Math.exp(-(x * x + z * z) / 42)
            + 0.7 * S.fbm2(x * 0.3 + 5, z * 0.3 - 2, 4)
            + 0.25 * Math.sin(x * 1.4) * Math.cos(z * 1.2);
      h = Math.max(h * falloff - (1 - falloff) * 0.6, -0.6);
      tp[i + 1] = h;
      // 顶点色按海拔
      let c;
      if (h < 0.25) c = sandC;
      else if (h < 1.4) c = sandC.clone().lerp(grassC, (h - 0.25) / 1.15);
      else c = grassC.clone().lerp(rockC, Math.min((h - 1.4) / 1.2, 1));
      tColors[i] = c.r; tColors[i + 1] = c.g; tColors[i + 2] = c.b;
    }
    terrainGeo.setAttribute('color', new THREE.BufferAttribute(tColors, 3));
    terrainGeo.computeVertexNormals();
    const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.9, metalness: 0,
      flatShading: false,
    }));
    terrain.receiveShadow = true;
    scene.add(terrain);

    /* ================= 云（多层柔光精灵） ================= */
    function cloudSpriteTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 128;
      const ctx = c.getContext('2d');
      for (let i = 0; i < 26; i++) {
        const x = 30 + Math.random() * 196, y = 45 + Math.random() * 45;
        const r = 18 + Math.random() * 26;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,0.55)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      const t = new THREE.CanvasTexture(c);
      return t;
    }
    const cloudTex = cloudSpriteTexture();
    const clouds = [];
    const cloudDefs = [
      [-6, 9.5, -6, 4.5], [2, 10.5, -2, 5], [-10, 9, -1, 4], [7, 9.2, -5, 4],
      [0, 12, -9, 4.5], [10, 10.5, -3, 4], [-4, 11.5, 2, 3.5], [6, 12.5, -8, 4],
    ];
    cloudDefs.forEach(([x, y, z, s]) => {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: cloudTex, transparent: true, opacity: 0.72, depthWrite: false,
      }));
      sp.scale.set(s * 1.5, s * 0.75, 1);
      sp.position.set(x, y, z);
      sp.userData = INFO['云'];
      sp.userData._isCloud = true;
      scene.add(sp);
      clouds.push(sp);
    });

    /* ================= 蒸发粒子（上升水汽，Points） ================= */
    const EVAP_N = 140;
    const evapGeo = new THREE.BufferGeometry();
    const evapPos = new Float32Array(EVAP_N * 3);
    const evapPhase = new Float32Array(EVAP_N);
    for (let i = 0; i < EVAP_N; i++) {
      evapPhase[i] = Math.random() * Math.PI * 2;
    }
    evapGeo.setAttribute('position', new THREE.BufferAttribute(evapPos, 3));
    const evapMat = new THREE.PointsMaterial({
      color: 0xffcf8a, size: 0.22, transparent: true, opacity: 0.7,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    });
    const evap = new THREE.Points(evapGeo, evapMat);
    scene.add(evap);

    /* ================= 雨滴（线段雨 + additive） ================= */
    const RAIN_N = 320;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(RAIN_N * 6);
    const rainData = [];
    for (let i = 0; i < RAIN_N; i++) {
      rainData.push({ x: (Math.random() - 0.5) * 16, z: (Math.random() - 0.5) * 12 - 1, y: 4 + Math.random() * 7, v: 7 + Math.random() * 5 });
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.LineBasicMaterial({
      color: 0x8cc9ff, transparent: true, opacity: 0.4,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const rain = new THREE.LineSegments(rainGeo, rainMat);
    scene.add(rain);

    /* ================= 径流（流光小溪） ================= */
    const runoffCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(3.2, 2.6, -2.2),
      new THREE.Vector3(2.0, 1.6, -1.2),
      new THREE.Vector3(0.8, 0.8, -0.4),
      new THREE.Vector3(-0.2, 0.32, 0.2),
      new THREE.Vector3(-0.9, 0.28, 0.8),
    ]);
    const runoffMat = new THREE.ShaderMaterial({
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uTime;
        void main(){
          float flow = fract(vUv.y * 2.5 - uTime * 0.5);
          float pulse = smoothstep(0.0, 0.3, flow) * smoothstep(0.8, 0.3, flow);
          vec3 col = vec3(0.35, 0.75, 1.0) * (0.5 + pulse * 1.8);
          gl_FragColor = vec4(col, 0.45 + pulse * 0.5);
        }`,
    });
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(runoffCurve, 48, 0.09, 10, false), runoffMat));

    /* ================= 交互 ================= */
    const voice = S.createVoice();
    S.bindVoiceButton(document.getElementById('voiceBtn'), voice);
    const card = S.createCard(document.getElementById('card') || document.body);
    const picker = S.makePicker(camera, renderer.domElement);
    const fly = S.makeFly(camera, controls);

    const clickable = [sunDisc, ...clouds, water];
    picker.onHover(clickable, (obj) => {
      renderer.domElement.style.cursor = obj ? 'pointer' : 'grab';
    });
    picker.onClick(clickable, (obj) => {
      if (!obj) return;
      // 云的 userData 挂在 sprite 上
      let data = obj.userData, target = new THREE.Vector3();
      obj.getWorldPosition(target);
      if (!data || !data.name) return;
      card.show(data);
      voice.speak(data.name + '。' + (data.stats || []).map((s) => s.label + s.value).join('，') + '。' + (data.desc || []).join('，'));
      const dist = 6;
      const dir = camera.position.clone().sub(target).normalize();
      fly.flyTo(target.clone().add(dir.multiplyScalar(dist)), target, 1.1);
    });

    // 流程聚焦按钮
    const focusSpots = {
      '太阳': { pos: [-8, 12, 6], target: [-14, 14, -10] },
      '云': { pos: [0, 10, 14], target: [0, 9, 0] },
      '海洋': { pos: [8, 4, 12], target: [0, 0.5, 0] },
    };
    document.querySelectorAll('[data-focus]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.focus;
        const f = focusSpots[name];
        if (!f) return;
        fly.flyTo(new THREE.Vector3(...f.pos), new THREE.Vector3(...f.target), 1.2);
        const d = INFO[name];
        if (d) {
          setTimeout(() => {
            card.show(d);
            voice.speak(name + '。' + (d.stats || []).map((s) => s.label + s.value).join('，'));
          }, 900);
        }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      fly.flyTo(new THREE.Vector3(16, 9, 20), new THREE.Vector3(0, 3, 0), 1.2);
      card.hide();
    });

    let isPlaying = true;
    const clock = new THREE.Clock();
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying ? '<span class="sv-btn__icon">⏸</span><span>暂停</span>' : '<span class="sv-btn__icon">▶</span><span>播放</span>';
      if (!isPlaying) clock.getDelta();
    });

    /* ================= 动画 ================= */
    function animate() {
      const dt = clock.getDelta();
      if (isPlaying) {
        waterMat.uniforms.uTime.value += dt;
        runoffMat.uniforms.uTime.value += dt;
        // 云飘动
        clouds.forEach((c, i) => {
          c.position.x += dt * (0.25 + i * 0.04);
          if (c.position.x > 16) c.position.x = -16;
        });
        // 蒸发粒子：从海面升起
        const t = performance.now() / 1000;
        for (let i = 0; i < EVAP_N; i++) {
          const ph = evapPhase[i] + t * (0.4 + (i % 7) * 0.05);
          const cycle = (ph % (Math.PI * 2)) / (Math.PI * 2); // 0..1
          const y = 0.5 + cycle * 6;
          const spread = cycle * 2.5;
          evapPos[i * 3] = Math.sin(i * 2.1) * (2 + spread) + Math.sin(ph * 0.7) * 0.8;
          evapPos[i * 3 + 1] = y;
          evapPos[i * 3 + 2] = Math.cos(i * 1.7) * (2 + spread * 0.7) + Math.cos(ph * 0.6) * 0.8;
        }
        evapGeo.attributes.position.needsUpdate = true;
        // 雨
        for (let i = 0; i < RAIN_N; i++) {
          const r = rainData[i];
          r.y -= dt * r.v;
          if (r.y < 0.2) r.y = 4 + Math.random() * 7;
          rainPos[i * 6] = r.x; rainPos[i * 6 + 1] = r.y; rainPos[i * 6 + 2] = r.z;
          rainPos[i * 6 + 3] = r.x; rainPos[i * 6 + 4] = r.y - 0.35; rainPos[i * 6 + 5] = r.z;
        }
        rainGeo.attributes.position.needsUpdate = true;
      }
      fly.update(dt);
      controls.update();
      if (composer) composer.render();
      else renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    setTimeout(() => document.getElementById('loader').classList.add('is-done'), 400);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
